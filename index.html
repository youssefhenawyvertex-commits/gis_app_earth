// Mapbox يحتاج token في Leaflet. اتركه فاضي لو مش هتستخدمه.
const MAPBOX_TOKEN = "";

const BASEMAPS = {
  google: {
    label: "Google Earth",
    sub: "World Imagery",
    icon: "🌍",
  },
  esri: {
    label: "Esri Satellite",
    sub: "World Imagery",
    icon: "🛰️",
  },
  bing: {
    label: "Bing Satellite",
    sub: "World Imagery",
    icon: "🛰️",
  },
};

function bingQuadKey(x, y, z) {
  let quadKey = "";
  for (let i = z; i > 0; i--) {
    let digit = 0;
    const mask = 1 << (i - 1);
    if ((x & mask) !== 0) digit += 1;
    if ((y & mask) !== 0) digit += 2;
    quadKey += digit;
  }
  return quadKey;
}

const BingSatelliteLayer = L.TileLayer.extend({
  getTileUrl(coords) {
    const z = coords.z;
    const limit = 1 << z;
    const x = ((coords.x % limit) + limit) % limit;
    const y = coords.y;
    const q = bingQuadKey(x, y, z);
    const s = this.options.subdomains[Math.abs(x + y) % this.options.subdomains.length];

    return `https://ecn.t${s}.tiles.virtualearth.net/tiles/a${q}.jpeg?g=13521&n=z`;
  },
});

function createBaseMapLayer(type) {
  if (type === "esri") {
return L.tileLayer(
  "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
  {
    maxNativeZoom: 17,   // جرب 17 بدل 19
    maxZoom: 30,
    crossOrigin: true,
    updateWhenZooming: false,
    updateInterval: 0,
        attribution: "@  جميع  الحقوق محفوظه لدى حناوى و فوكس الحكيم و عمرو خالد وكريم",
  }
);
  }

  if (type === "bing") {
    return new BingSatelliteLayer("", {
      maxNativeZoom: 19,
      maxZoom: 28,
      subdomains: ["0", "1", "2", "3"],
      crossOrigin: true,
        attribution: "@  جميع  الحقوق محفوظه لدى حناوى و فوكس الحكيم و عمرو خالد وكريم",
    });
  }

  if (type === "mapbox") {
    if (!MAPBOX_TOKEN) {
      throw new Error("MAPBOX_TOKEN_REQUIRED");
    }

    return L.tileLayer(
      `https://api.mapbox.com/styles/v1/mapbox/satellite-v9/tiles/512/{z}/{x}/{y}@2x?access_token=${MAPBOX_TOKEN}`,
      {
        tileSize: 512,
        zoomOffset: -1,
        maxNativeZoom: 22,
        maxZoom: 28,
        crossOrigin: true,
        attribution: "Mapbox Satellite",
      }
    );
  }

  // Default: Google Earth / Google Satellite
  return L.tileLayer("https://mt{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}", {
    maxNativeZoom: 21,
    maxZoom: 28,
    crossOrigin: true,
    subdomains: ["0", "1", "2", "3"],
        attribution: "@  جميع  الحقوق محفوظه لدى حناوى و فوكس الحكيم و عمرو خالد وكريم",
  });
}

/* ══════════════════════════════════════════════════════════════════════════
   📋 طلباتي — MY ORDERS FEATURE
   ميزة مستقلة تمامًا (Supabase client خاص بيها + منطقها) لا تؤثر على باقي
   الموقع. تتصل بنفس مشروع Supabase وجدول system_review1 المستخدمين في
   ملف script.js الأصلي، وتستخدم بالضبط نفس أسماء الأعمدة وقيم الحالة
   (review_status: مقبول / مرفوض / معلق) وrejection_reason.
   ══════════════════════════════════════════════════════════════════════════ */

// نفس بيانات الاتصال وجدول المراجعة الموجودين في script.js — بدون أي تغيير.
// بيانات Supabase بتتقري من config.js (مش متسجل في git) — شوف config.example.js
const MYORDERS_CFG = (window.APP_CONFIG && window.APP_CONFIG.supabase) || {};
const MYORDERS_SUPABASE_URL = MYORDERS_CFG.url || '';
const MYORDERS_SUPABASE_ANON_KEY = MYORDERS_CFG.anonKey || '';
const MYORDERS_TABLE_NAME = MYORDERS_CFG.table || 'system_review1';

// نفس قيم الحالة الحقيقية المستخدمة في script.js — لا تُخترع قيم جديدة.
const MYORDERS_STATUS_ACCEPTED = 'مقبول';
const MYORDERS_STATUS_REJECTED = 'مرفوض';
const MYORDERS_STATUS_PENDING  = 'معلق';
const MYORDERS_REASON_STATUSES = [MYORDERS_STATUS_REJECTED, MYORDERS_STATUS_PENDING];

// Client واحد فقط لهذه الميزة، يُنشأ مرة واحدة (نفس نمط script.js: لا تكرار للاتصال).
let myOrdersSupabaseClient = null;
function getMyOrdersSupabaseClient() {
  if (!MYORDERS_SUPABASE_URL || !MYORDERS_SUPABASE_ANON_KEY) return null;   // «طلباتي» مش متظبطة
  if (!myOrdersSupabaseClient && window.supabase && window.supabase.createClient) {
    myOrdersSupabaseClient = window.supabase.createClient(MYORDERS_SUPABASE_URL, MYORDERS_SUPABASE_ANON_KEY);
  }
  return myOrdersSupabaseClient;
}

// نفس منطق قراءة رقم الطلب/الحالة/السبب الموجود في script.js (renderTable) مع fallback للأعمدة العربية القديمة.
function myOrdersGetOrderNumber(o) { return o.order_number || o.order_no || o['رقم الطلب'] || '-'; }
function myOrdersGetStatus(o) { return o.review_status || o['حالة المراجعة'] || 'لم يتم المراجعة'; }
function myOrdersGetReason(o) { return o.rejection_reason || o.reason || o['سبب الرفض'] || ''; }
function myOrdersGetCompany(o) { return o.company || o['الشركة'] || '-'; }
function myOrdersGetProgress(o) { return o.status || o['الحالة'] || '-'; }
function myOrdersGetDate(o) { return o.date || o.created_at || o['التاريخ'] || o['تاريخ الطلب'] || '-'; }

// نفس دوال parseToIsoDate و extractDateString الموجودة في script.js بالظبط — لتحديد تاريخ الطلب بصيغة موحدة.
function myOrdersParseToIsoDate(dateStr) {
  if (!dateStr) return '';
  const strVal = String(dateStr).trim();

  if (strVal.includes('/')) {
    const parts = strVal.split(' ')[0].split('/');
    if (parts.length === 3) {
      let month = parseInt(parts[0], 10);
      let day = parseInt(parts[1], 10);
      let year = parseInt(parts[2], 10);
      if (year < 100) year += 2000;
      return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
    }
  }

  const cleanStr = strVal.split(' ')[0];
  if (/^\d{4}-\d{2}-\d{2}$/.test(cleanStr)) return cleanStr;
  return '';
}
function myOrdersExtractDateString(item) {
  return myOrdersParseToIsoDate(item.date || item.created_at || item['التاريخ'] || item['تاريخ الطلب'] || '');
}
// تاريخ اليوم بتوقيت مصر (Africa/Cairo) بصيغة YYYY-MM-DD، بغض النظر عن توقيت جهاز المستخدم نفسه.
function myOrdersTodayCairoIso() {
  const fmt = new Intl.DateTimeFormat('en-CA', { timeZone: 'Africa/Cairo', year: 'numeric', month: '2-digit', day: '2-digit' });
  return fmt.format(new Date());
}

// نفس تعريف "معلق" المستخدم في updateKPIs بملف script.js: كل ما هو ليس مقبول وليس مرفوض.
function myOrdersIsPending(o) {
  const s = myOrdersGetStatus(o);
  return s !== MYORDERS_STATUS_ACCEPTED && s !== MYORDERS_STATUS_REJECTED;
}

function MyOrdersPanel() {
  const [checkingSession, setCheckingSession] = useState(true);
  const [session, setSession] = useState(null); // { id, username, name, role }

  const [loginUsername, setLoginUsername] = useState('');
  const [loginPassword, setLoginPassword] = useState('');
  const [loginError, setLoginError] = useState('');
  const [loggingIn, setLoggingIn] = useState(false);

  const [orders, setOrders] = useState([]);
  const [loadingOrders, setLoadingOrders] = useState(false);
  const [ordersError, setOrdersError] = useState('');

  const [search, setSearch] = useState('');
  // رقم الطلب الحالي المفتوح في الكارت — بيتخزن في localStorage عشان لو المستخدم
  // بدّل لتاب الأدوات ورجع (أو حتى عمل Reload) يفضل على نفس الطلب ومايبدأ من الأول.
  const [cursorNum, setCursorNum] = useState(null);
  // كارت التفاصيل مايظهرش غير لما المستخدم يدوس على طلب من الجدول
  const [detailsOpen, setDetailsOpen] = useState(false);

  // مفيش اختيار افتراضي — المستخدم لازم يدوس بنفسه على مقبول/مرفوض/معلق (مفيش سيلكت تلقائي)
  const [editStatus, setEditStatus] = useState(null);
  const [editReason, setEditReason] = useState('');
  const [saving, setSaving] = useState(false);
  const [saveError, setSaveError] = useState('');
  const [savedFlash, setSavedFlash] = useState(false);
  const [copied, setCopied] = useState(false);

  const realtimeChannelRef = React.useRef(null);

  // ── فحص جلسة موجودة بالفعل عند فتح تاب "طلباتي" أول مرة ──
  useEffect(() => {
    let cancelled = false;
    (async () => {
      const client = getMyOrdersSupabaseClient();
      if (!client) { setCheckingSession(false); return; }
      setCheckingSession(true);
      try {
        const { data: { session: authSession } } = await client.auth.getSession();
        if (authSession && authSession.user) {
          const { data: profile, error } = await client
            .from('profiles')
            .select('id, username, name, role')
            .eq('id', authSession.user.id)
            .single();
          if (!cancelled && !error && profile) setSession(profile);
        }
      } catch (e) { /* تجاهل — يظل شاشة تسجيل الدخول */ }
      if (!cancelled) setCheckingSession(false);
    })();
    return () => { cancelled = true; };
  }, []);

  const loadMyOrders = React.useCallback(async () => {
    const client = getMyOrdersSupabaseClient();
    if (!client || !session) return;
    setLoadingOrders(true);
    setOrdersError('');
    try {
      const orFilter = 'reviewer.eq."' + session.username + '",reviewer.eq."' + session.name + '"';
      let allFetched = [];
      let from = 0, step = 1000, hasMore = true;
      while (hasMore) {
        const { data, error } = await client
          .from(MYORDERS_TABLE_NAME)
          .select('*')
          .or(orFilter)
          .order('id', { ascending: true })
          .range(from, from + step - 1);
        if (error) throw error;
        if (data && data.length > 0) {
          allFetched = allFetched.concat(data);
          from += step;
          if (data.length < step) hasMore = false;
        } else { hasMore = false; }
      }
      const todayIso = myOrdersTodayCairoIso();
      setOrders(allFetched.filter((o) => myOrdersExtractDateString(o) === todayIso));
    } catch (e) {
      setOrdersError('حصل خطأ أثناء جلب طلباتك: ' + e.message);
    } finally {
      setLoadingOrders(false);
    }
  }, [session]);

  useEffect(() => { if (session) loadMyOrders(); }, [session, loadMyOrders]);

  // ── Realtime: تحديث فوري بدون Reload، لكن فقط للطلبات الخاصة بالمستخدم الحالي ──
  useEffect(() => {
    const client = getMyOrdersSupabaseClient();
    if (!client || !session) return;

    const belongsToMe = (row) => {
      if (!row) return false;
      const r = row.reviewer || row['المراجع'] || '';
      const isMine = r === session.username || r === session.name;
      const isToday = myOrdersExtractDateString(row) === myOrdersTodayCairoIso();
      return isMine && isToday;
    };

    const topicName = 'my-orders-live-' + session.username + '-' + uid();
    try {
      client.getChannels()
        .filter((ch) => ch.topic && ch.topic.indexOf('my-orders-live-') !== -1 && ch !== realtimeChannelRef.current)
        .forEach((ch) => { try { client.removeChannel(ch); } catch (e) {} });
    } catch (e) { /* تجاهل */ }

    const channel = client.channel(topicName);
    channel.on('postgres_changes', { event: '*', schema: 'public', table: MYORDERS_TABLE_NAME }, (payload) => {
      const { eventType, new: newRow, old: oldRow } = payload;
      setOrders((prev) => {
        if (eventType === 'DELETE') return prev.filter((o) => o.id !== (oldRow && oldRow.id));
        if (!belongsToMe(newRow)) return prev.filter((o) => o.id !== (newRow && newRow.id));
        const idx = prev.findIndex((o) => o.id === newRow.id);
        const updated = idx === -1 ? [...prev, newRow] : prev.slice();
        if (idx !== -1) updated[idx] = newRow;
        updated.sort((a, b) => (a.id > b.id ? 1 : a.id < b.id ? -1 : 0));
        return updated;
      });
    });
    channel.subscribe();

    realtimeChannelRef.current = channel;
    return () => {
      try { client.removeChannel(channel); } catch (e) {}
      if (realtimeChannelRef.current === channel) realtimeChannelRef.current = null;
    };
  }, [session]);

  async function handleMyOrdersLogin() {
    const client = getMyOrdersSupabaseClient();
    setLoginError('');
    const username = loginUsername.trim();
    const password = loginPassword.trim();
    if (!username || !password) { setLoginError('يرجى كتابة اسم المستخدم وكلمة المرور'); return; }
    if (!client) { setLoginError('تعذّر الاتصال بالخادم. حاول تحديث الصفحة.'); return; }

    setLoggingIn(true);
    try {
      const { data: email, error: lookupError } = await client.rpc('get_login_email', { p_username: username });
      if (lookupError || !email) { setLoginError('اسم المستخدم أو كلمة المرور غير صحيحة'); return; }

      const { data: authData, error: authError } = await client.auth.signInWithPassword({ email, password });
      if (authError || !authData.user) { setLoginError('اسم المستخدم أو كلمة المرور غير صحيحة'); return; }

      const { data: profile, error: profileError } = await client
        .from('profiles')
        .select('id, username, name, role')
        .eq('id', authData.user.id)
        .single();
      if (profileError || !profile) {
        setLoginError('تم تسجيل الدخول لكن لا يوجد بروفايل مرتبط بهذا الحساب. راجع الأدمن');
        await client.auth.signOut();
        return;
      }
      // تحديث session فقط هنا؛ الـ useEffect المرتبط بـ session
      // سيشغّل loadRejections مباشرة بعد اكتمال React state،
      // وبالتالي يظهر التحذير فور أول تسجيل دخول بدون Refresh.
      setSession(profile);
    } catch (e) {
      setLoginError('حصل خطأ غير متوقع أثناء تسجيل الدخول');
    } finally {
      setLoggingIn(false);
    }
  }

  async function handleMyOrdersLogout() {
    const client = getMyOrdersSupabaseClient();
    if (client) { try { await client.auth.signOut(); } catch (e) {} }
    setSession(null);
    setOrders([]);
    setCursorNum(null);
    setLoginUsername('');
    setLoginPassword('');
  }

  const stats = React.useMemo(() => {
    const total = orders.length;
    const accepted = orders.filter((o) => myOrdersGetStatus(o) === MYORDERS_STATUS_ACCEPTED).length;
    const rejected = orders.filter((o) => myOrdersGetStatus(o) === MYORDERS_STATUS_REJECTED).length;
    return { total, accepted, rejected, reviewed: accepted + rejected, pending: total - accepted - rejected };
  }, [orders]);

  // ── مؤشر الطلب الحالي: يُستعاد من localStorage، ولو الطلب المحفوظ مش موجود يبدأ من أول طلب ──
  const cursorKey = session ? 'myorders-cursor-' + session.username : null;
  useEffect(() => {
    if (!session || orders.length === 0) return;
    const has = (n) => n !== null && orders.some((o) => String(myOrdersGetOrderNumber(o)) === String(n));
    if (has(cursorNum)) return;
    let saved = null;
    try { saved = localStorage.getItem(cursorKey); } catch (e) {}
    setCursorNum(has(saved) ? saved : String(myOrdersGetOrderNumber(orders[0])));
  }, [session, orders, cursorNum, cursorKey]);

  useEffect(() => {
    if (!cursorKey || cursorNum === null) return;
    try { localStorage.setItem(cursorKey, String(cursorNum)); } catch (e) {}
  }, [cursorNum, cursorKey]);

  const cursorIndex = orders.findIndex((o) => String(myOrdersGetOrderNumber(o)) === String(cursorNum));
  const current = cursorIndex === -1 ? null : orders[cursorIndex];

  useEffect(() => {
    if (!current) return;
    const st = myOrdersGetStatus(current);
    // مفيش سيلكت تلقائي على "مقبول" — لو الطلب له حالة محفوظة بالفعل (مقبول/مرفوض/معلق)
    // بنعرضها زي ما هي، ولو لسه من غير حالة بنسيب الاختيار فاضي لحد ما المستخدم يدوس بنفسه.
    setEditStatus([MYORDERS_STATUS_ACCEPTED, MYORDERS_STATUS_REJECTED, MYORDERS_STATUS_PENDING].includes(st) ? st : null);
    setEditReason(myOrdersGetReason(current) === '-' ? '' : myOrdersGetReason(current));
    setSaveError('');
    setSavedFlash(false);
  }, [cursorNum]); // eslint-disable-line

  function goToIndex(i) {
    if (i < 0 || i >= orders.length) return;
    setCursorNum(String(myOrdersGetOrderNumber(orders[i])));
  }

  const tableRows = React.useMemo(() => {
    const q = search.trim().toLowerCase();
    if (!q) return orders;
    return orders.filter((o) =>
      String(myOrdersGetOrderNumber(o)).toLowerCase().includes(q) ||
      String(myOrdersGetCompany(o)).toLowerCase().includes(q)
    );
  }, [orders, search]);

  async function copyOrderNumber() {
    if (!current) return;
    const text = String(myOrdersGetOrderNumber(current));
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        await navigator.clipboard.writeText(text);
      } else {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
      setCopied(true);
      // ربط المنظومة: أول ما تنسخ رقم الطلب يتفتح تلقائيًا في نافذة المنظومة (بحث ← مراجعة)
      try { if (window.LSBridge && window.LSBridge.autoTrigger === "copy") window.LSBridge.openOrder(text); } catch (e) { /* ignore */ }
      setTimeout(() => setCopied(false), 1500);
    } catch (e) { /* تجاهل فشل النسخ بصمت */ }
  }

  async function saveDecision(status) {
    if (!current || !session) return;
    setSaveError('');

    if (!status) { setSaveError('اختر الحالة الأول (مقبول / مرفوض / معلق)'); return; }

    const reviewerOnRow = current.reviewer || current['المراجع'] || '';
    const isOwnOrder = reviewerOnRow === session.username || reviewerOnRow === session.name;
    if (!isOwnOrder) { setSaveError('غير مسموح لك بتعديل هذا الطلب، لأنه غير مخصص لك.'); return; }

    if (MYORDERS_REASON_STATUSES.includes(status) && !editReason.trim()) {
      setSaveError(status === MYORDERS_STATUS_PENDING ? 'يرجى كتابة سبب التعليق' : 'يرجى كتابة سبب الرفض');
      return;
    }

    const client = getMyOrdersSupabaseClient();
    const matchColumn = current.id !== undefined ? 'id' : 'order_number';
    const matchValue = current[matchColumn];
    const finalReason = MYORDERS_REASON_STATUSES.includes(status) ? editReason.trim() : '-';

    const updateData = {};
    if ('review_status' in current) updateData.review_status = status;
    if ('حالة المراجعة' in current) updateData['حالة المراجعة'] = status;
    if ('rejection_reason' in current) updateData.rejection_reason = finalReason;
    if ('سبب الرفض' in current) updateData['سبب الرفض'] = finalReason;

    const rowIndex = cursorIndex;
    setSaving(true);
    try {
      const { data: updatedRows, error } = await client
        .from(MYORDERS_TABLE_NAME)
        .update(updateData)
        .eq(matchColumn, matchValue)
        .eq('reviewer', reviewerOnRow)
        .select();

      if (error) {
        setSaveError('فشل التحديث: ' + error.message);
      } else if (!updatedRows || updatedRows.length === 0) {
        setSaveError('لم يتم حفظ التعديل. حدّث الصفحة وحاول مرة أخرى.');
      } else {
        setOrders((prev) => prev.map((o) => (o === current ? { ...o, ...updateData } : o)));
        // الطلب اتقبل/اترفض/اتعلق → امسح طبقات الخريطة على طول (زي Shift+D)
        try { window.dispatchEvent(new CustomEvent("myorders:decided", { detail: { status } })); } catch (e) {}
        setSavedFlash(true);
        setTimeout(() => setSavedFlash(false), 1200);
        if (rowIndex + 1 < orders.length) {
          const nextNum = String(myOrdersGetOrderNumber(orders[rowIndex + 1]));
          setCursorNum(nextNum);
          // ربط المنظومة: بعد الحفظ، الطلب التالي يتفتح تلقائيًا في نافذة المنظومة برضو
          // (لو خانة "فتح الطلب في المنظومة تلقائيًا" مفعّلة من لوحة 🛰️)
          try { if (window.LSBridge && window.LSBridge.autoTrigger === "save") window.LSBridge.openOrder(nextNum); } catch (e) { /* تجاهل */ }
        }
      }
    } catch (e) {
      setSaveError('خطأ: ' + e.message);
    } finally {
      setSaving(false);
    }
  }

  const STATUS_TONE = {
    [MYORDERS_STATUS_ACCEPTED]: { solid: 'oklch(0.58 0.14 150)', bg: 'oklch(0.93 0.06 150)', fg: 'oklch(0.38 0.11 150)' },
    [MYORDERS_STATUS_REJECTED]: { solid: 'oklch(0.58 0.16 25)',  bg: 'oklch(0.93 0.06 25)',  fg: 'oklch(0.40 0.14 25)' },
    [MYORDERS_STATUS_PENDING]:  { solid: 'oklch(0.68 0.13 85)',  bg: 'oklch(0.94 0.06 85)',  fg: 'oklch(0.42 0.10 85)' },
  };
  const toneFor = (st) => STATUS_TONE[st] || STATUS_TONE[MYORDERS_STATUS_PENDING];

  if (checkingSession) {
    return <div className="py-8 text-center text-[12px] text-[var(--ink-soft)]">جاري التحقق من الجلسة...</div>;
  }

  if (!session) {
    return (
      <div className="space-y-3">
        <div className="text-center mb-1">
          <div className="text-[12.5px] font-bold text-[var(--ink)]">تسجيل الدخول لعرض طلباتك</div>
          <div className="text-[10.5px] text-[var(--ink-soft)] mt-1">استخدم نفس اليوزر والباسورد الخاصين بك</div>
        </div>
        <input
          type="text"
          value={loginUsername}
          onChange={(e) => setLoginUsername(e.target.value)}
          placeholder="اسم المستخدم"
          className="w-full h-9 rounded-lg border border-[var(--line)] bg-[var(--panel)] px-3 text-[12.5px] text-[var(--ink)] placeholder:text-[var(--muted)] focus:outline-none focus:border-[var(--accent)] transition"
          onKeyDown={(e) => { if (e.key === 'Enter') handleMyOrdersLogin(); }}
        />
        <input
          type="password"
          value={loginPassword}
          onChange={(e) => setLoginPassword(e.target.value)}
          placeholder="كلمة المرور"
          className="w-full h-9 rounded-lg border border-[var(--line)] bg-[var(--panel)] px-3 text-[12.5px] text-[var(--ink)] placeholder:text-[var(--muted)] focus:outline-none focus:border-[var(--accent)] transition"
          onKeyDown={(e) => { if (e.key === 'Enter') handleMyOrdersLogin(); }}
        />
        {loginError && (
          <div className="text-[11.5px] text-center rounded-lg px-3 py-2" style={{ background: 'oklch(0.92 0.07 25)', color: 'oklch(0.4 0.15 25)' }}>
            {loginError}
          </div>
        )}
        <button
          onClick={handleMyOrdersLogin}
          disabled={loggingIn}
          className="w-full h-9 rounded-lg font-semibold text-[12.5px] text-white transition disabled:opacity-60"
          style={{ background: 'var(--accent)' }}
        >
          {loggingIn ? 'جاري الدخول...' : '🔐 تسجيل الدخول'}
        </button>
      </div>
    );
  }

  const currentStatus = current ? myOrdersGetStatus(current) : null;

  return (
    <div className="space-y-2.5">
      <style>{`
        @keyframes myoDetailIn { from { opacity:0; transform: translateY(14px) scale(.98); } to { opacity:1; transform:none; } }
      `}</style>

      {/* ── الإحصائيات: كارت واحد بأربعة أعمدة ── */}
      <div className="rounded-2xl border border-[var(--line)] bg-[var(--panel)] grid grid-cols-4">
        {[
          { label: 'الإجمالي', value: stats.total, color: 'var(--ink)' },
          { label: 'مراجعة', value: stats.reviewed, color: 'var(--ink-soft)' },
          { label: 'مقبول', value: stats.accepted, color: STATUS_TONE[MYORDERS_STATUS_ACCEPTED].solid },
          { label: 'مرفوض', value: stats.rejected, color: STATUS_TONE[MYORDERS_STATUS_REJECTED].solid },
        ].map((k, i) => (
          <div
            key={k.label}
            className="px-1 py-2.5 text-center"
            style={i === 0 ? undefined : { borderRight: '1px solid var(--line)' }}
          >
            <div className="text-[16px] font-bold font-mono leading-none" style={{ color: k.color }} dir="ltr">
              {k.value.toLocaleString('en-US')}
            </div>
            <div className="text-[9.5px] text-[var(--ink-soft)] mt-1 truncate">{k.label}</div>
          </div>
        ))}
      </div>

      {/* شريط المستخدم الحالي */}
      <div className="flex items-center justify-between gap-2 rounded-xl border border-[var(--line)] bg-[var(--panel)] px-3 py-2">
        <div className="min-w-0">
          <div className="text-[12px] font-semibold text-[var(--ink)] truncate">{session.name}</div>
          <div className="text-[10px] text-[var(--ink-soft)]">{session.role === 'admin' ? 'أدمن' : 'مراجع'}</div>
        </div>
        <button
          onClick={handleMyOrdersLogout}
          className="text-[10.5px] font-semibold px-2.5 py-1 rounded-md border border-[var(--line)] bg-[var(--panel-2)] hover:bg-[var(--line-2)] text-[var(--ink-soft)] transition shrink-0"
        >
          تسجيل الخروج
        </button>
      </div>

      {ordersError && (
        <div className="text-[11.5px] rounded-lg px-3 py-2" style={{ background: 'oklch(0.92 0.07 25)', color: 'oklch(0.4 0.15 25)' }}>
          {ordersError}
        </div>
      )}

      {/* ── جدول الطلبات: اضغط على أي طلب لفتح التفاصيل ── */}
      <div className="relative">
        <span className="absolute right-3 top-1/2 -translate-y-1/2 text-[var(--ink-soft)]">
          <Icon name="search" size={13} />
        </span>
        <input
          type="text"
          value={search}
          onChange={(e) => setSearch(e.target.value)}
          placeholder="ابحث برقم الطلب أو الشركة..."
          className="w-full h-10 rounded-xl border border-[var(--line)] bg-[var(--panel)] pr-9 pl-3 text-[12.5px] text-[var(--ink)] placeholder:text-[var(--muted)] focus:outline-none focus:border-[var(--accent)] transition"
        />
      </div>

{/* ── تفاصيل الطلب المحدد: تظهر فقط بعد الضغط على طلب من الجدول ── */}
      {detailsOpen && (
      <div className="space-y-2.5" style={{ animation:'myoDetailIn .3s cubic-bezier(.2,.85,.25,1) both' }}>
      <div className="flex items-center justify-between gap-2 mt-1">
        <div className="min-w-0">
          <div className="text-[12.5px] font-bold text-[var(--ink)]">تفاصيل الطلب المحدد</div>
        </div>
<div className="flex items-center gap-1.5 shrink-0">
  <button onClick={() => setDetailsOpen(false)} title="إغلاق" className="w-7 h-7 grid place-items-center rounded-lg border border-[var(--line)] bg-[var(--panel-2)] text-[var(--ink-soft)] hover:bg-[var(--line-2)] transition text-[11px]">✕</button>
</div>
        </div>
      {loadingOrders && orders.length === 0 ? (
        <div className="rounded-2xl border border-[var(--line)] bg-[var(--panel)] p-6 text-center text-[11.5px] text-[var(--ink-soft)]">
          جاري تحميل الطلبات...
        </div>
      ) : !current ? (
        <div className="rounded-2xl border border-[var(--line)] bg-[var(--panel)] p-6 text-center text-[11.5px] text-[var(--ink-soft)]">
          لا توجد طلبات لك اليوم
        </div>
      ) : (
        <div key={String(cursorNum || "selected")} className="order-detail-card rounded-2xl border border-[var(--line)] bg-[var(--panel)] overflow-hidden shadow-sm">
          {/* رقم الطلب + نسخ */}
          <div className="px-3.5 pt-3 pb-3 flex items-start justify-between gap-2 border-b border-[var(--line)]">
            <div className="min-w-0">
              <div className="text-[9.5px] tracking-wide text-[var(--ink-soft)]">رقم الطلب</div>
              <div className="text-[16px] font-bold font-mono text-[var(--ink)] leading-tight break-all mt-0.5" dir="ltr">
                {myOrdersGetOrderNumber(current)}
              </div>
            </div>
            <button
              onClick={copyOrderNumber}
              className="text-[10.5px] font-semibold px-2.5 py-1.5 rounded-lg border transition shrink-0 whitespace-nowrap"
              style={copied
                ? { background: STATUS_TONE[MYORDERS_STATUS_ACCEPTED].bg, color: STATUS_TONE[MYORDERS_STATUS_ACCEPTED].fg, borderColor: 'transparent' }
                : { background: 'var(--panel-2)', color: 'var(--ink-soft)', borderColor: 'var(--line)' }}
            >
              {copied ? '✓ تم النسخ' : 'نسخ'}
            </button>
          </div>

          {/* نوع الطلب + الشركة + حالة المراجعة الحالية */}
          <div className="px-3.5 py-3 space-y-2">
            <div className="flex items-center justify-between gap-2">
              <span className="text-[10.5px] text-[var(--ink-soft)]">نوع الطلب</span>
              <span className="text-[11.5px] font-semibold text-[var(--ink)] px-2 py-0.5 rounded-md bg-[var(--panel-2)] border border-[var(--line)] truncate">
                {myOrdersGetProgress(current)}
              </span>
            </div>
            <div className="flex items-center justify-between gap-2">
              <span className="text-[10.5px] text-[var(--ink-soft)]">الشركة</span>
              <span className="text-[11.5px] font-semibold text-[var(--ink)] truncate">{myOrdersGetCompany(current)}</span>
            </div>
            <div className="flex items-center justify-between gap-2">
              <span className="text-[10.5px] text-[var(--ink-soft)]">حالة المراجعة</span>
              <span className="text-[10.5px] font-semibold px-2 py-0.5 rounded-full" style={{ background: toneFor(currentStatus).bg, color: toneFor(currentStatus).fg }}>
                {currentStatus}
              </span>
            </div>
          </div>

          {/* أزرار القرار */}
          <div className="px-3.5 pb-3 space-y-2">
            <div className="grid grid-cols-3 gap-1.5">
              {[
                { key: MYORDERS_STATUS_ACCEPTED, label: 'مقبول' },
                { key: MYORDERS_STATUS_REJECTED, label: 'مرفوض' },
                { key: MYORDERS_STATUS_PENDING, label: 'معلق' },
              ].map((s) => {
                const on = editStatus === s.key;
                const t = STATUS_TONE[s.key];
                return (
                  <button
                    key={s.key}
                    onClick={() => { setEditStatus(s.key); setSaveError(''); }}
                    className="h-9 rounded-xl text-[11.5px] font-bold border transition"
                    style={on
                      ? { background: t.solid, color: '#fff', borderColor: t.solid }
                      : { background: 'var(--panel-2)', color: 'var(--ink-soft)', borderColor: 'var(--line)' }}
                  >
                    {s.label}
                  </button>
                );
              })}
            </div>

            {MYORDERS_REASON_STATUSES.includes(editStatus) && (
              <textarea
                value={editReason}
                onChange={(e) => setEditReason(e.target.value)}
                placeholder={editStatus === MYORDERS_STATUS_PENDING ? 'سبب التعليق...' : 'سبب الرفض...'}
                rows={2}
                className="w-full rounded-xl border border-[var(--line)] bg-[var(--panel-2)] px-2.5 py-2 text-[12px] text-[var(--ink)] placeholder:text-[var(--muted)] focus:outline-none focus:border-[var(--accent)] transition resize-none"
              />
            )}

            {saveError && (
              <div className="text-[11px] rounded-lg px-2.5 py-2" style={{ background: 'oklch(0.92 0.07 25)', color: 'oklch(0.4 0.15 25)' }}>
                {saveError}
              </div>
            )}

            <button
              onClick={() => saveDecision(editStatus)}
              disabled={saving || !editStatus}
              className="w-full h-9 rounded-xl font-bold text-[12px] text-white transition disabled:opacity-60"
              style={{ background: savedFlash ? STATUS_TONE[MYORDERS_STATUS_ACCEPTED].solid : 'var(--accent)' }}
            >
              {saving ? 'جاري الحفظ...' : savedFlash ? '✓ تم الحفظ' : !editStatus ? 'اختر الحالة الأول' : 'حفظ والانتقال للتالي'}
            </button>
          </div>

          {/* تنقل: السابق / التالي */}
          <div className="flex items-center justify-between gap-2 px-3.5 py-2.5 border-t border-[var(--line)] bg-[var(--panel-2)]">
            <button
              onClick={() => goToIndex(cursorIndex - 1)}
              disabled={cursorIndex <= 0}
              className="text-[11px] font-semibold px-3 py-1.5 rounded-lg border border-[var(--line)] bg-[var(--panel)] text-[var(--ink)] transition hover:border-[var(--accent)] disabled:opacity-40"
            >
              الطلب السابق
            </button>
            <span className="text-[10.5px] font-mono text-[var(--ink-soft)]" dir="ltr">
              {(cursorIndex + 1) + ' / ' + orders.length}
            </span>
            <button
              onClick={() => goToIndex(cursorIndex + 1)}
              disabled={cursorIndex >= orders.length - 1}
              className="text-[11px] font-semibold px-3 py-1.5 rounded-lg border transition disabled:opacity-40"
              style={{ background: 'var(--accent)', color: '#fff', borderColor: 'var(--accent)' }}
            >
              الطلب التالي
            </button>
          </div>
        </div>
      )}
      </div>
      )}

      <div className="rounded-2xl border border-[var(--line)] bg-[var(--panel-2)] overflow-hidden">
        <div className="grid grid-cols-[1fr_auto] items-center gap-2 px-3 py-2 border-b border-[var(--line)]">
          <span className="text-[11.5px] font-bold text-[var(--ink)]">كل الطلبات <span className="font-normal text-[var(--ink-soft)]">— اضغط على الطلب لفتح التفاصيل</span></span>
          <span className="text-[10.5px] font-mono font-semibold text-[var(--ink-soft)] bg-[var(--panel)] border border-[var(--line)] rounded-full px-2 py-0.5">
            {tableRows.length.toLocaleString('en-US')}
          </span>
        </div>
        <div className="grid grid-cols-[1.2fr_1fr_0.9fr] gap-2 px-3 py-1.5 text-[9.5px] font-semibold text-[var(--ink-soft)] bg-[var(--panel)] border-b border-[var(--line)]">
          <span>رقم الطلب</span>
          <span>الشركة</span>
          <span>الطلب</span>
        </div>
        <div className="max-h-[300px] overflow-y-auto scroll-thin">
          {tableRows.length === 0 ? (
            <div className="p-5 text-center text-[11.5px] text-[var(--ink-soft)]">لا توجد نتائج مطابقة</div>
          ) : (
            tableRows.map((o) => {
              const num = String(myOrdersGetOrderNumber(o));
              const isCurrent = num === String(cursorNum);
              const t = toneFor(myOrdersGetStatus(o));
              return (
                <button
                  key={o.id || num}
                  onClick={() => { setCursorNum(num); setDetailsOpen(true); }}
                  className="order-table-row w-full text-right grid grid-cols-[1.2fr_1fr_0.9fr] gap-2 items-center px-3 py-2.5 border-b border-[var(--line)] transition cursor-pointer"
                  style={isCurrent
                    ? { background: 'var(--panel)', boxShadow: 'inset 2px 0 0 var(--accent)' }
                    : { background: 'transparent' }}
                >
                  <span className="flex items-center gap-1.5 min-w-0">
                    <span className="w-1.5 h-1.5 rounded-full shrink-0" style={{ background: t.solid }} />
                    <span className="text-[10.5px] font-mono font-bold text-[var(--ink)] truncate" dir="ltr">{num}</span>
                  </span>
                  <span className="text-[10.5px] text-[var(--ink-soft)] truncate">{myOrdersGetCompany(o)}</span>
                  <span className="text-[10px] text-[var(--ink-soft)] truncate">{myOrdersGetProgress(o)}</span>
                </button>
              );
            })
          )}
        </div>
      </div>

      

    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════════════
   🚫 مرفوضاتي — مأخوذة من منطق تاب المرفوضات الموجود في script.js
   لا يوجد Login مستقل: تستخدم نفس Supabase Auth session الخاصة بـ "طلباتي".
   ══════════════════════════════════════════════════════════════════════════ */
const MYREJECTIONS_TABLE_NAME = 'layout';

/* ─────────────────────────────────────────────────────────────
   🔔 نغمة التحذير للطلب المرفوض
   حِطّ ملف الصوت بجوار الصفحة وسمّيه: rejection-alert.mp3
   (أو غيّر الاسم/المسار في السطر اللي تحت)
   المدة المقترحة: 5 ثواني — الكود بيوقفها تلقائيًا بعد 5 ثواني.
   ───────────────────────────────────────────────────────────── */
const REJECTION_ALERT_SOUND = 'rejection-alert.mp3';
const REJECTION_ALERT_VOLUME = 0.8;
const REJECTION_ALERT_SECONDS = 5;

let _rejAlertAudio = null;
let _rejAlertStopTimer = null;
let _rejAlertPendingRetry = false;
let _rejAlertUserInteracted = false;

function markRejectionAlertUnlocked() {
  if (_rejAlertUserInteracted) return;
  _rejAlertUserInteracted = true;
  document.removeEventListener('click', markRejectionAlertUnlocked, true);
  document.removeEventListener('keydown', markRejectionAlertUnlocked, true);
  document.removeEventListener('touchstart', markRejectionAlertUnlocked, true);

  // لو كان فيه صوت مستنّي إذن، شغّله فورًا دلوقتي
  if (_rejAlertPendingRetry) {
    _rejAlertPendingRetry = false;
    playRejectionAlert();
  }
}

// نعلّق الاستماع لأول تفاعل من أول ما الصفحة تفتح — مش بعد ما الصوت يترفض.
// كده كتابة اليوزرنيم/الباسورد نفسها (keydown) بتفتح إمكانية تشغيل الصوت مقدّمًا،
// قبل ما يحصل أي رفض فعلي.
if (typeof document !== 'undefined') {
  document.addEventListener('click', markRejectionAlertUnlocked, true);
  document.addEventListener('keydown', markRejectionAlertUnlocked, true);
  document.addEventListener('touchstart', markRejectionAlertUnlocked, true);
}

function playRejectionAlert() {
  try {
    clearTimeout(_rejAlertStopTimer);

    if (_rejAlertAudio) {
      try {
        _rejAlertAudio.pause();
        _rejAlertAudio.currentTime = 0;
        _rejAlertAudio.src = '';
        _rejAlertAudio.load();
      } catch (e) {}
    }

    const cacheBuster = `?v=${Date.now()}`;
    _rejAlertAudio = new Audio(`${REJECTION_ALERT_SOUND}${cacheBuster}`);
    _rejAlertAudio.preload = 'auto';
    _rejAlertAudio.volume = REJECTION_ALERT_VOLUME;
    _rejAlertAudio.currentTime = 0;

    const playPromise = _rejAlertAudio.play();

    if (playPromise && playPromise.then) {
      playPromise
        .then(() => {
          _rejAlertStopTimer = setTimeout(stopRejectionAlert, REJECTION_ALERT_SECONDS * 1000);
        })
        .catch((error) => {
          // المتصفح رفض التشغيل (لسه ما حصلش أي تفاعل من المستخدم أصلاً على الصفحة).
          // نستنى أول كليك/كتابة/لمسة ونعيد المحاولة فورًا لحظة ما يحصل.
          console.warn('Rejection alert blocked by autoplay policy, waiting for user gesture:', error);
          _rejAlertPendingRetry = true;
          if (!_rejAlertUserInteracted) {
            document.addEventListener('click', markRejectionAlertUnlocked, true);
            document.addEventListener('keydown', markRejectionAlertUnlocked, true);
            document.addEventListener('touchstart', markRejectionAlertUnlocked, true);
          }
        });
    } else {
      _rejAlertStopTimer = setTimeout(stopRejectionAlert, REJECTION_ALERT_SECONDS * 1000);
    }
  } catch (error) {
    console.warn('Rejection alert audio error:', error);
    _rejAlertAudio = null;
  }
}

function stopRejectionAlert() {
  clearTimeout(_rejAlertStopTimer);
  try {
    if (_rejAlertAudio) {
      _rejAlertAudio.pause();
      _rejAlertAudio.currentTime = 0;
    }
  } catch (e) {}
}
// منع تكرار تنبيه المرفوضات حتى لو React أعاد تركيب الـ component
// أو تم فتح/إغلاق التاب بدون إعادة تحميل الصفحة.
const GLOBAL_REJECTION_ALERT_STATE = window.__GLOBAL_REJECTION_ALERT_STATE || {
  notifiedIds: new Set()
};
window.__GLOBAL_REJECTION_ALERT_STATE = GLOBAL_REJECTION_ALERT_STATE;

function showRejectionNoticeOnce(row) {
  if (!row) return false;
  const key = row.id != null ? String(row.id) : String(
    row.order_number || row.order_no || row['رقم الطلب'] || ''
  );
  if (!key || GLOBAL_REJECTION_ALERT_STATE.notifiedIds.has(key)) return false;
  GLOBAL_REJECTION_ALERT_STATE.notifiedIds.add(key);
  return true;
}

function MyRejectionsPanel() {
  const [checkingSession, setCheckingSession] = useState(true);
  const [session, setSession] = useState(null);
  const [rows, setRows] = useState([]);
  const [loading, setLoading] = useState(false);
  const [error, setError] = useState('');
  const [dateMode, setDateMode] = useState('today');
  const [selectedDate, setSelectedDate] = useState('');
  const [search, setSearch] = useState('');
  const [showNotice, setShowNotice] = useState(false);
  const [noticeOrder, setNoticeOrder] = useState('');
  const [selectedRow, setSelectedRow] = useState(null);
  const [noticeCount, setNoticeCount] = useState(1);
  const channelRef = React.useRef(null);
  // عشان تحذير "مرفوضات قديمة لسه مترجعتش" يظهر مرة واحدة عند فتح التاب
  const initialAlertDoneRef = React.useRef(false);

  const getReviewer = (o) => o.reviewer || o['المراجع'] || '';
  const getOrder = (o) => o.order_number || o.order_no || o['رقم الطلب'] || '-';
  const getReason = (o) => o.reason || o.rejection_reason || o['سبب الرفض'] || '-';
  const getDate = (o) => o.date || o.created_at || o['التاريخ'] || o['تاريخ الطلب'] || '';
  const extractDate = (o) => {
    const raw = String(getDate(o) || '').trim();
    if (!raw) return '';
    if (raw.includes('/')) {
      const parts = raw.split(' ')[0].split('/');
      if (parts.length === 3) {
        let m = parseInt(parts[0], 10), d = parseInt(parts[1], 10), y = parseInt(parts[2], 10);
        if (y < 100) y += 2000;
        return `${y}-${String(m).padStart(2,'0')}-${String(d).padStart(2,'0')}`;
      }
    }
    const clean = raw.split('T')[0].split(' ')[0];
    return /^\d{4}-\d{2}-\d{2}$/.test(clean) ? clean : '';
  };
  const todayCairo = () => new Intl.DateTimeFormat('en-CA', {
    timeZone: 'Africa/Cairo', year: 'numeric', month: '2-digit', day: '2-digit'
  }).format(new Date());

  const loadRejections = React.useCallback(async () => {
    const client = getMyOrdersSupabaseClient();
    if (!client || !session) return;
    setLoading(true);
    setError('');
    try {
      // نفس getRejectedCertRows في script.js: المراجع يرى المرفوضات المخصصة له،
      // والطلبات التي وصلت لمرحلة "تم الطباعة" لا تظهر له.
      const reviewerValues = [session.username, session.name].filter(Boolean);
      let all = [];
      let from = 0, step = 1000;
      while (true) {
        const { data, error } = await client
          .from(MYREJECTIONS_TABLE_NAME)
          .select('*')
          .or('status.eq."مرفوض",was_rejected.eq.true')
          .in('reviewer', reviewerValues)
          .neq('status', 'تم الطباعة')
          .order('id', { ascending: true })
          .range(from, from + step - 1);
        if (error) throw error;
        if (!data || data.length === 0) break;
        all = all.concat(data);
        if (data.length < step) break;
        from += step;
      }
      setRows(all);

      // لو فيه طلبات مرفوضة قديمة لسه المراجع مردّش عليها → تحذير + نغمة (مرة واحدة عند الفتح)
      const stillPending = all.filter(o => !o.reviewer_action);

      // عند فتح الموقع: تنبيه واحد فقط لأول طلب منتظر.
      // يتم تسجيل الـ id قبل تشغيل التنبيه حتى لا يعيده Realtime.
      if (!initialAlertDoneRef.current && stillPending.length > 0) {
        initialAlertDoneRef.current = true;
        const firstPending = stillPending[0];

        if (showRejectionNoticeOnce(firstPending)) {
          setNoticeCount(stillPending.length);
          setNoticeOrder(String(getOrder(firstPending)));
          setShowNotice(true);
          playRejectionAlert();
          setTimeout(() => setShowNotice(false), 10000);
        }
      }
    } catch (e) {
      setError('حصل خطأ أثناء جلب المرفوضات: ' + e.message);
    } finally {
      setLoading(false);
    }
  }, [session]);

  useEffect(() => {
    let cancelled = false;
    const client = getMyOrdersSupabaseClient();
    if (!client) { setCheckingSession(false); return; }

    const loadProfileForUser = async (userId) => {
      try {
        const { data: profile } = await client
          .from('profiles')
          .select('id, username, name, role')
          .eq('id', userId)
          .single();
        if (!cancelled) setSession(profile || null);
      } catch (e) {
        if (!cancelled) setSession(null);
      }
    };

    (async () => {
      try {
        const { data: { session: authSession } } = await client.auth.getSession();
        if (!authSession?.user) {
          if (!cancelled) setSession(null);
        } else {
          await loadProfileForUser(authSession.user.id);
        }
      } catch (e) {
        if (!cancelled) setSession(null);
      }
      if (!cancelled) setCheckingSession(false);
    })();

    // بيلتقط تسجيل الدخول/الخروج اللي بيحصل من تاب "طلباتي" مباشرة
    // بدون الحاجة لعمل Reload للصفحة، لأن الاثنين بيستخدموا نفس Supabase client.
    const { data: authListener } = client.auth.onAuthStateChange((event, authSession) => {
      if (cancelled) return;
      if (!authSession?.user) { setSession(null); return; }
      loadProfileForUser(authSession.user.id);
    });

    return () => {
      cancelled = true;
      try { authListener?.subscription?.unsubscribe(); } catch (e) {}
    };
  }, []);

  useEffect(() => { if (session) loadRejections(); }, [session, loadRejections]);

  // نفس فكرة Realtime الموجودة في script.js، مع تنبيه فقط للطلب المرفوض
  // الذي reviewer_action فيه فاضي = بانتظار المراجع.
  useEffect(() => {
    const client = getMyOrdersSupabaseClient();
    if (!client || !session) return;

    const belongsToMe = (o) => {
      if (!o) return false;
      const r = getReviewer(o);
      return r === session.username || r === session.name;
    };

    const channel = client.channel('my-rejections-live-' + session.username + '-' + uid());
    channel.on('postgres_changes', {
      event: '*', schema: 'public', table: MYREJECTIONS_TABLE_NAME
    }, (payload) => {
      const { eventType, new: newRow, old: oldRow } = payload;
      const oldRejected = oldRow && oldRow.status === 'مرفوض';
      const newRejected = newRow && (newRow.status === 'مرفوض' || newRow.was_rejected === true);
      const isMine = belongsToMe(newRow);
      const rejectionKey = newRow && newRow.id != null ? String(newRow.id) : String(getOrder(newRow));
      const isNewPending = eventType === 'INSERT' && newRejected && isMine && !newRow.reviewer_action;

      if (isNewPending && showRejectionNoticeOnce(newRow)) {
        setNoticeCount(1);
        setNoticeOrder(String(getOrder(newRow)));
        setShowNotice(true);
        playRejectionAlert();
        setTimeout(() => setShowNotice(false), 10000);
      }

      setRows(prev => {
        if (eventType === 'DELETE') {
          return prev.filter(o => o.id !== (oldRow && oldRow.id));
        }
        if (!newRejected || !isMine || newRow.status === 'تم الطباعة') {
          return prev.filter(o => o.id !== (newRow && newRow.id));
        }
        const idx = prev.findIndex(o => o.id === newRow.id);
        if (idx === -1) return [...prev, newRow];
        const copy = prev.slice();
        copy[idx] = newRow;
        return copy;
      });
    }).subscribe();

    channelRef.current = channel;
    return () => {
      try { client.removeChannel(channel); } catch (e) {}
      if (channelRef.current === channel) channelRef.current = null;
    };
  }, [session]);

  async function setRejectionReviewerAction(row, action) {
    if (!session || !row) return;
    const reviewerOnRow = getReviewer(row);
    if (reviewerOnRow !== session.username && reviewerOnRow !== session.name) return;

    const client = getMyOrdersSupabaseClient();
    try {
      // نفس setRejectionReviewerAction في script.js:
      // "تم التعديل" أو "تم الرفض للشركة".
      const { data, error } = await client
        .from(MYREJECTIONS_TABLE_NAME)
        .update({ reviewer_action: action })
        .eq('id', row.id)
        .select();

      if (error) { alert('فشل التحديث: ' + error.message); return; }
      if (!data || data.length === 0) {
        alert('التحديث لم يُنفَّذ فعليًا. راجع صلاحيات قاعدة البيانات.');
        return;
      }
      setRows(prev => prev.map(o => o.id === row.id ? { ...o, reviewer_action: action } : o));
      setSelectedRow(prev => prev && prev.id === row.id ? { ...prev, reviewer_action: action } : prev);
    } catch (e) {
      alert('خطأ: ' + e.message);
    }
  }

  const filteredRows = React.useMemo(() => {
    let result = rows.slice();
    const today = todayCairo();

    if (dateMode === 'today') {
      result = result.filter(o => extractDate(o) === today);
    } else if (dateMode === 'date' && selectedDate) {
      result = result.filter(o => extractDate(o) === selectedDate);
    }

    const q = search.trim().toLowerCase();
    if (q) {
      result = result.filter(o =>
        String(getOrder(o)).toLowerCase().includes(q) ||
        String(getReason(o)).toLowerCase().includes(q)
      );
    }
    return result;
  }, [rows, dateMode, selectedDate, search]);

  if (checkingSession) {
    return <div className="py-8 text-center text-[12px] text-[var(--ink-soft)]">جاري التحقق من الجلسة...</div>;
  }

  if (!session) {
    return (
      <div className="rounded-2xl border border-[var(--line)] bg-[var(--panel)] p-5 text-center">
        <div className="text-[13px] font-bold text-[var(--ink)] mb-1">🚫 مرفوضاتي</div>
        <div className="text-[11.5px] text-[var(--ink-soft)] mb-3">سجّل الدخول من تبويب «طلباتي» أولًا، ثم ارجع إلى «مرفوضات».</div>
        <div className="text-[11px] text-[var(--muted)]">لا يوجد تسجيل دخول منفصل لهذا التبويب.</div>
      </div>
    );
  }

  return (
    <div className="space-y-3">
      {/* التحذير بيتعمله Portal على body عشان يظهر في نص الشاشة حتى لو التاب مقفول */}
      {showNotice && ReactDOM.createPortal((
        <div
          className="fixed inset-0 z-[2500] grid place-items-center p-4"
          style={{ background:'rgba(185, 28, 28, 0.55)', backdropFilter:'blur(12px)', WebkitBackdropFilter:'blur(12px)' }}
          onClick={() => { stopRejectionAlert(); setShowNotice(false); }}
        >
          <div
            className="w-full max-w-lg overflow-hidden rounded-2xl shadow-2xl"
            style={{ border:'2.5px solid rgba(239,68,68,0.7)' }}
            onClick={e => e.stopPropagation()}
            dir="rtl"
          >
            {/* ── Header ── */}
            <div className="px-6 py-5" style={{ background:'linear-gradient(135deg, #7f1d1d 0%, #991b1b 100%)' }}>
              <div className="flex items-center gap-4">
                <div className="w-14 h-14 rounded-2xl grid place-items-center shrink-0" style={{ background:'rgba(255,255,255,0.12)', border:'2px solid rgba(255,255,255,0.25)' }}>
                  <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="white" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
                    <path d="M10.29 3.86 1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/>
                    <path d="M12 9v4M12 17h.01"/>
                  </svg>
                </div>
                <div className="min-w-0 flex-1">
                  <div className="text-white font-bold text-[17px] leading-snug">
                    {noticeCount > 1 ? 'عندك ' + noticeCount + ' طلبات مرفوضة لسه محتاجة رد' : 'عندك طلب مرفوض طباعة'}
                  </div>
                  <div className="text-red-200 text-[12.5px] mt-1 leading-relaxed">
                    لازم تراجع الطلب وترد عليه: تم التعديل أو مرفوض نهائي
                  </div>
                </div>
              </div>
            </div>

            {/* ── رقم الطلب ── */}
            {noticeOrder && (
              <div className="px-6 py-3 flex items-center gap-3" style={{ background:'rgba(254,226,226,0.95)', borderBottom:'1px solid rgba(239,68,68,0.25)' }}>
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#dc2626" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round">
                  <circle cx="12" cy="12" r="10"/><path d="M12 16v-4M12 8h.01"/>
                </svg>
                <span className="text-[12.5px] font-semibold text-red-800">
                  {noticeCount > 1 ? 'أقدم طلب:' : 'رقم الطلب:'}&nbsp;
                  <span className="font-mono bg-red-100 px-2 py-0.5 rounded-md text-red-900" dir="ltr">{noticeOrder}</span>
                </span>
              </div>
            )}

            {/* ── Footer ── */}
            <div className="px-6 py-4 flex items-center justify-end gap-3" style={{ background:'rgba(255,255,255,0.97)', borderTop:'1px solid rgba(239,68,68,0.2)' }}>
              <button
                onClick={() => { stopRejectionAlert(); setShowNotice(false); }}
                className="px-5 py-2.5 rounded-xl text-[13px] font-bold text-white"
                style={{ background:'linear-gradient(135deg, #991b1b 0%, #b91c1c 100%)' }}
              >
                حسنًا، فهمت
              </button>
            </div>
          </div>
        </div>
      ), document.body)}

      <style>{`
        @keyframes rejFadeUp { from { opacity:0; transform: translateY(14px) scale(.97); } to { opacity:1; transform: none; } }
        @keyframes rejScrim  { from { opacity:0; } to { opacity:1; } }
        @keyframes rejRowIn  { from { opacity:0; transform: translateY(6px); } to { opacity:1; transform: none; } }
        .rej-row { transition: background .16s ease; }
        .rej-row:hover { background: var(--accent-soft); }
        .rej-row:hover .rej-chev { opacity:1; transform: translateX(-4px); }
        .rej-chev { opacity:.3; transition: opacity .16s ease, transform .16s ease; }
        .rej-seg { transition: background .15s ease, color .15s ease; }
      `}</style>

      {/* كارت المستخدم */}
      <div style={{ display:'flex', alignItems:'center', gap:12, padding:14, borderRadius:18, border:'1px solid var(--line)', background:'var(--panel)', boxShadow:'0 1px 2px rgba(15,23,42,.05)' }}>

}

function App() {

});
useEffect(() => {
  document.documentElement.setAttribute("data-theme", isDark ? "dark" : "light");
  localStorage.setItem("gis-theme", isDark ? "dark" : "light");
}, [isDark]);

}, []);
  const mapEl  = useRef(null);

  }, []);
  const undoLast = useCallback(() => {
    const previous = undoHistoryRef.current.pop();
    if (!previous) return false;
    setLayers(current => {
      const currentIds = new Set(current.map(l => l.id));
      previous.forEach(l => { if (!currentIds.has(l.id) && l.visible !== false) l.leafletLayer?.addTo(mapRef.current); });
      current.forEach(l => { if (!previous.some(p => p.id === l.id)) mapRef.current.removeLayer(l.leafletLayer); });
      rebuildGlobalNorth(previous, showNorthEdges);
      requestAnimationFrame(() => syncLayerStackOrder(previous));
      return previous;
    });
    return true;
  }, [showNorthEdges]);
  const layersRef = useRef([]);

useEffect(() => {
  layersRef.current = layers;
}, [layers]);
     // {id,name,kind,color,visible,count,leafletLayer,geojson?,points?}
  const [mobileOpen, setMobileOpen] = useState(false);
  const [sidebarView, setSidebarView] = useState('tools'); // 'tools' | 'myorders' | 'rejections'

  // ── اختصار كيبورد: زرار "ذ" (نفس مكان ` فعليًا على الكيبورد) يبدّل بين "الأدوات" و"طلباتي" فورًا ──
  useEffect(() => {
    const handleShortcutKey = (e) => {
      // نتجاهل الاختصار وإحنا بنكتب في أي حقل إدخال (بحث، باسورد...) عشان محدش يتفاجئ وهو بيكتب
      const tag = (e.target && e.target.tagName) || '';
      if (tag === 'INPUT' || tag === 'TEXTAREA' || (e.target && e.target.isContentEditable)) return;

      // e.code ثابت (فيزيائي) بغض النظر عن لغة الكيبورد المفعّلة، وده مكان زرار "ذ" بالظبط
      // في لوحة المفاتيح العربية. بنتأكد كمان من e.key كـ fallback لأي متصفح/نظام مختلف.
      const isShortcutKey = e.code === 'Backquote' || e.key === 'ذ' || e.key === '`' || e.key === '~';
      if (!isShortcutKey) return;

      e.preventDefault();
      setSidebarView((v) => v === 'tools' ? 'myorders' : (v === 'myorders' ? 'rejections' : 'tools'));
    };
    window.addEventListener('keydown', handleShortcutKey);
    return () => window.removeEventListener('keydown', handleShortcutKey);
  }, []);

  const [busy, setBusy] = useState(null);       // string label while a task runs
  const [toast, setToast] = useState(null);
  const [lineWarnings, setLineWarnings] = useState([]); // أسماء طبقات LINE المحملة
  const [utmZone, setUtmZone] = useState(null); // 1..60
  const [utmHemi, setUtmHemi] = useState("N");  // 'N' | 'S'

  const [layersPanelOpen, setLayersPanelOpen] = useState(true);  // floating layers tab

  useEffect(() => {
    const onUndo = (e) => {
      if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "z") {
        const tag = e.target?.tagName;
        if (tag === "INPUT" || tag === "TEXTAREA" || e.target?.isContentEditable) return;
        e.preventDefault(); undoLast();
      }
    };

  /* ── Global drag-and-drop overlay ──

  const [globalDrag, setGlobalDrag] = useState(false);
  const dragCounterRef = useRef(0);

  useEffect(() => {
    const onDragEnter = (e) => {
      e.preventDefault();
      dragCounterRef.current++;
      if (dragCounterRef.current === 1) setGlobalDrag(true);
    };
    const onDragOver = (e) => { e.preventDefault(); e.dataTransfer.dropEffect = "copy"; };
    const onDragLeave = () => {
      dragCounterRef.current--;
      if (dragCounterRef.current <= 0) { dragCounterRef.current = 0; setGlobalDrag(false); }
    };
const onDrop = (e) => {
  e.preventDefault();

  // حروف ترميز الكاد تُسحب داخل الرسم وليست ملفات؛ لا تمررها لمعالج رفع الملفات.
  const draggedText = e.dataTransfer?.getData("text/plain") || "";
  if (/^[A-Za-z]$/.test(draggedText)) {
    e.stopPropagation();
    return;
  }

  dragCounterRef.current = 0;
  setGlobalDrag(false);

  const files = Array.from(e.dataTransfer.files || []);
  if (!files.length) return;

  loadMixedFiles(files);
};
    window.addEventListener("dragenter", onDragEnter);
    window.addEventListener("dragover",  onDragOver);
    window.addEventListener("dragleave", onDragLeave);
    window.addEventListener("drop",      onDrop);
    return () => {
      window.removeEventListener("dragenter", onDragEnter);
      window.removeEventListener("dragover",  onDragOver);
      window.removeEventListener("dragleave", onDragLeave);
      window.removeEventListener("drop",      onDrop);
    };
  }, [layers]);

  /* ── Live tolerance watcher ──
     Re-colors every geodesy point and rebuilds its popup with the current
     distance-to-nearest-edge whenever the user changes the tolerance,
     toggles a layer, or adds a new sheet/shapefile. */
  useEffect(() => {
    const allPolygons = layers
      .filter(l => l.visible && l.polysData && l.polysData.length > 0)
      .flatMap(l => l.polysData.map(p => ({
        rings: p.rings, zone: l.zone, hemi: l.hemi,
      })));

    layers.forEach(l => {
      if (l.kind !== "sheet" || !l.leafletLayer) return;
      l.leafletLayer.eachLayer(marker => {
        if (!marker.getLatLng || !marker._sheetMeta) return;
        const meta = marker._sheetMeta;
        const latlng = marker.getLatLng();
        const point  = [latlng.lng, latlng.lat];

        let distM = null, onEdge = false;
        if (allPolygons.length > 0) {
          const d = minDistanceToAnyPolygonEdge(point, allPolygons);
          if (isFinite(d)) { distM = d; onEdge = d <= tolerance; }
        }

        marker.setStyle({
          fillColor: distM == null ? (meta.baseColor || "#3b82f6") : (onEdge ? "#16a34a" : "#dc2626"),
          color: "#fff", weight: 1.6, fillOpacity: 0.95,

        const coordsHtml = meta.projected

            <div style="display:flex;justify-content:space-between;align-items:baseline;gap:10px;padding:1px 0">

              <span style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#64748b">${tolerance.toFixed(2)} م</span>

            </div>

        const html = `

            ${distHtml}
          </div>`;

        if (marker.getPopup()) marker.setPopupContent(html);

          l.geoLayer.removeLayer(featureLayer);
        }

        // احذف الـ feature من بيانات الـ GeoJSON نفسها حتى يختفي من Attribute Table
        const nextGeojson = (l.geojson || []).map(fc => ({
          ...fc,
          features: (fc.features || []).filter(f => String(f.__featureId) !== fid),
        }));

        const nextFeatureLayers = new Map(l.featureLayers || []);
        nextFeatureLayers.delete(fid);

        const nextHidden = new Set(l.hiddenFeatureIds || []);
        nextHidden.delete(fid);

        const nextPolysData = (l.polysData || []).filter(
          p => String(p.featureId) !== fid
        );

        const nextCount = nextGeojson.reduce(
          (sum, fc) => sum + (fc.features || []).length,
          0
        );

        return {
          ...l,
          geojson: nextGeojson,
          featureLayers: nextFeatureLayers,
          hiddenFeatureIds: nextHidden,
          polysData: nextPolysData,
          count: nextCount,
        };
      });

      rebuildGlobalNorth(updated, showNorthEdges);
      requestAnimationFrame(() => syncLayerStackOrder(updated));
      return updated;
    });

    setBusy("جارٍ فتح الأرشيف...");
    let buf;
    try {
      buf = await file.arrayBuffer();
    } catch (e) {
      console.error("Failed to read file:", e);
      showToast("تعذّر قراءة الملف من الجهاز", "err", 4500);
      setBusy(null); return;
    }

    // ── تحديد نوع الأرشيف من خلال البايتات السحرية ──
    const kind = detectArchiveKind(buf);
    const SUPPORTED = ["zip", "rar"];
    if (!SUPPORTED.includes(kind)) {
      showToast("نوع الملف غير مدعوم — استخدم ZIP أو RAR", "err", 5000);
      setBusy(null); return;
    }

    // ── تحويل RAR إلى ZIP إذا لزم ──
    if (kind !== "zip") {
      setBusy("جارٍ فك ضغط RAR...");
      try {
        buf = await normalizeToZipBuffer(buf, kind);
      } catch (e) {
        console.error("RAR extraction failed:", e);
        const msg = (e && e.message) ? " — " + String(e.message).slice(0, 120) : "";
        showToast(`تعذّر فك ضغط ملف RAR${msg}`, "err", 6500);
        setBusy(null); return;
      }
    }

    // ── فتح كـ ZIP ──
    let zip;
    try {
      zip = await JSZip.loadAsync(buf);
    } catch (e) {
      console.error("JSZip parse failed:", e);
      showToast("الملف ليس أرشيف ZIP صالح أو تالف", "err", 4500);
      setBusy(null); return;
    }

    // ── فهرسة محتويات الأرشيف (recursive — يدخل جوا كل ZIP داخلي) ──
    let prjByBase, sheetEntries, innerZipBuffers;
    try {
      ({ prjByBase, sheetEntries, innerZipBuffers } = await indexArchive(zip));
    } catch (e) {
      console.error("Archive indexing failed:", e);
      showToast("تعذّر قراءة محتويات الأرشيف", "err", 4500);
      setBusy(null); return;
    }

    // ── تحليل Shapefiles عبر shpjs — الأرشيف الخارجي + كل ZIP داخلي ──
    let fcArr = [];
    const allZipBuffers = [
      { name: file.name.replace(/\.(zip|rar)$/i, ""), buf },
      ...innerZipBuffers,
    ];

    for (const { name: zipName, buf: zipBuf } of allZipBuffers) {
      try {
        setBusy("جارٍ تحليل Shapefile: " + zipName + "...");
        const result = await shp(zipBuf);
        const arr = Array.isArray(result) ? result : (result ? [result] : []);
        for (const fc of arr) {
          if (!fc.fileName) fc.fileName = zipName;

        fcArr.push(...arr);

        console.info("shpjs found no shapefiles in " + zipName + ":", e && e.message);

    if (fcArr.length === 0 && sheetEntries.length === 0) {
      showToast("الأرشيف لا يحتوي على Shapefile أو شيت بيانات", "err", 4500);
      setBusy(null); return;

    // ── بناء تعريفات الطبقات ──
    let baseIdx = layers.length;
    const defs = [];

    for (const fc of fcArr) {
      try {
        const fcName  = fc.fileName || file.name.replace(/\.(zip|rar)$/i, "");
        const base    = fcName.split("/").pop();
        const prjWkt  = prjByBase[base] || null;
        const def = buildShapefileLayer(fc, base, prjWkt, LAYER_COLORS[baseIdx % LAYER_COLORS.length], shpStyleRef.current);
        if (def) { def._fromArchive = true; defs.push(def); baseIdx++; }
      } catch (e) { console.warn("Failed to build shapefile layer:", e); }
    }

    for (const se of sheetEntries) {
      try {
        const arr = await se.async("uint8array");
        const sheetName = se.name.split("/").pop().replace(/\.(xlsx|xls|csv)$/i, "");
        const def = buildSheetLayer(arr.buffer, sheetName, LAYER_COLORS[baseIdx % LAYER_COLORS.length]);
        if (def) { def._fromArchive = true; defs.push(def); baseIdx++; }
      } catch (e) { console.warn("Sheet inside zip failed:", se.name, e); }
    }

    if (defs.length === 0) {
      showToast("تعذّر تحميل أي طبقة من الأرشيف — تحقق من محتوى الملف", "err", 5000);
      setBusy(null); return;
    }

    // ── تسجيل طبقات LINE للتحذير الدائم ──
    const lineLayers = defs.filter(d => d.kind === "shapefile" && d.geomType === "LineString");
    if (lineLayers.length > 0) {
      const newLineNames = lineLayers.map(d => d.name);

        def.leafletLayer.addTo(mapRef.current);

    } catch (e) {
      console.error("Failed to add layers to map:", e);
      showToast("تعذّر إضافة الطبقات إلى الخريطة", "err", 4500);
      setBusy(null); return;

    // ── تحديث نطاق UTM ──

    if (lastShp) {
      registerUtm(lastShp.zone, lastShp.hemi);

    const shpCount = defs.filter(d => d.kind === "shapefile").length;

  };

  /* ----- Export Shapefile (largest polygon = land boundary), zipped ----- */
  const exportShapefileZip = async () => {
    if (layers.length === 0) { showToast("لا توجد بيانات للتصدير", "info"); return; }

    // Pick the largest polygon across all visible shapefile layers.
    let biggest = null;
    let biggestLayerName = "boundary";
    let srcZone = null, srcHemi = "N";
    layers.forEach(l => {
      if (!l.visible || !l.polysData) return;
      for (const p of l.polysData) {
        if (!biggest || p.area > biggest.area) {
          biggest = p;
          biggestLayerName = sanitizeLayerName(l.name) || "boundary";
          srcZone = l.zone || null;
          srcHemi = l.hemi || "N";
        }
      }
    });
    if (!biggest) { showToast("لا توجد مضلعات لتصديرها", "info"); return; }

    // Reproject rings to the source layer's UTM zone (if any). Otherwise keep WGS84.
    let zone = srcZone, hemi = srcHemi;
    if (!zone) {
      // Fallback: derive from polygon centroid longitude
      const r0 = biggest.rings[0] || [];
      if (r0.length) {
        let sx = 0, sy = 0;
        r0.forEach(([x, y]) => { sx += x; sy += y; });
        const cx = sx / r0.length, cy = sy / r0.length;
        zone = utmZoneFromLon(cx); hemi = cy >= 0 ? "N" : "S";
      }
    }
    if (zone) registerUtm(zone, hemi);
    const projectPt = zone ? (c) => toUtm(c, zone, hemi) : (c) => [c[0], c[1]];

    // Shapefile spec: outer ring CW (negative signed area in math convention),
    // holes CCW. Normalize rings.
    const ringSignedArea = (r) => {
      let s = 0;
      for (let i = 0; i < r.length - 1; i++) {
        s += r[i][0] * r[i + 1][1] - r[i + 1][0] * r[i][1];
      }
      return s / 2;
    };
    const ensureClosed = (r) => {
      if (r.length === 0) return r;
      const [x0, y0] = r[0];
      const [xn, yn] = r[r.length - 1];
      if (x0 !== xn || y0 !== yn) return [...r, [x0, y0]];
      return r;
    };
    const rings = biggest.rings.map((r, idx) => {
      let ring = ensureClosed(r.map(projectPt));
      const a = ringSignedArea(ring);
      // outer (idx 0) should be CW (signed area < 0). holes should be CCW.
      if (idx === 0 && a > 0) ring = ring.slice().reverse();
      if (idx > 0  && a < 0) ring = ring.slice().reverse();
      return ring;
    });

    // BBox
    let xmin = Infinity, ymin = Infinity, xmax = -Infinity, ymax = -Infinity;
    let totalPoints = 0;
    rings.forEach(r => {
      totalPoints += r.length;
      r.forEach(([x, y]) => {
        if (x < xmin) xmin = x; if (x > xmax) xmax = x;
        if (y < ymin) ymin = y; if (y > ymax) ymax = y;
      });
    });

    // ── Build .shp ──
    const contentBytes = 4 + 32 + 4 + 4 + 4 * rings.length + 16 * totalPoints;
    const fileLengthBytes = 100 + 8 + contentBytes;
    const shpBuf = new ArrayBuffer(fileLengthBytes);
    const sdv = new DataView(shpBuf);
    sdv.setInt32(0, 9994, false);                  // file code BE
    sdv.setInt32(24, fileLengthBytes / 2, false);  // file length (16-bit words) BE
    sdv.setInt32(28, 1000, true);                  // version LE
    sdv.setInt32(32, 5, true);                     // shape type Polygon LE
    sdv.setFloat64(36, xmin, true);
    sdv.setFloat64(44, ymin, true);
    sdv.setFloat64(52, xmax, true);
    sdv.setFloat64(60, ymax, true);
    // record header
    sdv.setInt32(100, 1, false);                   // record number
    sdv.setInt32(104, contentBytes / 2, false);    // content length
    // record content
    let p = 108;
    sdv.setInt32(p, 5, true); p += 4;              // shape type
    sdv.setFloat64(p, xmin, true); p += 8;
    sdv.setFloat64(p, ymin, true); p += 8;
    sdv.setFloat64(p, xmax, true); p += 8;
    sdv.setFloat64(p, ymax, true); p += 8;
    sdv.setInt32(p, rings.length, true); p += 4;   // numParts
    sdv.setInt32(p, totalPoints, true); p += 4;    // numPoints
    let idx = 0;
    rings.forEach(r => { sdv.setInt32(p, idx, true); p += 4; idx += r.length; });
    rings.forEach(r => {
      r.forEach(([x, y]) => {
        sdv.setFloat64(p, x, true); p += 8;
        sdv.setFloat64(p, y, true); p += 8;
      });
    });

    // ── Build .shx ──
    const shxLen = 100 + 8;
    const shxBuf = new ArrayBuffer(shxLen);
    const xdv = new DataView(shxBuf);
    xdv.setInt32(0, 9994, false);
    xdv.setInt32(24, shxLen / 2, false);
    xdv.setInt32(28, 1000, true);
    xdv.setInt32(32, 5, true);
    xdv.setFloat64(36, xmin, true);
    xdv.setFloat64(44, ymin, true);
    xdv.setFloat64(52, xmax, true);
    xdv.setFloat64(60, ymax, true);
    xdv.setInt32(100, 50, false);                  // offset (16-bit words) = 100 bytes / 2
    xdv.setInt32(104, contentBytes / 2, false);    // content length

    // ── Build .dbf (one record, one ID field) ──
    const dbfHeaderLen = 32 + 32 + 1;              // header + 1 field desc + terminator
    const dbfRecordLen = 1 + 10;                   // deletion flag + ID(10)
    const dbfLen = dbfHeaderLen + dbfRecordLen + 1;
    const dbfBuf = new ArrayBuffer(dbfLen);
    const ddv = new DataView(dbfBuf);
    const dArr = new Uint8Array(dbfBuf);
    ddv.setUint8(0, 0x03);                         // dBase III
    const now = new Date();
    ddv.setUint8(1, now.getFullYear() - 1900);
    ddv.setUint8(2, now.getMonth() + 1);
    ddv.setUint8(3, now.getDate());
    ddv.setInt32(4, 1, true);                      // num records
    ddv.setInt16(8, dbfHeaderLen, true);           // header length
    ddv.setInt16(10, dbfRecordLen, true);          // record length
    // Field descriptor: 'ID' Numeric(10,0)
    const fname = "ID";
    for (let i = 0; i < fname.length; i++) dArr[32 + i] = fname.charCodeAt(i);
    dArr[32 + 11] = 0x4E;                          // 'N'
    ddv.setUint8(32 + 16, 10);                     // field length
    ddv.setUint8(32 + 17, 0);                      // decimal count
    dArr[64] = 0x0D;                               // header terminator
    // Record
    dArr[65] = 0x20;                               // not deleted
    const idStr = "         1";                    // right-aligned 10 chars
    for (let i = 0; i < 10; i++) dArr[66 + i] = idStr.charCodeAt(i);
    dArr[dbfLen - 1] = 0x1A;                       // EOF

    // ── PRJ ──
    // If we reprojected to UTM, write the ESRI WKT for WGS84 UTM Zone NN N/S.
    // Otherwise fall back to WGS 84 geographic.
    let prj;
    if (zone) {
      const centralMeridian = (zone - 1) * 6 - 180 + 3;
      const falseNorthing = (hemi === "S") ? 10000000.0 : 0.0;
      const hemiLetter = hemi === "S" ? "S" : "N";
      prj = `PROJCS["WGS_1984_UTM_Zone_${zone}${hemiLetter}",`
          + `GEOGCS["GCS_WGS_1984",DATUM["D_WGS_1984",`
          + `SPHEROID["WGS_1984",6378137.0,298.257223563]],`
          + `PRIMEM["Greenwich",0.0],UNIT["Degree",0.0174532925199433]],`
          + `PROJECTION["Transverse_Mercator"],`
          + `PARAMETER["False_Easting",500000.0],`
          + `PARAMETER["False_Northing",${falseNorthing}],`
          + `PARAMETER["Central_Meridian",${centralMeridian}],`
          + `PARAMETER["Scale_Factor",0.9996],`
          + `PARAMETER["Latitude_Of_Origin",0.0],`
          + `UNIT["Meter",1.0]]`;
    } else {
      prj = 'GEOGCS["GCS_WGS_1984",DATUM["D_WGS_1984",SPHEROID["WGS_1984",6378137.0,298.257223563]],PRIMEM["Greenwich",0.0],UNIT["Degree",0.0174532925199433]]';
    }

    // ── Zip ──
    const base = biggestLayerName.replace(/[^A-Za-z0-9_\-]+/g, "_") || "boundary";
    const suffix = zone ? `_UTM${zone}${hemi}` : "_WGS84";
    const zip = new JSZip();
    zip.file(`${base}.shp`, shpBuf);
    zip.file(`${base}.shx`, shxBuf);
    zip.file(`${base}.dbf`, dbfBuf);
    zip.file(`${base}.prj`, prj);
    try {
      const blob = await zip.generateAsync({ type: "blob", compression: "DEFLATE" });
      const zipName = `${base}_boundary${suffix}.zip`;
      const crsLabel = zone ? `UTM Zone ${zone}${hemi}` : "WGS 84";
      let autoShpOn = false;
      try { autoShpOn = !!(window.LSBridge && window.LSBridge.autoShp); } catch (e) {}
      if (autoShpOn) {
        // الرفع التلقائي مفعّل: نحفظ الملف مباشرة باسمه الحقيقي في طلباتي/<رقم الطلب>
        // ونرفعه في المنظومة — من غير ما نعدي على تحميل المتصفح العادي (اللي بيظهر
        // بفقاعة كروم باسم عشوائي مش حقيقي)، عشان أي حد يقدر يعاين الملف بعدين من
        // فولدر الطلب نفسه بالاسم الصح.
        showToast(`تم تصدير Shapefile (${totalPoints} نقطة · ${crsLabel})`, "ok", 3200);
        window.LSBridge.uploadToOrder('shapefile_upload', blob, zipName)
          .then(function(){ window.LSBridge.toast('✅ اترفع ملف الـ Shapefile تلقائيًا في المنظومة واتحفظ في طلباتي', 'ok'); })
          .catch(function(e){ window.LSBridge.toast('❌ فشل رفع الـ Shapefile تلقائيًا: ' + e.message, 'err'); });
      } else {
        downloadBlob(blob, zipName);
        showToast(`تم تصدير Shapefile (${totalPoints} نقطة · ${crsLabel})`, "ok", 3200);
      }
    } catch (e) {
      console.error(e);
      showToast("فشل ضغط الـ Shapefile", "err");
