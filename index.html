const CRS_UNKNOWN = { kind: "UNKNOWN", system: "UNKNOWN", short: "غير معروف", long: "نظام إحداثيات غير معروف" };

function parsePrjWkt(wkt) {
  if (!wkt || typeof wkt !== "string") return null;
  const cleaned = wkt.trim();

  const projMatch = cleaned.match(/^PROJCS\s*\[\s*"([^"]+)"/i);
  const geogMatch = cleaned.match(/^GEOGCS\s*\[\s*"([^"]+)"/i);

  if (projMatch) {
    const name = projMatch[1].trim();
    const pretty = name.replace(/_/g, " ");

    // UTM
    const utm = name.match(/UTM[_\s]*zone[_\s]*(\d+)\s*([NS]?)/i);
    if (utm) {
      const zone = parseInt(utm[1], 10);
      const hemi = (utm[2] || "N").toUpperCase();
      const datum = /WGS[_\s]?84|WGS_1984/i.test(name) ? "WGS 84"
                  : /NAD[_\s]?83/i.test(name)         ? "NAD 83"
                  : /NAD[_\s]?27/i.test(name)         ? "NAD 27"
                  : "";
      const epsg = datum === "WGS 84" ? (hemi === "S" ? 32700 : 32600) + zone : null;
      return {
        kind: "PROJECTED", system: "UTM",
        zone, hemi, datum, epsg,
        short: `UTM Zone ${zone}${hemi}`,
        long: `${datum ? datum + " / " : ""}UTM Zone ${zone}${hemi}${epsg ? " · EPSG:" + epsg : ""}`,
      };
    }
    // Mercator / Web Mercator
    if (/(Pseudo|Web)[_\s]*Mercator/i.test(name) || /Mercator_1SP|Mercator_2SP/i.test(cleaned)) {
      return { kind: "PROJECTED", system: "MERCATOR", short: "Web Mercator", long: pretty };
    }
    // Lambert
    if (/Lambert/i.test(name)) {
      return { kind: "PROJECTED", system: "LAMBERT", short: "Lambert", long: pretty };
    }
    // Generic projected
    return { kind: "PROJECTED", system: "OTHER", short: pretty.slice(0, 28), long: pretty };
  }

  if (geogMatch) {
    const name = geogMatch[1].trim();
    const pretty = name.replace(/_/g, " ");
    if (/WGS[_\s]?84|WGS_1984/i.test(name)) {
      return { kind: "GEOGRAPHIC", system: "WGS84", short: "WGS 84", long: "WGS 84 (EPSG:4326)" };
    }
    if (/NAD[_\s]?83/i.test(name)) {
      return { kind: "GEOGRAPHIC", system: "NAD83", short: "NAD 83", long: "NAD 83 (EPSG:4269)" };
    }
    return { kind: "GEOGRAPHIC", system: "GEOG", short: pretty.slice(0, 28), long: pretty };
  }

  return null;
}

    const prj = entries.find(f => !f.dir && /\.prj$/i.test(f.name));

    return await prj.async("string");

  let latCol = null, lonCol = null, eastingCol = null, northingCol = null;
  let idCol = null, codeCol = null, labelCol = null, descCol = null, elevCol = null;

    if (!northingCol && (n.includes("northing") || n.includes("شمال") || n === "n")) northingCol = h;

    if (!lonCol  && (n === "lon" || n === "lng" || n === "long" || n === "x" || n.includes("longitude") || n.includes("خط الطول") || n === "طول")) lonCol = h;

      if (x === null || y === null) return;

      push(0, "POINT");
      push(8, lname);
      push(10, x);
      push(20, y);
      push(30, 0);
      return;
    }

    if (f.type === "line" || f.type === "polygon") {
      let coords = cleanCoords(f.coords);
      if (coords.length < 2) return;

      // لو البوليغون آخر نقطة فيه نفس أول نقطة، نشيل التكرار
      if (f.type === "polygon" && coords.length > 2) {
        const first = coords[0];
        const last = coords[coords.length - 1];
        if (first[0] === last[0] && first[1] === last[1]) {
          coords = coords.slice(0, -1);
        }
      }

      push(0, "POLYLINE");
      push(8, lname);
      push(66, 1);
      push(70, f.type === "polygon" ? 1 : 0);

      coords.forEach(([x, y]) => {
        push(0, "VERTEX");
        push(8, lname);
        push(10, x);
        push(20, y);
        push(30, 0);
      });

      push(0, "SEQEND");

  push(0, "EOF");

/** Walk a GeoJSON Feature/Geometry and emit DXF features into `out`. */
function geoJsonToDxfFeatures(geojson, layerName, out) {
  const handleGeom = (geom) => {
    if (!geom) return;
    switch (geom.type) {
      case "Point":      out.push({ type: "point", coords: geom.coordinates, layerName }); break;
      case "MultiPoint": geom.coordinates.forEach(c => out.push({ type: "point", coords: c, layerName })); break;
      case "LineString": out.push({ type: "line", coords: geom.coordinates, layerName }); break;
      case "MultiLineString": geom.coordinates.forEach(c => out.push({ type: "line", coords: c, layerName })); break;
      case "Polygon":         geom.coordinates.forEach(ring => out.push({ type: "polygon", coords: ring, layerName })); break;
      case "MultiPolygon":    geom.coordinates.forEach(poly => poly.forEach(ring => out.push({ type: "polygon", coords: ring, layerName }))); break;
      case "GeometryCollection": geom.geometries.forEach(handleGeom); break;
    }
  };
  if (geojson.type === "FeatureCollection") {
    geojson.features.forEach(f => handleGeom(f.geometry));
  } else if (geojson.type === "Feature") {
    handleGeom(geojson.geometry);
  } else if (geojson.type) {
    handleGeom(geojson);
  }
}

function downloadBlob(blob, filename) {

/* ──────────────────────────────────────────────────────────────────────────
   LAYER BUILDERS — pure, top-level helpers
   Build a Leaflet layer + state record from raw data; the App component
   adds it to the map and to React state.
   ────────────────────────────────────────────────────────────────────────── */
/* ──────────────────────────────────────────────────────────────────────────
   AREA / LENGTH METRICS + POPUP RENDERER
   Used by feature popups to show real-world dimensions instead of raw props.
   ────────────────────────────────────────────────────────────────────────── */
const FEDDAN_M2 = 4200.83;

/** Truncate (do not round) to N decimals; returns a string. */
function truncToFixed(n, decimals) {
  const m = Math.pow(10, decimals);
  return (Math.trunc(Math.abs(Number(n)) * m) / m).toFixed(decimals);
}

function ringAreaUtm(ring, zone, hemi) {
  let s = 0;
  const pts = ring.map(c => toUtm(c, zone, hemi));
  for (let i = 0, n = pts.length; i < n; i++) {
    const a = pts[i], b = pts[(i + 1) % n];
    s += a[0] * b[1] - b[0] * a[1];
  }
  return Math.abs(s) / 2;
}
function ringAreaSpherical(ring) {
  const R = 6378137;
  if (!ring || ring.length < 3) return 0;
  const rad = (d) => d * Math.PI / 180;
  let area = 0;
  for (let i = 0; i < ring.length; i++) {
    const [lon1, lat1] = ring[i];
    const [lon2, lat2] = ring[(i + 1) % ring.length];
    area += rad(lon2 - lon1) * (2 + Math.sin(rad(lat1)) + Math.sin(rad(lat2)));
  }
  return Math.abs(area * R * R / 2);
}
function polygonAreaMeters(rings, zone, hemi) {
  if (!rings || rings.length === 0) return 0;
  const fn = zone ? ((r) => ringAreaUtm(r, zone, hemi)) : ringAreaSpherical;
  let total = fn(rings[0]);
  for (let i = 1; i < rings.length; i++) total -= fn(rings[i]);
  return Math.max(0, total);
}

function lineLengthUtm(line, zone, hemi) {
  let len = 0;
  for (let i = 1; i < line.length; i++) {
    const [x1, y1] = toUtm(line[i - 1], zone, hemi);
    const [x2, y2] = toUtm(line[i], zone, hemi);
    len += Math.hypot(x2 - x1, y2 - y1);
  }
  return len;
}
function lineLengthHaversine(line) {
  const R = 6378137;
  const rad = (d) => d * Math.PI / 180;
  let len = 0;
  for (let i = 1; i < line.length; i++) {
    const [lon1, lat1] = line[i - 1];
    const [lon2, lat2] = line[i];
    const dLat = rad(lat2 - lat1);
    const dLon = rad(lon2 - lon1);
    const a = Math.sin(dLat / 2) ** 2 + Math.cos(rad(lat1)) * Math.cos(rad(lat2)) * Math.sin(dLon / 2) ** 2;
    len += 2 * R * Math.asin(Math.sqrt(a));
  }
  return len;
}
function polylineLengthMeters(line, zone, hemi) {
  return zone ? lineLengthUtm(line, zone, hemi) : lineLengthHaversine(line);
}

/** Perpendicular distance from a [lon,lat] point to a [lon,lat] line segment,
 *  computed in metres via UTM projection. */
function distPointToSegmentMeters(p, a, b, zone, hemi) {
  const [px, py] = toUtm(p, zone, hemi);
  const [ax, ay] = toUtm(a, zone, hemi);
  const [bx, by] = toUtm(b, zone, hemi);
  const dx = bx - ax, dy = by - ay;
  const len2 = dx * dx + dy * dy;
  if (len2 === 0) return Math.hypot(px - ax, py - ay);
  let t = ((px - ax) * dx + (py - ay) * dy) / len2;
  if (t < 0) t = 0; else if (t > 1) t = 1;
  const cx = ax + t * dx, cy = ay + t * dy;
  return Math.hypot(px - cx, py - cy);
}

/** True if a [lon,lat] point lies on (within `tolMeters` of) any edge in `polygons`.
 *  Each polygon = { rings: [[[lon,lat],...], ...], zone, hemi }. */
function isPointOnAnyPolygonEdge(point, polygons, tolMeters = 1.5) {
  for (const poly of polygons) {
    if (!poly.zone) continue;
    for (const ring of poly.rings) {
      for (let i = 0; i < ring.length - 1; i++) {
        if (distPointToSegmentMeters(point, ring[i], ring[i + 1], poly.zone, poly.hemi) <= tolMeters) {
          return true;
        }
      }
    }
  }
  return false;
}

/** Minimum perpendicular distance (metres) from a [lon,lat] point to any edge
 *  of any polygon. Returns Infinity if no polygons are projectable. */
function minDistanceToAnyPolygonEdge(point, polygons) {
  let best = Infinity;
  for (const poly of polygons) {
    if (!poly.zone) continue;
    for (const ring of poly.rings) {
      for (let i = 0; i < ring.length - 1; i++) {
        const d = distPointToSegmentMeters(point, ring[i], ring[i + 1], poly.zone, poly.hemi);
        if (d < best) best = d;
      }
    }
  }
  return best;
}

/** Index of the polygon's most north-facing outer-ring edge — i.e. the edge
 *  whose outward normal points furthest in the +Y (north / lat-up) direction.
 *  Ring is in [lon,lat]. Returns -1 for degenerate inputs. */
// ── Helper functions (AutoCAD-style bearing) ──
function normalize360(a) { return ((a % 360) + 360) % 360; }
function normalize180(a) { a = normalize360(a); return a > 180 ? a - 360 : a; }
function edgeDist(p1, p2) { return Math.hypot(p2[0]-p1[0], p2[1]-p1[1]); }

/** فرق الزاوية بين azimuth والشمال (0°) — دايماً 0–180 */
function angleDifferenceToNorth(azimuth) {
  const a = normalize360(azimuth);
  return Math.min(a, 360 - a);
}

/** Azimuth من الشمال باتجاه عقارب الساعة لنقطتين [lon/x, lat/y] */
function azimuthFromNorth(p1, p2) {
  const dx = p2[0] - p1[0];
  const dy = p2[1] - p1[1];
  return normalize360(Math.atan2(dx, dy) * 180 / Math.PI);
}

/** حساب اتجاه البحري لضلع معطى [p1, p2]
 *  بيحسب الاتجاهين A→B و B→A ويختار الأقرب للشمال */
function calculateBaharyDirection(p1, p2) {
  const az1 = azimuthFromNorth(p1, p2);          // A → B
  const az2 = normalize360(az1 + 180);            // B → A
  const diff1 = angleDifferenceToNorth(az1);
  const diff2 = angleDifferenceToNorth(az2);
  const northward = diff1 <= diff2;
  return {
    fromPoint:    northward ? p1 : p2,
    toPoint:      northward ? p2 : p1,
    azimuth:      northward ? az1 : az2,
    angleFromNorth: Math.min(diff1, diff2),
    directionLabel: northward ? 'A_TO_B' : 'B_TO_A',
    oppositeDirectionInfo: {
      azimuth:        northward ? az2 : az1,
      angleFromNorth: Math.max(diff1, diff2),
      directionLabel: northward ? 'B_TO_A' : 'A_TO_B',
    },
  };

/** حساب زاوية ميل الضلع الرئيسي (الأطول) في الـ polygon
 *  بناءً على أطول ضلع — نفس منطق AutoCAD
 *  ring: [[x,y], ...] — projected coords (UTM) أو lon/lat */
function calcPolygonBearing(ring) {
  if (!ring || ring.length < 3) return null;

  // تنظيف النقاط المكررة
  const pts = ring.filter((p, i, a) =>
    i === 0 || p[0] !== a[i-1][0] || p[1] !== a[i-1][1]
  );
  // تجاهل الضلع الأخير لو مكرر لأول نقطة
  const n = (pts.length > 2 &&
    pts[0][0] === pts[pts.length-1][0] &&
    pts[0][1] === pts[pts.length-1][1])
    ? pts.length - 1 : pts.length;

  if (n < 2) return null;

  // نلاقي أطول ضلع
  let bestIdx = 0, bestLen = -1;
  for (let i = 0; i < n; i++) {
    const p1 = pts[i], p2 = pts[(i+1) % n];
    const len = edgeDist(p1, p2);
    if (len > bestLen) { bestLen = len; bestIdx = i; }
  }

  const p1 = pts[bestIdx], p2 = pts[(bestIdx+1) % n];
  const dx = p2[0] - p1[0];
  const dy = p2[1] - p1[1];

  // cadAngle: زاوية AutoCAD من محور X عكس عقارب الساعة (0°–360°)
  const cadAngle = normalize360(Math.atan2(dy, dx) * 180 / Math.PI);

  // azimuthBearing: من الشمال مع عقارب الساعة (0°–360°)
  const azimuthBearing = normalize360(Math.atan2(dx, dy) * 180 / Math.PI);

  // signedTiltFromNorth: ميل الضلع عن الشمال (-180 → +180)
  const signedTiltFromNorth = normalize180(90 - cadAngle);

  return {
    startPoint: p1, endPoint: p2, length: bestLen,
    cadAngle, azimuthFromNorth: azimuthBearing, signedTiltFromNorth,
    rotationToMakeEdgeNorth: signedTiltFromNorth,
    edgeIdx: bestIdx,
  };
}

/** الحد البحري = الضلع اللي وجهه (عموده الخارجي) بيشير للشمال أكثر
 *  نحسب centroid ثم لكل ضلع نحسب العمودي الخارجي ونقيس مكونه الشمالي (Y) */
function detectNorthEdgeIdx(ring) {
  if (!ring || ring.length < 4) return -1;

  // centroid
  let cx = 0, cy = 0;
  const n = ring.length - 1;
  for (let i = 0; i < n; i++) { cx += ring[i][0]; cy += ring[i][1]; }
  cx /= n; cy /= n;

  let bestIdx = -1, bestNy = -Infinity;
  for (let i = 0; i < ring.length - 1; i++) {
    const [x1,y1] = ring[i], [x2,y2] = ring[i+1];
    const dx = x2-x1, dy = y2-y1;
    const len = Math.hypot(dx,dy);
    if (len < 1e-10) continue;

    // العمودي الأيسر والأيمن
    const nx1=-dy/len, ny1= dx/len;
    const nx2= dy/len, ny2=-dx/len;

    // نقطة المنتصف
    const mx=(x1+x2)/2, my=(y1+y2)/2;

    // نختار العمودي الخارجي
    const dot1=(mx+nx1-cx)*nx1+(my+ny1-cy)*ny1;
    const dot2=(mx+nx2-cx)*nx2+(my+ny2-cy)*ny2;
    const outNy = dot1>dot2 ? ny1 : ny2;

    // الضلع الأشمل = أكبر مكون Y للعمودي الخارجي
    if (outNy > bestNy) { bestNy = outNy; bestIdx = i; }
  }
  return bestIdx;
}

/** HTML for a feature popup — Polygon → area (م² + feddan), Line → length, Point → coords. */
function featureMetricsHtml(feature, zone, hemi) {
  const g = feature && feature.geometry;
  if (!g) return "";
  const t = g.type;

  const row = (label, val, unit, accent) => `
    <div style="display:flex;justify-content:space-between;align-items:baseline;gap:14px;padding:6px 0;${accent ? "border-top:1px solid #30363d" : ""}">
      <span style="color:#8b949e;font-size:11.5px">${label}</span>
      <span style="font-family:'JetBrains Mono',monospace;font-weight:600;font-size:13px;color:${accent ? "#dc2626" : "#0f7010"}">
        <span data-copy-area="${String(val).replace(/\"/g, '&quot;')} ${unit}" title="اضغط للنسخ" style="cursor:pointer">${val}</span> <span style="color:#484f58;font-weight:500;font-size:11px">${unit}</span>
      </span>
    </div>`;

  if (t === "Polygon" || t === "MultiPolygon") {
    const polys = t === "Polygon" ? [g.coordinates] : g.coordinates;
    let area = 0;
    for (const rings of polys) area += polygonAreaMeters(rings, zone, hemi);
    const fadan = area / FEDDAN_M2;
    return `<div style="min-width:220px;direction:rtl;text-align:right">
      ${row("المساحة", truncToFixed(area, 2), "م²", false)}
      ${row("بالفدان", truncToFixed(fadan, 4), "فدان", true)}
    </div>`;
  }

  if (t === "LineString" || t === "MultiLineString") {
    const lines = t === "LineString" ? [g.coordinates] : g.coordinates;
    let len = 0;
    for (const line of lines) len += polylineLengthMeters(line, zone, hemi);
    return `<div style="min-width:200px;direction:rtl;text-align:right">
      ${row("الطول", truncToFixed(len, 2), "م", true)}
    </div>`;
  }

  if (t === "Point") {
    const [lon, lat] = g.coordinates;
    return `<div style="min-width:170px;direction:rtl;text-align:right">
      <div style="font-family:'JetBrains Mono',monospace;font-size:12px;color:#e6edf3;line-height:1.6">
        ${lat.toFixed(6)}, ${lon.toFixed(6)}
      </div>
    </div>`;
  }
  return "";
}

function geojsonFeatureAreaScore(feat) {
  const g = feat?.geometry;
  if (!g) return Number.POSITIVE_INFINITY;

  const polyArr =
    g.type === "Polygon" ? [g.coordinates] :
    g.type === "MultiPolygon" ? g.coordinates :
    [];

  let total = 0;

  polyArr.forEach(rings => {
    const r = rings?.[0] || [];
    let s = 0;

    for (let i = 0; i < r.length - 1; i++) {
      s += r[i][0] * r[i + 1][1] - r[i + 1][0] * r[i][1];
    }

    total += Math.abs(s) / 2;
  });

  return total || Number.POSITIVE_INFINITY;
}

function pointInRingLngLat(lng, lat, ring) {
  let inside = false;
  if (!Array.isArray(ring) || ring.length < 3) return false;

  for (let i = 0, j = ring.length - 1; i < ring.length; j = i++) {
    const xi = Number(ring[i][0]);
    const yi = Number(ring[i][1]);
    const xj = Number(ring[j][0]);
    const yj = Number(ring[j][1]);

    const intersect =
      ((yi > lat) !== (yj > lat)) &&
      (lng < ((xj - xi) * (lat - yi)) / ((yj - yi) || 1e-12) + xi);

    if (intersect) inside = !inside;
  }

  return inside;
}

function pointInPolygonCoords(lng, lat, rings) {
  if (!rings || !rings.length) return false;
  if (!pointInRingLngLat(lng, lat, rings[0])) return false;

  for (let i = 1; i < rings.length; i++) {
    if (pointInRingLngLat(lng, lat, rings[i])) return false;
  }

  return true;
}

function geojsonGeometryContainsLatLng(geometry, latlng) {
  if (!geometry || !latlng) return false;

  const lng = Number(latlng.lng);
  const lat = Number(latlng.lat);

  if (geometry.type === "Polygon") {
    return pointInPolygonCoords(lng, lat, geometry.coordinates);
  }

  if (geometry.type === "MultiPolygon") {
    return geometry.coordinates.some(rings =>
      pointInPolygonCoords(lng, lat, rings)
    );
  }

  return false;
}

function sheetNum(v) {

function detectHeaderlessSheetLayout(aoa) {
  const rows = aoa
    .filter(r => r && r.some(c => c !== "" && c !== null && c !== undefined));

  if (!rows.length) return null;

  const maxCols = Math.max(...rows.map(r => r.length));
  if (maxCols < 2) return null;

  let best = null;

  // جرّب كل زوج أعمدة واعرف مين شبه X/Y UTM
  for (let xCol = 0; xCol < maxCols; xCol++) {
    for (let yCol = 0; yCol < maxCols; yCol++) {
      if (xCol === yCol) continue;

      let score = 0;
      let checked = 0;

      for (const row of rows.slice(0, 40)) {
        const x = sheetNum(row[xCol]);
        const y = sheetNum(row[yCol]);

        if (!Number.isFinite(x) || !Number.isFinite(y)) continue;
        checked++;

        if (isLikelyUtmEasting(x) && isLikelyUtmNorthing(y)) {
          score += 3;

          // شماليات مصر غالبًا في حدود 2 مليون إلى 4 مليون
          if (y > 1500000 && y < 4500000) score += 2;
        }
      }

      if (checked >= 2 && (!best || score > best.score)) {
        best = { xCol, yCol, score, type: "utm" };
      }
    }
  }

  // fallback لو الملف Lat/Lon بدون headers
  if (!best || best.score < 6) {
    for (let lonCol = 0; lonCol < maxCols; lonCol++) {
      for (let latCol = 0; latCol < maxCols; latCol++) {
        if (lonCol === latCol) continue;

        let score = 0;
        let checked = 0;

        for (const row of rows.slice(0, 40)) {
          const lon = sheetNum(row[lonCol]);
          const lat = sheetNum(row[latCol]);

          if (!Number.isFinite(lon) || !Number.isFinite(lat)) continue;
          checked++;

          if (isLikelyLon(lon) && isLikelyLat(lat)) score += 2;
        }

        if (checked >= 2 && (!best || score > best.score)) {
          best = { xCol: lonCol, yCol: latCol, score, type: "ll" };
        }
      }
    }
  }

  if (!best || best.score < 4) return null;

  const headers = Array.from({ length: maxCols }, (_, i) => `__COL_${excelColName(i)}`);

  const dataRows = rows.map(r => {
    const obj = {};
    headers.forEach((h, i) => {
      obj[h] = r[i] !== undefined ? r[i] : "";
    });
    return obj;
  });

  // اختيارات ذكية من الصورة:
  // A = ID غالبًا
  // B = Code/Type غالبًا
  // بعد Y مباشرة ممكن Z/Elevation
  const idCol = headers[0] || null;
  const codeCol = headers[1] || null;

  let elevCol = null;
  const afterY = best.yCol + 1;
  if (afterY < headers.length) {
    const hasNumericElev = rows.some(r => Number.isFinite(sheetNum(r[afterY])));
    if (hasNumericElev) elevCol = headers[afterY];
  }

  if (best.type === "utm") {
    return {
      headers,
      dataRows,
      coordOverride: {
        eastingCol: headers[best.xCol],
        northingCol: headers[best.yCol],
        latCol: null,
        lonCol: null,
        idCol,
        codeCol,
        labelCol: idCol,
        descCol: null,
        elevCol,
      },
    };
  }

  return {
    headers,
    dataRows,
    coordOverride: {
      lonCol: headers[best.xCol],
      latCol: headers[best.yCol],
      eastingCol: null,
      northingCol: null,
      idCol,
      codeCol,
      labelCol: idCol,
      descCol: null,
      elevCol,
    },
  };
}

function buildSheetLayer(arrayBuffer, fileName, color) {
  let wb;
  try {
    wb = XLSX.read(arrayBuffer, { type: "array" });
  } catch {
    return null;
  }

  const ws = wb.Sheets[wb.SheetNames[0]];

  const aoa = XLSX.utils.sheet_to_json(ws, {
    header: 1,
    defval: "",
    raw: true,
  });

  if (!aoa.length) return null;

  let headerRowIdx = -1;

  // 1) محاولة القراءة العادية من Headers
  for (let i = 0; i < aoa.length; i++) {
    const cells = aoa[i].map(c => String(c).trim().toLowerCase());

    const hasEN =
      cells.some(c => c.includes("easting") || c === "x" || c === "e" || c.includes("شرق")) &&
      cells.some(c => c.includes("northing") || c === "y" || c === "n" || c.includes("شمال"));

    const hasLL =
      cells.some(c => c === "lat" || c.includes("latitude") || c.includes("خط العرض")) &&
      cells.some(c => c === "lon" || c === "lng" || c.includes("longitude") || c.includes("خط الطول"));

    if (hasEN || hasLL) {
      headerRowIdx = i;
      break;
    }
  }

  let headers;
  let dataRows;
  let coordOverride = null;

  // 2) لو مفيش Headers — نقرأ الملف تلقائيًا من القيم
  if (headerRowIdx < 0) {
    const auto = detectHeaderlessSheetLayout(aoa);
    if (!auto) return null;

    headers = auto.headers;
    dataRows = auto.dataRows;
    coordOverride = auto.coordOverride;
  } else {
    headers = aoa[headerRowIdx].map(c => String(c).trim());

    dataRows = aoa.slice(headerRowIdx + 1)
      .filter(r => r.some(c => c !== "" && c !== null && c !== undefined))
      .map(r => {
        const obj = {};
        headers.forEach((h, i) => {
          obj[h] = r[i] !== undefined ? r[i] : "";
        });
        return obj;
      });
  }

  if (!dataRows.length) return null;

  let detected = detectCoordColumns(headers);

  if (coordOverride) {
    detected = {
      ...detected,
      ...coordOverride,
    };
  }

  const {
    latCol,
    lonCol,
    eastingCol,
    northingCol,
    idCol,
    codeCol,
    labelCol,
    descCol,
    elevCol,
  } = detected;

  let utmZ = null;
  let utmH = "N";

  const projected = !!(eastingCol && northingCol);

  if (projected) {
    // حاول تجيب Zone من أي metadata فوق الجدول
    const metaRows = headerRowIdx >= 0 ? aoa.slice(0, headerRowIdx) : aoa.slice(0, 5);

    for (const row of metaRows) {
      for (const cell of row) {
        const z = extractUtmZoneFromText(cell);
        if (z) {
          utmZ = z.zone;
          utmH = z.hemi;
          break;
        }
      }
      if (utmZ) break;
    }

    // مصر غالبًا Zone 36N لو مفيش معلومات
    if (!utmZ) {
      utmZ = 36;
      utmH = "N";
    }

    registerUtm(utmZ, utmH);
  } else if (!latCol || !lonCol) {
    return null;
  }

  const group = L.featureGroup();
  const points = [];
  let count = 0;

  for (const r of dataRows) {
    let lat;
    let lon;

    if (projected) {
      const E = sheetNum(r[eastingCol]);
      const N = sheetNum(r[northingCol]);

      if (!Number.isFinite(E) || !Number.isFinite(N)) continue;

      const [pLon, pLat] = proj4(
        `EPSG:${utmEpsg(utmZ, utmH)}`,
        "EPSG:4326",
        [E, N]
      );

      lon = pLon;
      lat = pLat;
    } else {
      lat = sheetNum(r[latCol]);
      lon = sheetNum(r[lonCol]);

      if (!Number.isFinite(lat) || !Number.isFinite(lon)) continue;
    }

    const labelBits = [];

    if (labelCol && r[labelCol] !== "") {
      labelBits.push(String(r[labelCol]));
    } else if (idCol && r[idCol] !== "") {
      labelBits.push(String(r[idCol]));
    }

    if (codeCol && r[codeCol] !== "") {
      labelBits.push(String(r[codeCol]));
    }

    const label = labelBits.join(" · ");
    const desc = descCol ? String(r[descCol] || "") : "";
    const elev = elevCol ? String(r[elevCol] || "") : "";

const m = L.circleMarker([lat, lon], {
  pane: "sheetPointsPane",
  radius: 6,
  color: "#fff",
  weight: 1.6,
  fillColor: color,
  fillOpacity: 0.95,
});


    const popup = `
      <div style="min-width:180px">
        ${label ? `<div style="font-weight:600;margin-bottom:4px;color:#e6edf3">${label}</div>` : ""}
        <div class="font-mono" style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#8b949e">
          ${
            projected
              ? `X/E ${sheetNum(r[eastingCol]).toFixed(3)} · Y/N ${sheetNum(r[northingCol]).toFixed(3)}<br/>UTM ${utmZ}${utmH}`
              : `${lat.toFixed(6)}, ${lon.toFixed(6)}`
          }
          ${elev ? `<br/>Z ${elev}` : ""}
        </div>
        ${desc ? `<div style="margin-top:6px;color:#b0bac4">${desc}</div>` : ""}
      </div>
    `;

    m.bindPopup(popup);

    m._sheetMeta = {
      label,
      desc,
      projected,
      lat,
      lon,
      E: projected ? sheetNum(r[eastingCol]) : null,
      N: projected ? sheetNum(r[northingCol]) : null,
      utmZ,
      utmH,
      baseColor: color,
    };

    m.addTo(group);
    points.push([lon, lat]);
    count++;
  }

  if (count === 0) return null;

  let zone = projected ? utmZ : null;
  let hemi = projected ? utmH : "N";

  if (!zone && points.length) {
    const mx = points.reduce((s, p) => s + p[0], 0) / points.length;
    const my = points.reduce((s, p) => s + p[1], 0) / points.length;
    zone = utmZoneFromLon(mx);
    hemi = my >= 0 ? "N" : "S";
  }

  return {
    id: uid(),
    name: fileName,
    kind: "sheet",
    geomType: "Point",
    color,
    visible: true,
    count,
    leafletLayer: group,
    points,
    zone,
    hemi,
    crs: projected
      ? {
          kind: "PROJECTED",
          system: "UTM",
          zone,
          hemi,
          short: `UTM Zone ${zone}${hemi}`,
          long: `WGS 84 / UTM Zone ${zone}${hemi} · EPSG:${utmEpsg(zone, hemi)}`,
        }
      : { ...CRS_DEFAULT_WGS84 },
  };
}

/** Walk a JSZip and collect by filetype. Returns { prjByBase, sheetEntries, innerZipBuffers }.
 *  Handles nested ZIP and nested RAR (converts RAR→ZIP on the fly). */
async function indexArchive(zip, _depth) {
  _depth = _depth || 0;
  const MAX_DEPTH = 5;
  const prjByBase     = {};
  const sheetEntries  = [];
  const innerZipBuffers = [];

  for (const e of Object.values(zip.files)) {
    if (e.dir) continue;
    const ext  = e.name.match(/\.([^.\/]+)$/i)?.[1]?.toLowerCase();
    const base = e.name.replace(/\.[^.\/]+$/, "").split("/").pop();

    if (ext === "prj") {
      prjByBase[base] = await e.async("string");
    } else if (["xlsx","xls","csv"].includes(ext)) {
      sheetEntries.push(e);
    } else if (ext === "zip" && _depth < MAX_DEPTH) {
      try {
        const innerBuf = await e.async("arraybuffer");
        const innerZip = await JSZip.loadAsync(innerBuf);
        const inner = await indexArchive(innerZip, _depth + 1);
        Object.assign(prjByBase, inner.prjByBase);
        sheetEntries.push(...inner.sheetEntries);
        innerZipBuffers.push({ name: base, buf: innerBuf });
        innerZipBuffers.push(...inner.innerZipBuffers);
      } catch (err) {
        console.warn("Failed to open nested ZIP:", e.name, err);
      }
    } else if (ext === "rar" && _depth < MAX_DEPTH) {
      // ── RAR داخل ZIP — نحوله لـ ZIP ونعاملوه كـ ZIP داخلي ──
      try {
        const rarBuf = await e.async("arraybuffer");
        const convertedBuf = await viaBuiltinRar(rarBuf);
        const innerZip = await JSZip.loadAsync(convertedBuf);
        const inner = await indexArchive(innerZip, _depth + 1);
        Object.assign(prjByBase, inner.prjByBase);
        sheetEntries.push(...inner.sheetEntries);
        innerZipBuffers.push({ name: base, buf: convertedBuf });
        innerZipBuffers.push(...inner.innerZipBuffers);
      } catch (err) {
        console.warn("Failed to open nested RAR:", e.name, err);
      }
    }
  }
  return { prjByBase, sheetEntries, innerZipBuffers };
}

/* ──────────────────────────────────────────────────────────────────────────
   ANY-ARCHIVE SUPPORT — RAR / 7z / tar / gz / bz2 via libarchive.js, with
   ZIP fast-pathed through JSZip. All non-ZIP formats get re-packed into
   an in-memory ZIP so the rest of the pipeline (shpjs + JSZip) stays simple.
   ────────────────────────────────────────────────────────────────────────── */
function detectArchiveKind(buffer) {
  const u = new Uint8Array(buffer.slice ? buffer.slice(0, 16) : buffer.buffer.slice(0, 16));
  // ZIP: PK\x03\x04 / PK\x05\x06 / PK\x07\x08
  if (u[0] === 0x50 && u[1] === 0x4B && (u[2] === 0x03 || u[2] === 0x05 || u[2] === 0x07)) return "zip";
  // RAR: "Rar!"
  if (u[0] === 0x52 && u[1] === 0x61 && u[2] === 0x72 && u[3] === 0x21) return "rar";
  // 7z: 37 7A BC AF 27 1C
  if (u[0] === 0x37 && u[1] === 0x7A && u[2] === 0xBC && u[3] === 0xAF && u[4] === 0x27 && u[5] === 0x1C) return "7z";
  // GZip: 1F 8B
  if (u[0] === 0x1F && u[1] === 0x8B) return "gz";
  // Bzip2: "BZh"
  if (u[0] === 0x42 && u[1] === 0x5A && u[2] === 0x68) return "bz2";
  // tar usually has "ustar" at offset 257 — cheap check
  return "unknown";
}

/** Shim `require` to a no-op stub so CJS bundles that leak `require()` calls
 *  into the browser (libarchive.js, etc.) don't throw before we get a chance
 *  to use them. Safe because nothing in this project calls require() itself. */
function ensureRequireShim() {
  if (typeof globalThis.require === "undefined") {
    globalThis.require = function (id) {
      console.debug("[require-shim] returning {} for", id);
      return {};
    };
  }
}

/* ══════════════════════════════════════════════════════════════════════════
   RAR EXTRACTOR — uses the inline node-unrar-js WASM bundle loaded above.
   Supports RAR4 + RAR5 solid archives, Arabic filenames, nested folders.
   ══════════════════════════════════════════════════════════════════════════ */

/** Extract RAR → flat [{name, data}] via the inline WASM extractor */
async function extractRarWasm(arBuffer) {
  if (typeof window.__unrarCreateExtractorFromData !== "function") {
    throw new Error("unrar WASM bundle not loaded");
  }
  const extractor = await window.__unrarCreateExtractorFromData({ data: arBuffer });

  // ⚠️ Do NOT pass a files filter — passing an array causes early termination
  //    when count reaches files.length (hits all unique names before processing
  //    duplicates from nested folders). Extract everything and deduplicate later.
  const { files } = extractor.extract();

  const result = [];
  for (const file of files) {
    if (!file.fileHeader.flags.directory && file.extraction) {
      result.push({
        name: file.fileHeader.name.replace(/\\/g, "/"),
        data: file.extraction,
      });
    }
  }
  return result;
}

/** Keep original folder structure so shpjs treats same-named layers in
 *  different folders as separate layers. No deduplication whatsoever. */
function flattenFileList(fileList) {
  // Keep paths as-is — shpjs handles subfolders and returns one FC per .shp found
  return fileList.filter(f => f.name);
}

/** Convert a [{name, data}] list to a JSZip ArrayBuffer (files at root). */
async function filesToZipBuffer(fileList) {
  const newZip = new JSZip();
  for (const { name, data } of fileList) newZip.file(name, data);
  return await newZip.generateAsync({ type: "arraybuffer" });
}

/** Main RAR → ZIP converter — يعالج الـ nested RARs داخل RAR بشكل recursive */
async function viaBuiltinRar(arBuffer) {
  const fileList = await extractRarWasm(arBuffer);
  if (fileList.length === 0) throw new Error("RAR archive is empty or extraction failed");
  const flat = flattenFileList(fileList);

  // ── فحص لو في RAR داخل RAR ──
  const nestedRars   = flat.filter(f => /\.rar$/i.test(f.name));
  const regularFiles = flat.filter(f => !/\.rar$/i.test(f.name));

  if (nestedRars.length === 0) {
    // لا يوجد nested RARs — الحالة العادية
    return await filesToZipBuffer(regularFiles);
  }

  // ── يوجد nested RARs — نفكهم ونضيف محتوياتهم للملفات العادية ──
  const allFiles = [...regularFiles];
  for (const nested of nestedRars) {
    try {
      const nestedBuf = (nested.data.buffer)
        ? nested.data.buffer.slice(nested.data.byteOffset, nested.data.byteOffset + nested.data.byteLength)
        : nested.data;
      const nestedZipBuf = await viaBuiltinRar(nestedBuf);
      // نفتح الـ ZIP الناتج ونسحب منه الملفات
      const nestedZip = await JSZip.loadAsync(nestedZipBuf);
      const nestedBase = nested.name.replace(/\.rar$/i, "");
      for (const e of Object.values(nestedZip.files)) {
        if (e.dir) continue;
        const data = await e.async("uint8array");
        allFiles.push({ name: nestedBase + "/" + e.name, data });
      }
    } catch (err) {
      console.warn("Failed to extract nested RAR:", nested.name, err);
    }
  }

  return await filesToZipBuffer(allFiles);
}

/** Unified entrypoint */
async function normalizeToZipBuffer(buf, kind) {
  if (kind === "zip") return buf;
  if (kind === "rar") return await viaBuiltinRar(buf);
  throw new Error(`صيغة ${kind.toUpperCase()} غير مدعومة — استخدم ZIP أو RAR`);
}

/* ──────────────────────────────────────────────────────────────────────────
   GEOMETRY TYPE INSPECTION + KML EXPORT HELPERS
   ────────────────────────────────────────────────────────────────────────── */
const GEOM_TYPES = {
  Point:      { txt: "نقاط",    short: "POINT",   icon: "dot"  },
  LineString: { txt: "خطوط",    short: "LINE",    icon: "line" },
  Polygon:    { txt: "مضلعات",  short: "POLYGON", icon: "poly" },
};

/** Return the dominant base geometry type for a FeatureCollection. */
function detectGeomType(fc) {
  if (!fc || !fc.features || fc.features.length === 0) return null;
  const counts = {};
  for (const f of fc.features) {
    const t = f.geometry && f.geometry.type;
    if (!t) continue;
    const base = t.replace(/^Multi/, "");
    counts[base] = (counts[base] || 0) + 1;
  }
  const sorted = Object.entries(counts).sort((a, b) => b[1] - a[1]);
  return sorted[0] ? sorted[0][0] : null;
}

/** Convert "#RRGGBB" to KML's AABBGGRR pair (line + filled). */
function hexToKmlColors(hex) {
  const m = String(hex || "#888888").replace("#", "").match(/^([0-9a-f]{2})([0-9a-f]{2})([0-9a-f]{2})$/i);
  if (!m) return { line: "ff888888", fill: "4d888888" };
  const [, r, g, b] = m;
  return { line: `ff${b}${g}${r}`.toLowerCase(), fill: `66${b}${g}${r}`.toLowerCase() };
}
const xmlEscape = (s) => String(s ?? "").replace(/[<>&"']/g, c => ({ "<":"&lt;", ">":"&gt;", "&":"&amp;", '"':"&quot;", "'":"&apos;" }[c]));

/** Build a KML document containing only the supplied polygon folders. */
function buildKML(folders, docName = "دليل المراجع الذكي") {
  const lines = [];
  lines.push('<?xml version="1.0" encoding="UTF-8"?>');
  lines.push('<kml xmlns="http://www.opengis.net/kml/2.2">');
  lines.push("<Document>");
  lines.push(`  <name>${xmlEscape(docName)}</name>`);

  folders.forEach((folder, idx) => {
    const styleId = `s${idx}`;
    const cols = hexToKmlColors(folder.color);
    lines.push(`  <Style id="${styleId}">`);
    lines.push(`    <LineStyle><color>${cols.line}</color><width>2</width></LineStyle>`);
    lines.push(`    <PolyStyle><color>${cols.fill}</color><fill>1</fill><outline>1</outline></PolyStyle>`);
    lines.push("  </Style>");
    lines.push("  <Folder>");
    lines.push(`    <name>${xmlEscape(folder.name)}</name>`);
    folder.polys.forEach(({ rings, props }) => {
      lines.push("    <Placemark>");
      const fName = props && (props.name || props.NAME || props.Name || props.id || props.ID);
      if (fName) lines.push(`      <name>${xmlEscape(fName)}</name>`);
      lines.push(`      <styleUrl>#${styleId}</styleUrl>`);
      const propKeys = props ? Object.keys(props).slice(0, 10) : [];
      if (propKeys.length) {
        lines.push("      <ExtendedData>");
        for (const k of propKeys) {
          lines.push(`        <Data name="${xmlEscape(k)}"><value>${xmlEscape(props[k])}</value></Data>`);
        }
        lines.push("      </ExtendedData>");
      }
      lines.push("      <Polygon>");
      lines.push("        <outerBoundaryIs><LinearRing><coordinates>");
      lines.push("          " + rings[0].map(([x, y]) => `${x},${y},0`).join(" "));
      lines.push("        </coordinates></LinearRing></outerBoundaryIs>");
      for (let i = 1; i < rings.length; i++) {
        lines.push("        <innerBoundaryIs><LinearRing><coordinates>");
        lines.push("          " + rings[i].map(([x, y]) => `${x},${y},0`).join(" "));
        lines.push("        </coordinates></LinearRing></innerBoundaryIs>");
      }
      lines.push("      </Polygon>");
      lines.push("    </Placemark>");
    });
    lines.push("  </Folder>");
  });

  lines.push("</Document>");
  lines.push("</kml>");
  return lines.join("\n");
}

    onClick={onClick}
    title={title}
    className="group rounded-xl border border-[var(--line)] bg-[var(--panel)] hover:bg-[var(--panel-2)] hover:border-[var(--line)] transition px-2.5 py-3 flex flex-col items-center justify-center gap-1.5 text-center"
  >
    <span className="grid place-items-center w-9 h-9 rounded-lg bg-[var(--panel-2)] text-[var(--ink-soft)] group-hover:bg-[var(--line-2)] shrink-0 transition">
      <Icon name={icon} size={18} />
    </span>
    <div className="min-w-0 w-full">
      <div className="text-[12.5px] font-semibold text-[var(--ink)] leading-tight truncate">{label}</div>
      {sub && <div className="text-[10px] text-[var(--muted)] mt-0.5 font-mono tracking-tight truncate">{sub}</div>}
    </div>
  </button>
);

/* ──────────────────────────────────────────────────────────────────────────
   DROP ZONE — drag-and-drop file uploader
   ────────────────────────────────────────────────────────────────────────── */
const DropZone = ({ icon, label, hint, accept, onFile, onFiles, multiple = false }) => {
  const [hover, setHover] = useState(false);

  const sendFiles = (fileList) => {
    const files = Array.from(fileList || []);
    if (!files.length) return;

    if (multiple && onFiles) {
      onFiles(files);
    } else if (onFile) {
      onFile(files[0]);
    }
  };

  const handlePick = (e) => {
    sendFiles(e.target.files);
    e.target.value = "";
  };

  return (
    <label
      onDragOver={(e) => {
        e.preventDefault();
        e.stopPropagation();
        e.dataTransfer.dropEffect = "copy";
        if (!hover) setHover(true);
      }}
      onDragEnter={(e) => {
        e.preventDefault();
        e.stopPropagation();
        setHover(true);
      }}
      onDragLeave={(e) => {
        e.preventDefault();
        e.stopPropagation();
        setHover(false);
      }}
      onDrop={(e) => {
        e.preventDefault();
        e.stopPropagation();
        setHover(false);
        sendFiles(e.dataTransfer.files);
      }}
      className={`block cursor-pointer rounded-xl border-2 border-dashed px-3 py-3 transition select-none ${
        hover
          ? "border-[var(--accent)] bg-[var(--accent-soft)]"
          : "border-[var(--line)] bg-[var(--panel-2)] hover:border-[var(--muted)] hover:bg-[var(--panel)]"
      }`}
    >
      <div className="flex items-center gap-3 pointer-events-none">
        <span
          className={`grid place-items-center w-9 h-9 rounded-lg shrink-0 transition ${
            hover
              ? "bg-[var(--panel)] text-[var(--accent-ink)]"
              : "bg-[var(--panel)] text-[var(--ink-soft)] border border-[var(--line)]"
          }`}
        >
          <Icon name={hover ? "download" : icon} size={18} />
        </span>

        <div className="min-w-0 flex-1">
          <div className="text-[13px] font-semibold leading-tight text-[var(--ink)]">
            {hover ? "اترك الملفات هنا" : label}
          </div>

          {hint && (
            <div className="text-[10.5px] text-slate-500 mt-0.5 leading-tight truncate">
              {hint}
            </div>
          )}
        </div>
      </div>

      <input
        type="file"
        accept={accept}
        hidden
        multiple={multiple}
        onChange={handlePick}
      />
    </label>
  );
};

  return (

      <div className="flex items-center gap-2">
        <span
          className="w-2.5 h-2.5 rounded-full shrink-0 ring-2 ring-white"
          style={{ background: layer.color, boxShadow: "0 0 0 1px " + layer.color + "33" }}
        />
        <button
          onClick={() => onFocus(layer.id)}
          className="flex-1 min-w-0 text-right"
          title="تكبير على الطبقة"
        >
          <div className="text-[13px] font-semibold text-slate-900 truncate">{layer.name}</div>
          <div className="flex items-center gap-1.5 text-[10.5px] text-slate-500 mt-0.5">
            <Icon name={geom.icon} size={11} />
            <span className="font-medium text-slate-700">{geom.txt}</span>
            <span className="text-slate-300">•</span>
            <span className="font-mono">{layer.count} عنصر</span>
            <span className="text-slate-300">•</span>
            <span className="text-slate-400">{sourceLabel}</span>
          </div>
          {(layer.crs || layer.zone) && (
            <div className="mt-1.5 flex items-center gap-1.5 flex-wrap">
              <span className="font-mono text-[9.5px] font-semibold tracking-wider px-1.5 py-[2px] rounded bg-slate-100 text-slate-600 uppercase">
                {geom.short}
              </span>
              <span
                className="font-mono text-[10.5px] font-medium flex items-center gap-1 truncate"
                title={layer.crs?.long || ""}
                style={{ color: layer.crs?.kind === "UNKNOWN" ? "#94a3b8" : "var(--ink-soft)" }}
              >
                <span
                  className="w-1.5 h-1.5 rounded-full shrink-0"
                  style={{ background: crsDotColor(layer.crs) }}
                ></span>
                {layer.crs?.short || (layer.zone ? `UTM Zone ${layer.zone}${layer.hemi}` : "غير معروف")}
              </span>
            </div>
          )}
        </button>

        <button
          onClick={() => onToggle(layer.id)}

        >
          <Icon name={layer.visible ? "eye" : "eyeOff"} size={16} />
        </button>
        {layer.kind === "shapefile" && (
          <button
            onClick={() => onOpenTable(layer.id)}
            className="grid place-items-center w-8 h-8 rounded-md text-slate-600 hover:bg-[var(--accent-soft)] hover:text-[var(--accent-ink)]"
            title="فتح جدول البيانات (Attribute Table)"
          >
            <Icon name="table" size={15} />
          </button>
        )}
        <button
          onClick={() => onDelete(layer.id)}
          className="grid place-items-center w-8 h-8 rounded-md text-slate-600 hover:bg-red-50 hover:text-red-600"
          title="حذف"
        >
          <Icon name="trash" size={15} />
        </button>
      </div>
    </div>
  );
};

/* ──────────────────────────────────────────────────────────────────────────
   ATTRIBUTE TABLE MODAL — QGIS-style table of feature properties for a
   shapefile layer. Click a row to focus / highlight the feature on the map.
   ────────────────────────────────────────────────────────────────────────── */
const AttributeTableModal = ({ layer, onClose, onZoomFeature, onToggleFeatureVisibility, onDeleteFeature }) => {
  const [query, setQuery] = useState("");
  const [sortKey, setSortKey] = useState(null);
  const [sortDir, setSortDir] = useState("asc");
  const [selectedIdx, setSelectedIdx] = useState(null);

  // ── تأكيد الحذف: ضغطة أولى تسلّح الزرار (يتحول لـ ✓)، ضغطة تانية خلال 3 ثواني
  // بتنفّذ الحذف فعليًا. بديل عن window.confirm اللي المتصفح ممكن يقفله لوحده
  // لو المستخدم ضغط قبل كده "منع النافذة دي من إظهار حوارات تانية". ──
  const [confirmDeleteId, setConfirmDeleteId] = useState(null);
  const confirmDeleteTimerRef = useRef(null);
  useEffect(() => () => clearTimeout(confirmDeleteTimerRef.current), []);
  const armDelete = (fid) => {
    clearTimeout(confirmDeleteTimerRef.current);
    setConfirmDeleteId(fid);
    confirmDeleteTimerRef.current = setTimeout(() => setConfirmDeleteId(null), 3000);
  };

  // ── Dragging logic ──
  const wrapRef   = useRef(null);
  const posRef    = useRef({ x: null, y: null });
  const dragState = useRef(null);

  useEffect(() => { setConfirmDeleteId(null); }, [layer?.id]);

  useEffect(() => {
    if (!layer) return;
    if (posRef.current.x !== null) return; // لو تم حساب الموقع مسبقاً احتفظ به
    
    // حجم مبدئي أصغر وأنسب للنافذة
    const w = Math.min(800, window.innerWidth * 0.9);
    const h = Math.min(500, window.innerHeight * 0.8);
    
    // حساب المنتصف بدقة
    const x = Math.max(10, (window.innerWidth - w) / 2);
    const y = Math.max(10, (window.innerHeight - h) / 2);
    
    posRef.current = { x, y };
    if (wrapRef.current) {
      wrapRef.current.style.left = x + "px";
      wrapRef.current.style.top  = y + "px";
      wrapRef.current.style.transform = "none"; // إزالة الـ transform المبدئي لمنع الطيران خارج الشاشة
    }
  }, [layer]);

  const onDragStart = useCallback((clientX, clientY) => {
    if (!wrapRef.current) return;
    const rect = wrapRef.current.getBoundingClientRect();
    dragState.current = {
      startMouseX: clientX, startMouseY: clientY,
      startElX: rect.left,  startElY:  rect.top,
    };

    const onMove = (e) => {
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      const dx = cx - dragState.current.startMouseX;
      const dy = cy - dragState.current.startMouseY;
      const nx = dragState.current.startElX + dx;
      const ny = dragState.current.startElY + dy;
      posRef.current = { x: nx, y: ny };
      if (wrapRef.current) {
        wrapRef.current.style.left = nx + "px";
        wrapRef.current.style.top  = ny + "px";
        wrapRef.current.style.transform = "none";
      }
    };

    const onUp = () => {
      dragState.current = null;
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup",   onUp);
      window.removeEventListener("touchmove", onMove);
      window.removeEventListener("touchend",  onUp);
      if (wrapRef.current) wrapRef.current.style.cursor = "";
    };

    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup",   onUp);
    window.addEventListener("touchmove", onMove, { passive: false });
    window.addEventListener("touchend",  onUp);
    if (wrapRef.current) wrapRef.current.style.cursor = "grabbing";
  }, []);

  const features = useMemo(() => {
    if (!layer) return [];
    const out = [];
    (layer.geojson || []).forEach(fc => {
      (fc.features || []).forEach(f => out.push(f));
    });
    return out;
  }, [layer]);

  const columns = useMemo(() => {
    const seen = new Map();
    features.forEach(f => {
      const p = f.properties || {};
      Object.keys(p).forEach(k => { if (!seen.has(k)) seen.set(k, true); });
    });
    return Array.from(seen.keys());
  }, [features]);

  const rows = useMemo(() => {
    const q = query.trim().toLowerCase();
    const filtered = features
      .map((f, i) => {
        const featureId = String(f.__featureId ?? i);
        const hidden = layer?.hiddenFeatureIds?.has(featureId);

        return {
          idx: i,
          featureId,
          hidden,
          props: f.properties || {},
          geom: f.geometry,
        };
      })
      .filter(r => {
        if (!q) return true;
        for (const c of columns) {
          if (String(r.props[c] ?? "").toLowerCase().includes(q)) return true;
        }
        return String(r.idx + 1).includes(q);
      });
    if (sortKey) {
      filtered.sort((a, b) => {
        const va = a.props[sortKey], vb = b.props[sortKey];
        const na = parseFloat(va), nb = parseFloat(vb);
        const numeric = isFinite(na) && isFinite(nb);
        const cmp = numeric ? (na - nb) : String(va ?? "").localeCompare(String(vb ?? ""), "ar");
        return sortDir === "asc" ? cmp : -cmp;
      });
    }
    return filtered;
  }, [features, columns, query, sortKey, sortDir, layer?.hiddenFeatureIds]);

  const setSort = (col) => {
    if (sortKey === col) setSortDir(d => d === "asc" ? "desc" : "asc");
    else { setSortKey(col); setSortDir("asc"); }
  };

  if (!layer) return null;

  const featureCentroid = (geom) => {
    if (!geom) return null;
    const c = geoJsonCentroid({ type: "Feature", geometry: geom });
    return c;
  };

  const initStyle = posRef.current.x !== null
    ? { left: posRef.current.x + "px", top: posRef.current.y + "px", transform: "none" }
    : { left: "50%", top: "50%", transform: "translate(-50%,-50%)" };

  return (
    <div
      ref={wrapRef}
      className="fixed z-[1000] bg-[var(--panel)] rounded-2xl shadow-2xl flex flex-col overflow-hidden"
      style={{
        ...initStyle,
        width: '800px',
        maxWidth: '90vw',
        height: '500px',
        maxHeight: '80vh',
        boxShadow: '0 20px 40px -10px rgba(0,0,0,0.4)',
        border: '1px solid var(--line)'
      }}
      dir="rtl"
    >
      {/* Header (Draggable) */}
      <header
        className="px-4 py-3 border-b border-[var(--line)] flex items-center gap-3 bg-[var(--panel-2)] select-none"
        style={{ cursor: "grab" }}
        onMouseDown={(e) => { if (e.button !== 0) return; e.preventDefault(); onDragStart(e.clientX, e.clientY); }}
        onTouchStart={(e) => { e.preventDefault(); onDragStart(e.touches[0].clientX, e.touches[0].clientY); }}
      >
        <span className="grid place-items-center w-7 h-7 rounded-lg bg-[var(--accent-soft)] text-[var(--accent-ink)] shrink-0 pointer-events-none">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
            <circle cx="9" cy="5" r="1" fill="currentColor"/><circle cx="15" cy="5" r="1" fill="currentColor"/>
            <circle cx="9" cy="12" r="1" fill="currentColor"/><circle cx="15" cy="12" r="1" fill="currentColor"/>
            <circle cx="9" cy="19" r="1" fill="currentColor"/><circle cx="15" cy="19" r="1" fill="currentColor"/>
          </svg>
        </span>
        <span
          className="w-3 h-3 rounded-full shrink-0 ring-2 ring-white pointer-events-none"
          style={{ background: layer.color, boxShadow: "0 0 0 1px " + layer.color + "33" }}
        />
        <div className="min-w-0 pointer-events-none">
          <div className="text-[14px] font-bold text-[var(--ink)] truncate leading-tight">
            {layer.name}
          </div>
          <div className="text-[11px] text-[var(--muted)] mt-0.5 font-mono">
            {features.length} عنصر · {columns.length} عمود
            {layer.crs?.short ? ` · ${layer.crs.short}` : ""}
          </div>
        </div>

        <div className="flex-1" />

        <div
          className="relative"
          onMouseDown={e => e.stopPropagation()}
          onTouchStart={e => e.stopPropagation()}
        >
          <Icon name="search" size={14} className="absolute top-1/2 right-2.5 -translate-y-1/2 text-[var(--muted)] pointer-events-none" />
          <input
            type="text"
            value={query}
            onChange={(e) => setQuery(e.target.value)}
            placeholder="بحث في كل الأعمدة..."
            className="h-9 w-56 rounded-lg border border-[var(--line)] bg-[var(--panel)] pr-7 pl-2.5 text-[12.5px] text-[var(--ink)] placeholder:text-[var(--muted)] focus:outline-none focus:border-[var(--accent)] transition"
          />
        </div>

        <button
          onMouseDown={e => e.stopPropagation()}
          onTouchStart={e => e.stopPropagation()}
          onClick={onClose}
          className="grid place-items-center w-9 h-9 rounded-md text-[var(--ink-soft)] hover:bg-[var(--line-2)] transition"
          aria-label="إغلاق"
        >
          <Icon name="close" size={18} />
        </button>
      </header>

      {/* Table Content */}
      <div className="flex-1 min-h-0 overflow-auto scroll-thin" dir="ltr">
        {rows.length === 0 ? (
          <div className="h-full grid place-items-center p-8">
            <div className="text-center">
              <Icon name="table" size={32} className="mx-auto text-[var(--muted)] mb-2" />
              <div className="text-[13px] text-[var(--ink-soft)]">
                {features.length === 0 ? "لا توجد عناصر في هذه الطبقة" : "لا توجد نتائج مطابقة"}
              </div>
            </div>
          </div>
        ) : (
          <table className="w-full border-collapse text-[12px]" style={{ direction: "ltr" }}>
            <thead className="sticky top-0 z-10 bg-[var(--panel-2)]">
              <tr>
                <th className="text-left font-mono text-[10.5px] font-semibold text-[var(--ink-soft)] uppercase tracking-wider px-2 py-2 border-b border-[var(--line)] bg-[var(--panel-2)] sticky left-0 z-20">
                  #
                </th>
                <th className="text-center font-mono text-[10.5px] font-semibold text-[var(--ink-soft)] uppercase tracking-wider px-2 py-2 border-b border-[var(--line)] bg-[var(--panel-2)]">
                  عرض
                </th>
                {columns.length === 0 ? (
                  <th className="text-left text-[11px] font-semibold text-[var(--muted)] px-3 py-2 border-b border-[var(--line)]">
                    (لا توجد سمات)
                  </th>
                ) : columns.map(col => (
                  <th
                    key={col}
                    onClick={() => setSort(col)}
                    className="text-left text-[11.5px] font-semibold text-[var(--ink-soft)] px-3 py-2 border-b border-[var(--line)] cursor-pointer hover:bg-[var(--line-2)] select-none whitespace-nowrap"
                  >
                    <span className="flex items-center gap-1">
                      {col}
                      {sortKey === col && (
                        <Icon name={sortDir === "asc" ? "chevronUp" : "chevronDown"} size={11} className="text-[var(--accent)]" />
                      )}
                    </span>
                  </th>
                ))}
              </tr>
            </thead>
            <tbody>
              {rows.map((r, i) => {
                const isSel = selectedIdx === r.idx;
                return (
                  <tr
                    key={r.idx}
                    onClick={() => {
                      setSelectedIdx(r.idx);
                      const c = featureCentroid(r.geom);
                      if (c) onZoomFeature(c);
                    }}
                    className={`cursor-pointer transition ${
                      r.hidden
                        ? "opacity-50 bg-[var(--panel-2)]"
                        : isSel
                          ? "bg-[var(--accent-soft)]"
                          : i % 2
                            ? "bg-[var(--panel)]"
                            : "bg-[var(--panel-2)]"
                    } hover:bg-[var(--accent-soft)]/70`}
                  >
                    <td className={`font-mono text-[10.5px] text-[var(--muted)] px-2 py-1.5 border-b border-[var(--line-2)] sticky left-0 ${
                      isSel ? "bg-[var(--accent-soft)]" : i % 2 ? "bg-[var(--panel)]" : "bg-[var(--panel-2)]"
                    }`}>
                      {r.idx + 1}
                    </td>

                    <td className="text-center px-2 py-1.5 border-b border-[var(--line-2)]">
                      <div className="flex items-center justify-center gap-1">
                        <button
                          type="button"
                          onClick={(e) => {
                            e.stopPropagation();
                            onToggleFeatureVisibility?.(layer.id, r.featureId);
                          }}
                          className={`grid place-items-center w-7 h-7 rounded-md transition ${
                            r.hidden
                              ? "bg-[var(--panel-2)] text-[var(--muted)] hover:bg-[var(--line)]"
                              : "text-[var(--ink-soft)] hover:bg-[var(--accent-soft)] hover:text-[var(--accent-ink)]"
                          }`}
                          title={r.hidden ? "إظهار هذا الجزء على الخريطة" : "إخفاء هذا الجزء من الخريطة"}
                        >
                          <Icon name={r.hidden ? "eyeOff" : "eye"} size={14} />
                        </button>

                        <button
                          type="button"
                          onClick={(e) => {
                            e.stopPropagation();
                            if (confirmDeleteId === r.featureId) {
                              clearTimeout(confirmDeleteTimerRef.current);
                              setConfirmDeleteId(null);
                              onDeleteFeature?.(layer.id, r.featureId);
                            } else {
                              armDelete(r.featureId);
                            }
                          }}
                          className={`grid place-items-center rounded-md transition ${
                            confirmDeleteId === r.featureId
                              ? "w-auto px-2 h-7 gap-1 bg-red-600 text-white hover:bg-red-700 text-[10.5px] font-semibold whitespace-nowrap"
                              : "w-7 h-7 text-[var(--ink-soft)] hover:bg-red-50 hover:text-red-600"
                          }`}
                          title={confirmDeleteId === r.featureId ? "دوس تاني للتأكيد" : "حذف هذا الجزء من الطبقة"}
                          aria-label="حذف هذا الجزء من الطبقة"
                        >
                          {confirmDeleteId === r.featureId ? (
                            <><Icon name="check" size={12} /> تأكيد</>
                          ) : (
                            <Icon name="trash" size={14} />
                          )}
                        </button>
                      </div>
                    </td>

                    {columns.length === 0 ? (
                      <td className="text-[11px] text-[var(--muted)] italic px-3 py-1.5 border-b border-[var(--line-2)]">—</td>
                    ) : columns.map(col => {
                      const val = r.props[col];
                      const isNum = val !== "" && val !== null && val !== undefined && isFinite(parseFloat(val)) && !isNaN(parseFloat(val));
                      return (
                        <td
                          key={col}
                          className={`text-[12px] text-[var(--ink)] px-3 py-1.5 border-b border-[var(--line-2)] whitespace-nowrap max-w-[260px] truncate ${
                            isNum ? "font-mono text-right" : ""
                          }`}
                          title={String(val ?? "")}
                        >
                          {val === "" || val === null || val === undefined ? (
                            <span className="text-[var(--muted)]">—</span>
                          ) : String(val)}
                        </td>
                      );
                    })}
                  </tr>
                );
              })}
            </tbody>
          </table>
        )}
      </div>

      {/* Footer */}
      <footer className="px-4 py-2.5 border-t border-[var(--line)] flex items-center justify-between gap-3 bg-[var(--panel-2)]">
        <div className="text-[11px] text-[var(--ink-soft)] font-mono">
          {query ? `${rows.length} من ${features.length}` : `${features.length} صف`}
          {selectedIdx !== null && ` · #${selectedIdx + 1} محدد`}
        </div>
        <div className="text-[10.5px] text-[var(--muted)]">
          انقر على صف لتركيز الخريطة عليه
        </div>
      </footer>
    </div>
  );
};

/* ──────────────────────────────────────────────────────────────────────────
   TOAST
   ────────────────────────────────────────────────────────────────────────── */
const Toast = ({ toast }) => {
  if (!toast) return null;
  const tones = {
    info:   { background: "var(--panel)", color: "var(--ink)", border: "1px solid var(--line)" },
    ok:     { background: "#059669",      color: "#ffffff" },
    err:    { background: "#e11d48",      color: "#ffffff" },
    warn:   { background: "#f59e0b",      color: "#ffffff" },
  };
  return (
    <div className="fixed bottom-5 left-1/2 -translate-x-1/2 z-[1100] toast">
      <div
        className="px-4 py-2.5 rounded-xl shadow-lg text-[13px] font-medium"
        style={tones[toast.tone || 'info']}
      >
        {toast.msg}
      </div>
    </div>
  );
};
