/* ══════════════════════════════════════════════════════════════════════════
   الوصف الذكي — SmartDescriptionModal
   ══════════════════════════════════════════════════════════════════════════ */
function SmartDescriptionModal({ open, onClose, type, onTypeChange, state, setState, pickRef, showToast }) {
  const wrapRef = React.useRef(null);
  const posRef = React.useRef({ x: null, y: null });
  const dragState = React.useRef(null);
  const [pickMode, setPickMode] = React.useState(null);
  const [copied, setCopied] = React.useState(false);

  const M2_PER_FEDDAN = 4200.83;
  const feddan = v => Number.isFinite(Number(v)) ? Number(v) / M2_PER_FEDDAN : null;
  // تنسيق المساحات حسب المواصفة: نأخذ أول الخانات المطلوبة فقط من اليمين
  // بعد العلامة العشرية — بدون Round وبدون أي تقريب.
  // الأرض: أول 4 خانات عشرية. المتر: أول خانتين عشريتين.
  const truncateDecimals = (value, decimals) => {
    const n = Number(value);
    if (!Number.isFinite(n)) return "";

    const negative = n < 0;
    const abs = Math.abs(n);
    let str = String(abs);

    // تحويل الصيغة العلمية إلى رقم عشري قبل القطع، حتى لا يحصل أي تقريب.
    if (/e/i.test(str)) {
      const [mantissa, exponentText] = str.toLowerCase().split("e");
      const exponent = Number(exponentText);
      let [intPart, fracPart = ""] = mantissa.split(".");
      const digits = intPart + fracPart;
      const decimalPos = intPart.length + exponent;
      if (decimalPos <= 0) {
        str = "0." + "0".repeat(-decimalPos) + digits;
      } else if (decimalPos >= digits.length) {
        str = digits + "0".repeat(decimalPos - digits.length);
      } else {
        str = digits.slice(0, decimalPos) + "." + digits.slice(decimalPos);
      }
    }

    let [integerPart, fractionPart = ""] = str.split(".");
    fractionPart = (fractionPart + "0".repeat(decimals)).slice(0, decimals);
    return (negative ? "-" : "") + integerPart + (decimals ? "." + fractionPart : "");
  };

  // مهم: landArea / roadArea / part.area / requestedArea / buildingLand كلها
  // مخزنة بالمتر المربع، لذلك التحويل إلى فدان يتم مرة واحدة فقط هنا.
  const fmtF = v => v == null ? "" : truncateDecimals(feddan(v), 4);
  const fmtM = v => v == null ? "" : truncateDecimals(v, 2);

  React.useEffect(() => {
    if (!open) return;
    if (posRef.current.x !== null) return;
    const x = Math.max(12, window.innerWidth / 2 - 245);
    const y = Math.max(12, window.innerHeight / 2 - 300);
    posRef.current = { x, y };
    if (wrapRef.current) { wrapRef.current.style.left = x + "px"; wrapRef.current.style.top = y + "px"; }
  }, [open]);

  React.useEffect(() => {
    if (!open) return;
    window.__smartDescriptionPickArea = (areaSqm) => {
      const mode = pickRef.current;
      if (!mode) return;
      setState(prev => {
        const next = { ...prev };
        if (mode === "landArea") next.landArea = areaSqm;
        else if (mode === "roadArea") next.roadArea = areaSqm;
        else if (mode === "requestedLand") next.requestedArea = areaSqm;
        else if (mode === "part") {
          next.parts = prev.parts.map(p => p.id === pickRef.currentId ? { ...p, area: areaSqm } : p);
        } else if (mode === "occupation") {
          next.occupations = prev.occupations.map(o => o.id === pickRef.currentId ? { ...o, area: areaSqm } : o);
        } else if (mode === "partOcc") {
          next.parts = prev.parts.map(p => ({
            ...p, occupations: (p.occupations || []).map(o => o.id === pickRef.currentId ? { ...o, area: areaSqm } : o)
          }));
        } else if (mode === "requestedBuilding") {
          next.requestedArea = areaSqm;
        } else if (mode.startsWith("building:")) {
          const id = mode.split(":")[1];
          next.buildings = prev.buildings.map(b => b.id === id ? { ...b, area: areaSqm } : b);
        } else if (mode.startsWith("buildingLand:")) {
          const id = mode.split(":")[1];
          next.buildings = prev.buildings.map(b => b.id === id ? { ...b, landArea: areaSqm } : b);
        } else if (mode.startsWith("attachment:")) {
          const [, bid, aid] = mode.split(":");
          next.buildings = prev.buildings.map(b => b.id === bid ? {
            ...b, attachments: (b.attachments || []).map(a => a.id === aid ? { ...a, area: areaSqm } : a)
          } : b);
        }
        return next;
      });
      setPickMode(null);
      pickRef.current = null;
      pickRef.currentId = null;
    };
    return () => { delete window.__smartDescriptionPickArea; };
  }, [open, setState, pickRef]);

  React.useEffect(() => {
    pickRef.current = pickMode;
  }, [pickMode, pickRef]);

  const startPick = (mode, id = null) => {
    pickRef.current = mode;
    pickRef.currentId = id;
    setPickMode(mode);
  };

  const onDragStart = React.useCallback((clientX, clientY) => {
    if (!wrapRef.current) return;
    const rect = wrapRef.current.getBoundingClientRect();
    dragState.current = { startMouseX: clientX, startMouseY: clientY, startElX: rect.left, startElY: rect.top };
    const onMove = e => {
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      const nx = dragState.current.startElX + cx - dragState.current.startMouseX;
      const ny = dragState.current.startElY + cy - dragState.current.startMouseY;
      posRef.current = { x: nx, y: ny };
      if (wrapRef.current) { wrapRef.current.style.left = nx + "px"; wrapRef.current.style.top = ny + "px"; wrapRef.current.style.transform = "none"; }
    };
    const onUp = () => {
      dragState.current = null;
      window.removeEventListener("mousemove", onMove); window.removeEventListener("mouseup", onUp);
      window.removeEventListener("touchmove", onMove); window.removeEventListener("touchend", onUp);
    };
    window.addEventListener("mousemove", onMove); window.addEventListener("mouseup", onUp);
    window.addEventListener("touchmove", onMove, { passive: false }); window.addEventListener("touchend", onUp);
  }, []);

  const reset = () => {
    setPickMode(null); pickRef.current = null; pickRef.currentId = null;
    setCopied(false);
    setState({ landArea:null, landDescription:"", road:false, roadArea:null, showRoadArea:true, divided:false, parts:[], occupations:[], requestedArea:null, buildings:[] });
  };

  const descUid = () => (globalThis.crypto?.randomUUID ? globalThis.crypto.randomUUID() : "sd-" + Date.now() + "-" + Math.random().toString(36).slice(2));
  const nextDescSeq = p => {
    const seqs = [
      ...(p.parts || []).map(x => Number(x.seq) || 0),
      ...(p.parts || []).flatMap(x => (x.occupations || []).map(o => Number(o.seq) || 0)),
      ...(p.occupations || []).map(x => Number(x.seq) || 0),
      ...(p.buildings || []).map(x => Number(x.seq) || 0),
    ];
    return Math.max(0, ...seqs) + 1;
  };
  const addPart = () => setState(p => ({ ...p, parts:[...p.parts, { id: descUid(), seq: nextDescSeq(p), area:null, description:"", occupations:[] }] }));
  const removePart = id => setState(p => ({ ...p, parts:p.parts.filter(x=>x.id!==id) }));
  const addPartOccupation = id => setState(p => ({ ...p, parts:p.parts.map(x => x.id===id ? {...x, occupations:[...(x.occupations||[]), {id:descUid(), seq:nextDescSeq(p), area:null, description:""}]} : x) }));
  const removePartOccupation = (pid, oid) => setState(p => ({ ...p, parts:p.parts.map(x => x.id===pid ? {...x, occupations:(x.occupations||[]).filter(o=>o.id!==oid)} : x) }));

  // الترميز في الأرض المقسمة تسلسلي واحد لكل العناصر: A ثم B ثم C...
  // لا يوجد A1 أو B1 أو أي ترميز هرمي، ولا تتكرر أي علامة.
  const alphaCode = index => {
    let n = Number(index) || 0, out = "";
    do { out = String.fromCharCode(65 + (n % 26)) + out; n = Math.floor(n / 26) - 1; } while (n >= 0);
    return out;
  };
  const getDividedCodes = () => {
    const entities = [];
    (state.parts || []).forEach((p, pi) => {
      entities.push({ key:`part:${p.id}`, seq:Number(p.seq) || 0, type:"part", partIndex:pi, partId:p.id });
      // توافق مع البيانات القديمة: أي إشغال كان محفوظًا داخل الجزء يعامل كعنصر مستقل.
      (p.occupations || []).forEach((o, oi) => entities.push({ key:`occ:${o.id}`, seq:Number(o.seq) || 0, type:"occupation", partIndex:pi, occIndex:oi, occId:o.id }));
    });
    // في الأرض المقسمة، الإشغالات الجديدة عناصر مستقلة في نفس مستوى الأجزاء.
    (state.occupations || []).forEach((o, oi) => {
      entities.push({ key:`globalOcc:${o.id}`, seq:Number(o.seq) || 0, type:"occupation", partIndex:999999, occIndex:oi, occId:o.id });
    });
    // التسلسل يعتمد على ترتيب الإضافة (seq)، والحرف لا يتكرر أبدًا.
    entities.sort((a,b) => (a.seq-b.seq) || (a.type === b.type ? a.partIndex-b.partIndex : a.type === "part" ? -1 : 1) || ((a.occIndex||0)-(b.occIndex||0)));
    const map = new Map();
    entities.forEach((e,i) => map.set(e.key, alphaCode(i)));
    return map;
  };
  const addOccupation = () => setState(p => ({ ...p, occupations:[...p.occupations,{id:descUid(),seq:nextDescSeq(p),area:null,description:""}] }));
  const removeOccupation = id => setState(p => ({ ...p, occupations:p.occupations.filter(x=>x.id!==id) }));
  const addBuilding = () => setState(p => ({ ...p, buildings:[...p.buildings,{id:descUid(),area:null,landArea:null,attachments:[]}] }));
  const removeBuilding = id => setState(p => ({ ...p, buildings:p.buildings.filter(x=>x.id!==id) }));
  const addAttachment = bid => setState(p => ({ ...p, buildings:p.buildings.map(b => b.id===bid ? {...b,attachments:[...(b.attachments||[]),{id:descUid(),type:"فناء",area:null}]} : b) }));
  const removeAttachment = (bid, aid) => setState(p => ({ ...p, buildings:p.buildings.map(b => b.id===bid ? {...b,attachments:(b.attachments||[]).filter(a=>a.id!==aid)} : b) }));

  const code = n => String.fromCharCode(65 + n);

  // ترميز المباني والملحقات: مبنى واحد فقط بلا ملحقات = بدون ترميز.
  // عند وجود ملحق أو مبنى آخر يبدأ الترميز من A ويستمر تسلسليًا على كل العناصر.
  const buildingCodingActive = () => {
    const total = (state.buildings || []).reduce((sum, b) => sum + 1 + ((b.attachments || []).length), 0);
    return total > 1;
  };
  const getBuildingElementCodes = () => {
    const map = new Map();
    if (!buildingCodingActive()) return map;
    let n = 0;
    (state.buildings || []).forEach(b => {
      map.set(`building:${b.id}`, code(n++));
      (b.attachments || []).forEach(a => map.set(`attachment:${b.id}:${a.id}`, code(n++)));
    });
    return map;
  };

  const buildLandDescription = () => {
    const lines=[];
    if (state.landArea != null) {
      const landDesc = (state.landDescription || "").trim();
      lines.push(`أرض${landDesc ? ` ${landDesc}` : ""} بمساحة ${fmtF(state.landArea)} فدان`);
    }
    if (state.road) {
      if (state.showRoadArea && state.roadArea != null) lines.push(`وبها طريق بمساحة ${fmtF(state.roadArea)} فدان`);
      else lines.push("وبها طريق");
    }
    if (state.divided && state.parts.length) {
      // الأرض المقسمة: كل أرض وإشغال يأخذ حرفًا واحدًا متسلسلًا حسب ترتيب الإضافة:
      // أرض (A)، أرض (B)، مبني (C)... ولا نستخدم A1/B1 أو أي ترقيم هرمي.
      const codes = getDividedCodes();
      const entities = [];
      state.parts.forEach((p,i) => {
        entities.push({ type:"part", part:p, partIndex:i, seq:Number(p.seq) || 0 });
        // دعم البيانات القديمة فقط؛ في الواجهة الجديدة الإشغالات تكون مستقلة أسفل الأجزاء.
        (p.occupations || []).forEach((o,j) => entities.push({ type:"occupation", occupation:o, part:p, partIndex:i, occIndex:j, seq:Number(o.seq) || 0, legacyNested:true }));
      });
      (state.occupations || []).forEach((o,j) => {
        entities.push({ type:"occupation", occupation:o, partIndex:999999, occIndex:j, seq:Number(o.seq) || 0, global:true });
      });
      entities.sort((a,b) => (a.seq-b.seq) || (a.type === b.type ? a.partIndex-b.partIndex : a.type === "part" ? -1 : 1) || ((a.occIndex||0)-(b.occIndex||0)));
      entities.forEach(e => {
        if (e.type === "part") {
          const c = codes.get(`part:${e.part.id}`) || "A";
          const d = (e.part.description || "").trim();
          lines.push(`وبها أرض${d ? ` ${d}` : ""} (${c})${e.part.area != null ? ` بمساحة ${fmtF(e.part.area)} فدان` : ""}`.trim());
        } else {
          const c = e.global ? (codes.get(`globalOcc:${e.occupation.id}`) || "A") : (codes.get(`occ:${e.occupation.id}`) || "A");
          const d = (e.occupation.description || "").trim();
          const area = e.occupation.area != null ? ` بمساحة ${fmtM(e.occupation.area)} م²` : "";
          lines.push(`وبها ${d ? `${d} ` : ""}(${c})${area}`.trim());
        }
      });
    } else {
      // الأرض غير المقسمة: الترميز يظل موجوداً في الوصف.
      // مثال: "أرض بمساحة ... فدان، مقام عليها مبني (A) بمساحة ... م²"
      state.occupations.forEach((o,i) => {
        const desc = (o.description || "").trim();
        const area = o.area != null ? ` بمساحة ${fmtM(o.area)} م²` : "";
        const isBuilding = /^مبن[ىي]/u.test(desc);
        const prefix = i === 0 ? (isBuilding ? "مقام عليها" : "وبها") : "وبها";
        lines.push(`${prefix} ${desc ? `${desc} ` : ""}(${code(i)})${area}`.trim());
      });
    }
    if (state.requestedArea != null) lines.push(`الجزء المراد تقنينه بمساحة ${fmtF(state.requestedArea)} فدان`);
    if (state.road && state.roadArea != null && state.landArea != null) {
      const net = state.landArea - state.roadArea;
      if (net >= 0) lines.push(`صافي مساحة الأرض ${fmtF(net)} فدان`);
    }
    return lines.join("، ");
  };

  const buildBuildingDescription = () => {
    const lines=[];
    const codes = getBuildingElementCodes();
    state.buildings.forEach((b) => {
      const buildingCode = codes.get(`building:${b.id}`);
      const buildingLabel = buildingCode ? `مبنى (${buildingCode})` : `مبنى`;
      if (b.area != null) lines.push(`${buildingLabel} بمساحة ${fmtM(b.area)} م²`);
      const atts=b.attachments||[];
      if (atts.length) {
        const first=atts[0];
        const firstCode = codes.get(`attachment:${b.id}:${first.id}`);
        const firstLabel = firstCode ? `${first.type} (${firstCode})` : first.type;
        lines.push(`ملحق به ${firstLabel}${first.area!=null?` بمساحة ${fmtM(first.area)} م²`:''}`);
        atts.slice(1).forEach(a=>{
          const aCode = codes.get(`attachment:${b.id}:${a.id}`);
          const aLabel = aCode ? `${a.type} (${aCode})` : a.type;
          lines.push(`و${aLabel}${a.area!=null?` بمساحة ${fmtM(a.area)} م²`:''}`);
        });
      }
    });
    const land = state.buildings.find(b=>b.landArea!=null)?.landArea;
    if (land != null) lines.push(`مقام على أرض بمساحة ${fmtM(land)} م²`);
    if (state.requestedArea != null) lines.push(`الجزء المراد تقنينه بمساحة ${fmtM(state.requestedArea)} م²`);
    return lines.join("، ");
  };

  const description = type === "land" ? buildLandDescription() : type === "building" ? buildBuildingDescription() : "";
  const errors=[];
  if (type === "land") {
    if (state.landArea == null) errors.push("أدخل مساحة الأرض.");
    if (state.road && state.roadArea == null) errors.push("أدخل مساحة الطريق.");
    if (state.road && state.landArea != null && state.roadArea != null && state.roadArea > state.landArea) errors.push("مساحة الطريق لا يمكن أن تتجاوز مساحة الأرض.");
    if (state.divided && !state.parts.length) errors.push("أضف جزءًا واحدًا على الأقل.");
    if (state.divided && state.road && state.landArea != null && state.roadArea != null) {
      const sum=state.parts.reduce((a,p)=>a+(Number(p.area)||0),0);
      if (sum && Math.abs(sum-(state.landArea-state.roadArea))>0.5) errors.push("مجموع أجزاء الأرض لا يتوافق مع صافي مساحة الأرض بعد خصم الطريق.");
    }
  }
  if (type === "building") {
    if (!state.buildings.length) errors.push("أضف مبنى واحدًا على الأقل.");
    if (state.buildings.some(b=>b.area==null)) errors.push("أكمل مساحة كل مبنى.");
  }

  const copyDescription = async () => {
    if (!description || errors.length) return;
    try { await navigator.clipboard.writeText(description); setCopied(true); setTimeout(()=>setCopied(false),1500); } catch {}
  };

  // نسخ قيمة المساحة بمجرد الضغط عليها (بدون الوحدة).
  const copyAreaValue = async (value) => {
    if (value == null || value === "" || value === "—") return;
    try {
      await navigator.clipboard.writeText(String(value));
      showToast?.("تم نسخ المساحة", "ok");
    } catch {
      const ta = document.createElement("textarea");
      ta.value = String(value); ta.style.position = "fixed"; ta.style.opacity = "0";
      document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove();
      showToast?.("تم نسخ المساحة", "ok");
    }
  };

  React.useEffect(() => {
    const onAreaClick = (e) => {
      const el = e.target.closest?.("[data-copy-area]");
      if (el) { copyAreaValue(el.dataset.copyArea); return; }
      // حقول عرض المساحات في النافذة عبارة عن divs؛ انسخ الرقم عند الضغط عليها.
      const box = e.target.closest?.("div");
      if (!box || box.closest("button,input,textarea,select")) return;
      const text = (box.textContent || "").trim().replace(/\s+/g, " ");
      if (/^-?\d+(?:\.\d+)?\s*(?:م²|فدان)?$/.test(text)) {
        copyAreaValue(text);
        box.title = "تم نسخ المساحة ✓";
      }
    };
    document.addEventListener("click", onAreaClick);
    return () => document.removeEventListener("click", onAreaClick);
  });

  const initStyle = posRef.current.x !== null ? {left:posRef.current.x+"px",top:posRef.current.y+"px"} : {left:"50%",top:"50%",transform:"translate(-50%,-50%)"};
  const inputCls="w-full h-9 rounded-lg border border-[var(--line)] bg-[var(--panel)] px-2.5 text-[11.5px] text-[var(--ink)] outline-none focus:ring-2 focus:ring-[var(--accent)]/20";
  const smallBtn="rounded-lg border border-[var(--line)] bg-[var(--panel)] hover:bg-[var(--panel-2)] px-2.5 py-2 text-[11px] font-semibold text-[var(--ink)] transition";
  const pickBtn="rounded-lg bg-[var(--accent-soft)] hover:opacity-80 px-2.5 py-2 text-[11px] font-semibold text-[var(--accent-ink)] transition";
  const panelSection="rounded-xl border border-[var(--line)] bg-[var(--panel-2)] p-3 space-y-2.5";

  // السحب من أي مكان في جسم النافذة، مع استثناء عناصر الإدخال والأزرار والقوائم حتى لا
  // يتعارض السحب مع الاستخدام الطبيعي للواجهة.
  const handlePanelMouseDown = React.useCallback((e) => {
    if (e.button !== 0) return;
    const target = e.target;
    if (target?.closest?.("button, input, textarea, select, option, a, label")) return;
    e.preventDefault();
    onDragStart(e.clientX, e.clientY);
  }, [onDragStart]);

  const handlePanelTouchStart = React.useCallback((e) => {
    const target = e.target;
    if (target?.closest?.("button, input, textarea, select, option, a, label")) return;
    e.preventDefault();
    onDragStart(e.touches[0].clientX, e.touches[0].clientY);
  }, [onDragStart]);

  // مهم: كل الـHooks يجب أن تُستدعى في نفس الترتيب في كل Render.
  // لذلك لا نضع return مبكرًا قبل الـuseCallback أعلاه.
  if (!open) return null;

  return (
    <div ref={wrapRef} style={{position:"fixed",zIndex:2100,width:"490px",maxWidth:"calc(100vw - 24px)",userSelect:"none",...initStyle}} onMouseDown={handlePanelMouseDown} onTouchStart={handlePanelTouchStart}>
      <div className="bg-[var(--panel)] border border-[var(--line)] rounded-2xl shadow-xl overflow-hidden">
        <div className="flex items-center gap-2 px-3.5 py-3 border-b border-[var(--line)] bg-[var(--panel-2)]" style={{cursor:"move"}}>
          <span className="grid place-items-center w-8 h-8 rounded-lg bg-[var(--accent-soft)] text-[var(--accent-ink)]">✦</span>
          <div className="flex-1 min-w-0"><div className="text-[13px] font-bold text-[var(--ink)]">الوصف الذكي</div><div className="text-[10px] text-[var(--ink-soft)]">Land & Building Description Generator · V1.0</div></div>
          {pickMode && <span className="text-[10px] font-semibold text-[var(--accent-ink)]">اضغط على الرسم في الخريطة</span>}
          <button onMouseDown={e=>e.stopPropagation()} onClick={onClose} className="w-7 h-7 rounded-lg hover:bg-[var(--line)] text-[var(--ink-soft)]">×</button>
        </div>

        <div className="max-h-[78vh] overflow-y-auto p-3 space-y-3 scroll-thin" dir="rtl">
          {!type ? (
            <div className="space-y-3">
              <div className="text-[12px] font-semibold text-[var(--ink)]">اختار نوع الطلب</div>
              <div className="grid grid-cols-2 gap-2">
                <button onClick={()=>onTypeChange("land")} className="group rounded-xl border border-[var(--line)] bg-[var(--panel-2)] hover:border-[var(--accent)] hover:bg-[var(--accent-soft)] p-4 text-right transition"><div className="text-xl mb-2">▱</div><div className="text-[13px] font-bold text-[var(--ink)]">أرض</div><div className="text-[10px] text-[var(--ink-soft)] mt-1">الوحدة الرسمية: فدان</div></button>
                <button onClick={()=>onTypeChange("building")} className="group rounded-xl border border-[var(--line)] bg-[var(--panel-2)] hover:border-[var(--accent)] hover:bg-[var(--accent-soft)] p-4 text-right transition"><div className="text-xl mb-2">⌂</div><div className="text-[13px] font-bold text-[var(--ink)]">مبنى</div><div className="text-[10px] text-[var(--ink-soft)] mt-1">الوحدة الرسمية: م²</div></button>
              </div>
            </div>
          ) : (
            <>
              <div className="flex items-center gap-2">
                <button onClick={()=>{setPickMode(null);pickRef.current=null;onTypeChange(null)}} className={smallBtn}>← تغيير النوع</button>
                <div className="flex-1 text-[12px] font-bold text-[var(--ink)]">{type === "land" ? "بيانات الأرض" : "بيانات المباني"}</div>
              </div>

              {type === "land" ? <>
                <div className={panelSection}>
                  <div className="flex items-center justify-between"><span className="text-[11px] font-semibold text-[var(--ink)]">مساحة الأرض</span><span className="text-[10px] text-[var(--ink-soft)]">فدان · 4 أرقام عشرية</span></div>
                  <div className="flex gap-2"><div className="flex-1 h-9 rounded-lg border border-[var(--line)] bg-[var(--panel)] flex items-center px-2.5 text-[12px] font-mono text-[var(--ink)]">{state.landArea!=null?fmtF(state.landArea):"—"}</div><button className={pickBtn} onClick={()=>startPick("landArea")}>اختيار من الخريطة</button></div>
                </div>

                <div className={panelSection}>
                  <div className="flex items-center justify-between"><span className="text-[11px] font-semibold text-[var(--ink)]">وصف الأرض</span><span className="text-[10px] text-[var(--ink-soft)]">اختياري</span></div>
                  <input className={inputCls} placeholder="مثال: مسورة / مزروعة / ميتة / فضاء" value={state.landDescription || ""} onChange={e=>setState(p=>({...p,landDescription:e.target.value}))}/>
                  <div className="text-[10px] text-[var(--ink-soft)]">يظهر الوصف قبل كلمة «بمساحة» في الوصف النهائي.</div>
                </div>

                <div className={panelSection}>
                  <div className="flex items-center justify-between"><span className="text-[11px] font-semibold text-[var(--ink)]">هل يوجد طريق؟</span><div className="flex gap-1"><button onClick={()=>setState(p=>({...p,road:true}))} className={`${smallBtn} ${state.road?"bg-[var(--accent)] text-white border-[var(--accent)]":""}`}>نعم</button><button onClick={()=>setState(p=>({...p,road:false,roadArea:null,showRoadArea:true}))} className={`${smallBtn} ${!state.road?"bg-[var(--accent)] text-white border-[var(--accent)]":""}`}>لا</button></div></div>
                  {state.road && <><div className="flex gap-2"><div className="flex-1 h-9 rounded-lg border border-[var(--line)] bg-[var(--panel)] flex items-center px-2.5 text-[12px] font-mono text-[var(--ink)]">{state.roadArea!=null?fmtF(state.roadArea):"—"}</div><button className={pickBtn} onClick={()=>startPick("roadArea")}>مساحة الطريق من الخريطة</button></div><label className="flex items-center gap-2 text-[11px] text-[var(--ink-soft)]"><input type="checkbox" checked={state.showRoadArea} onChange={e=>setState(p=>({...p,showRoadArea:e.target.checked}))}/> إظهار مساحة الطريق داخل الوصف</label></>}
                </div>

                <div className={panelSection}>
                  <div className="flex items-center justify-between"><span className="text-[11px] font-semibold text-[var(--ink)]">هل الأرض مقسمة؟</span><div className="flex gap-1"><button onClick={()=>setState(p=>({...p,divided:true}))} className={`${smallBtn} ${state.divided?"bg-[var(--accent)] text-white border-[var(--accent)]":""}`}>نعم</button><button onClick={()=>setState(p=>({...p,divided:false,parts:[]}))} className={`${smallBtn} ${!state.divided?"bg-[var(--accent)] text-white border-[var(--accent)]":""}`}>لا</button></div></div>
                  {state.divided ? <div className="space-y-2"><div className="flex items-center justify-between"><span className="text-[10px] text-[var(--ink-soft)]">الأجزاء والإشغالات · الترميز تلقائي ومتسلسل</span><div className="flex gap-1"><button className={smallBtn} onClick={addPart}>＋ إضافة أرض</button><button className={smallBtn} onClick={addOccupation}>＋ إضافة إشغال</button></div></div>{state.parts.map((p,i)=><div key={p.id} className="rounded-lg border border-[var(--line)] p-2.5 space-y-2"><div className="flex items-center gap-2"><span className="font-mono text-[11px] font-bold text-[var(--accent-ink)]">أرض ({getDividedCodes().get(`part:${p.id}`) || "A"})</span><button className="mr-auto text-[10px] text-rose-500" onClick={()=>removePart(p.id)}>حذف</button></div><div className="flex gap-2"><div className="flex-1 h-8 rounded-lg border border-[var(--line)] flex items-center px-2 text-[11px] font-mono">{p.area!=null?fmtF(p.area):"—"}</div><button className={pickBtn} onClick={()=>startPick("part",p.id)}>مساحة من الخريطة</button></div><input className={inputCls} placeholder="وصف الجزء: مزروعة / بور / فضاء…" value={p.description} onChange={e=>setState(q=>({...q,parts:q.parts.map(x=>x.id===p.id?{...x,description:e.target.value}:x)}))}/></div>)}{state.occupations.map((o,i)=><div key={o.id} className="rounded-lg border border-[var(--line)] p-2.5 space-y-2"><div className="flex items-center gap-2"><span className="font-mono text-[11px] font-bold text-[var(--accent-ink)]">إشغال ({getDividedCodes().get(`globalOcc:${o.id}`) || "A"})</span><button className="mr-auto text-[10px] text-rose-500" onClick={()=>removeOccupation(o.id)}>حذف</button></div><div className="flex gap-2"><div className="flex-1 h-8 rounded-lg border border-[var(--line)] flex items-center px-2 text-[11px] font-mono">{o.area!=null?fmtM(o.area)+" م²":"—"}</div><button className={pickBtn} onClick={()=>startPick("occupation",o.id)}>مساحة من الخريطة</button></div><input className={inputCls} placeholder="وصف الإشغال: مبني / مخزن / حوش…" value={o.description} onChange={e=>setState(q=>({...q,occupations:q.occupations.map(x=>x.id===o.id?{...x,description:e.target.value}:x)}))}/></div>)}</div> : <div className="space-y-2"><div className="flex items-center justify-between"><span className="text-[10px] text-[var(--ink-soft)]">الإشغالات · الأرض غير مقسمة لا تأخذ رمزًا</span><button className={smallBtn} onClick={addOccupation}>＋ إضافة إشغال</button></div>{state.occupations.map((o,i)=><div key={o.id} className="flex gap-1.5 items-center"><div className="w-14 h-8 rounded-lg border border-[var(--line)] flex items-center justify-center text-[10px] font-mono">({code(i)})</div><input className={inputCls+" flex-1"} placeholder="وصف الإشغال" value={o.description} onChange={e=>setState(q=>({...q,occupations:q.occupations.map(x=>x.id===o.id?{...x,description:e.target.value}:x)}))}/><button className={pickBtn} onClick={()=>startPick("occupation",o.id)}>مساحة</button><button className="text-rose-500 px-1" onClick={()=>removeOccupation(o.id)}>×</button></div>)}</div>}
                </div>

                <div className={panelSection}><div className="text-[11px] font-semibold text-[var(--ink)]">الجزء المراد تقنينه</div><div className="flex gap-2"><div className="flex-1 h-9 rounded-lg border border-[var(--line)] bg-[var(--panel)] flex items-center px-2.5 text-[12px] font-mono">{state.requestedArea!=null?fmtF(state.requestedArea):"—"}</div><button className={pickBtn} onClick={()=>startPick("requestedLand")}>اختيار من الخريطة</button></div></div>
              </> : <>
                <div className={panelSection}><div className="flex items-center justify-between"><span className="text-[11px] font-semibold text-[var(--ink)]">المباني</span><button className={smallBtn} onClick={addBuilding}>＋ إضافة مبنى</button></div>{state.buildings.map((b,i)=><div key={b.id} className="rounded-lg border border-[var(--line)] p-2.5 space-y-2"><div className="flex items-center"><span className="font-mono text-[11px] font-bold text-[var(--accent-ink)]">{getBuildingElementCodes().get(`building:${b.id}`) ? `مبنى (${getBuildingElementCodes().get(`building:${b.id}`)})` : "مبنى"}</span><button className="mr-auto text-[10px] text-rose-500" onClick={()=>removeBuilding(b.id)}>حذف</button></div><div className="flex gap-2"><div className="flex-1 h-8 rounded-lg border border-[var(--line)] flex items-center px-2 text-[11px] font-mono">{b.area!=null?fmtM(b.area):"—"}</div><button className={pickBtn} onClick={()=>startPick(`building:${b.id}`)}>مساحة المبنى من الخريطة</button></div><div className="flex items-center justify-between"><span className="text-[10px] text-[var(--ink-soft)]">الملحقات</span><button className={smallBtn} onClick={()=>addAttachment(b.id)}>＋ إضافة ملحق</button></div>{(b.attachments||[]).map((a,j)=><div key={a.id} className="flex gap-1.5 items-center"><select className={inputCls+" flex-1"} value={a.type} onChange={e=>setState(q=>({...q,buildings:q.buildings.map(x=>x.id===b.id?{...x,attachments:x.attachments.map(y=>y.id===a.id?{...y,type:e.target.value}:y)}:x)}))}><option>فناء</option><option>حوش</option><option>مخزن</option><option>حظيرة</option></select><button className={pickBtn} onClick={()=>startPick(`attachment:${b.id}:${a.id}`)}>{a.area!=null?fmtM(a.area)+" م²":"مساحة"}</button><button className="text-rose-500 px-1" onClick={()=>removeAttachment(b.id,a.id)}>×</button></div>)}</div>)}</div>
                <div className={panelSection}><div className="text-[11px] font-semibold text-[var(--ink)]">مساحة الأرض المقام عليها</div>{state.buildings.length ? <div className="flex gap-2"><div className="flex-1 h-9 rounded-lg border border-[var(--line)] flex items-center px-2.5 text-[11px] font-mono">{state.buildings[0].landArea!=null?fmtM(state.buildings[0].landArea)+" م²":"—"}</div><button className={pickBtn} onClick={()=>startPick(`buildingLand:${state.buildings[0].id}`)}>اختيار من الخريطة</button></div>:<div className="text-[10px] text-[var(--ink-soft)]">أضف مبنى أولاً.</div>}</div>
                <div className={panelSection}><div className="text-[11px] font-semibold text-[var(--ink)]">الجزء المراد تقنينه</div><div className="flex gap-2"><div className="flex-1 h-9 rounded-lg border border-[var(--line)] flex items-center px-2.5 text-[11px] font-mono">{state.requestedArea!=null?fmtM(state.requestedArea)+" م²":"—"}</div><button className={pickBtn} onClick={()=>startPick("requestedBuilding")}>اختيار من الخريطة</button></div></div>
              </>}

              {pickMode && <div className="rounded-xl border border-[var(--accent)]/30 bg-[var(--accent-soft)] px-3 py-2 text-[10.5px] text-[var(--accent-ink)]">وضع الاختيار مفعل — اضغط على المساحة المطلوبة داخل الخريطة.</div>}

              <div className="rounded-xl border border-[var(--line)] bg-[var(--panel-2)] overflow-hidden">
                <div className="px-3 py-2.5 border-b border-[var(--line)] flex items-center gap-2"><span className="text-[12px] font-bold text-[var(--ink)]">الوصف النهائي</span><button onClick={copyDescription} disabled={!description || errors.length>0} className="mr-auto rounded-lg bg-[var(--accent)] disabled:opacity-40 text-white px-3 py-1.5 text-[10.5px] font-semibold">{copied?"تم النسخ ✓":"نسخ الوصف"}</button></div>
                <div className="p-3 text-[12px] leading-7 text-[var(--ink)] min-h-[80px] select-text">{description || <span className="text-[var(--ink-soft)]">أكمل البيانات الأساسية ليظهر الوصف تلقائياً.</span>}</div>
              </div>
              {errors.length>0 && <div className="rounded-xl border border-rose-500/20 bg-rose-500/5 p-3 space-y-1"><div className="text-[11px] font-bold text-rose-500">مراجعة البيانات</div>{errors.map((e,i)=><div key={i} className="text-[10.5px] text-rose-500">• {e}</div>)}</div>}
              <button onClick={reset} className="w-full rounded-xl border border-[var(--line)] hover:bg-[var(--panel-2)] py-2 text-[11px] font-semibold text-[var(--ink-soft)]">مسح وبدء وصف جديد</button>
            </>
          )}
        </div>
      </div>
    </div>
  );
}

/* ══════════════════════════════════════════════════════════════════════════
   آلة الحاسبة — CalculatorModal
   ══════════════════════════════════════════════════════════════════════════ */
function CalculatorModal({ open, onClose, onUnitChange, unit, pendingValue, onPendingConsumed }) {
  // ── Dragging: نستخدم ref للـ position وننقل الـ DOM مباشرة بدون re-render ──
  const wrapRef   = React.useRef(null);
  const posRef    = React.useRef({ x: null, y: null });
  const dragState = React.useRef(null); // { startMouseX, startMouseY, startElX, startElY }

  // ── Calculator state ──
  const [display, setDisplay] = React.useState("0");
  const [expr,    setExpr]    = React.useState("");
  const [waitOp,  setWaitOp]  = React.useState(false);
  const [justEq,  setJustEq]  = React.useState(false);

  // ── ضع الـ panel في المنتصف أول ما تفتح ──
  React.useEffect(() => {
    if (!open) return;
    if (posRef.current.x !== null) return; // لو عنده position محفوظ خلّيه
    const x = Math.max(20, window.innerWidth  / 2 - 155);
    const y = Math.max(20, window.innerHeight / 2 - 250);
    posRef.current = { x, y };
    if (wrapRef.current) {
      wrapRef.current.style.left = x + "px";
      wrapRef.current.style.top  = y + "px";
    }
  }, [open]);

  // ── Drag handlers (mouse + touch) — بيشتغلوا على DOM مباشرة بدون setState ──
  const onDragStart = React.useCallback((clientX, clientY) => {
    if (!wrapRef.current) return;
    const rect = wrapRef.current.getBoundingClientRect();
    dragState.current = {
      startMouseX: clientX, startMouseY: clientY,
      startElX: rect.left,  startElY:  rect.top,
    };

    const onMove = (e) => {
      const cx = e.touches ? e.touches[0].clientX : e.clientX;
      const cy = e.touches ? e.touches[0].clientY : e.clientY;
      const dx = cx - dragState.current.startMouseX;
      const dy = cy - dragState.current.startMouseY;
      const nx = dragState.current.startElX + dx;
      const ny = dragState.current.startElY + dy;
      posRef.current = { x: nx, y: ny };
      if (wrapRef.current) {
        wrapRef.current.style.left = nx + "px";
        wrapRef.current.style.top  = ny + "px";
        wrapRef.current.style.transform = "none";
      }
    };

    const onUp = () => {
      dragState.current = null;
      window.removeEventListener("mousemove", onMove);
      window.removeEventListener("mouseup",   onUp);
      window.removeEventListener("touchmove", onMove);
      window.removeEventListener("touchend",  onUp);
      if (wrapRef.current) wrapRef.current.style.cursor = "";
    };

    window.addEventListener("mousemove", onMove);
    window.addEventListener("mouseup",   onUp);
    window.addEventListener("touchmove", onMove, { passive: false });
    window.addEventListener("touchend",  onUp);
    if (wrapRef.current) wrapRef.current.style.cursor = "grabbing";
  }, []);

  // ── تنسيق نتيجة الآلة الحاسبة ──
  // المتر المربع: خانتان عشريتان فقط.
  // الفدان: أربع خانات عشرية فقط.
  // يتم القطع بدون تقريب (Truncate).
  const formatCalcValue = (value, decimals) => {
    const n = Number(value);
    if (!Number.isFinite(n)) return "0";

    const negative = n < 0;
    const abs = Math.abs(n);
    let str = String(abs);

    // تحويل الصيغة العلمية إلى رقم عشري قبل القطع.
    if (/e/i.test(str)) {
      const [mantissa, exponentText] = str.toLowerCase().split("e");
      const exponent = Number(exponentText);
      let [intPart, fracPart = ""] = mantissa.split(".");
      const digits = intPart + fracPart;
      const decimalPos = intPart.length + exponent;

      if (decimalPos <= 0) {
        str = "0." + "0".repeat(-decimalPos) + digits;
      } else if (decimalPos >= digits.length) {
        str = digits + "0".repeat(decimalPos - digits.length);
      } else {
        str = digits.slice(0, decimalPos) + "." + digits.slice(decimalPos);
      }
    }

    let [integerPart, fractionPart = ""] = str.split(".");
    fractionPart = (fractionPart + "0".repeat(decimals)).slice(0, decimals);

    return (negative ? "-" : "") + integerPart + "." + fractionPart;
  };

  const getDisplayDecimals = () => unit === "feddan" ? 4 : 2;

  // ── قيمة من الخريطة ──
  React.useEffect(() => {
    if (pendingValue == null) return;

    const converted = unit === "feddan"
      ? Number(pendingValue) / 4200.83
      : Number(pendingValue);

    const val = formatCalcValue(converted, getDisplayDecimals());

    // دايماً نكتب الرقم الجديد بعد آخر عملية أو نستبدل الحالي
    setDisplay(val);
    setExpr(prev => {
      const trimmed = prev.trimEnd();
      if (/[+\-×÷−]$/.test(trimmed)) return trimmed + " " + val;
      const m = trimmed.match(/^(.*[+\-×÷−]\s*)[\d.]+$/s);
      if (m) return m[1] + val;
      return val;
    });
    setWaitOp(false);
    setJustEq(false);
    onPendingConsumed?.();
  }, [pendingValue]);

  // ── Keyboard ──
  React.useEffect(() => {
    if (!open) return;
    const onKey = (e) => {
      const tag = document.activeElement?.tagName;
      if (tag === "INPUT" || tag === "TEXTAREA") return;
      const k = e.key;
      if (k >= "0" && k <= "9")              { e.preventDefault(); handleNum(k); }
      else if (k === ".")                    { e.preventDefault(); handleDot(); }
      else if (k === "+" || k === "-")       { e.preventDefault(); handleOp(k === "+" ? "+" : "−"); }
      else if (k === "*")                    { e.preventDefault(); handleOp("×"); }
      else if (k === "/")                    { e.preventDefault(); handleOp("÷"); }
      else if (k === "Enter" || k === "=")   { e.preventDefault(); handleEquals(); }
      else if (k === "Backspace")            { e.preventDefault(); handleBack(); }
      else if (k === "Escape" || k === "c" || k === "C") { e.preventDefault(); handleClear(); }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, [open, display, expr, waitOp, justEq]);

  const M2_PER_FEDDAN = 4200.83;

  const safeEval = (expression) => {
    try {
      const clean = expression.replace(/×/g,"*").replace(/÷/g,"/").replace(/−/g,"-");
      // eslint-disable-next-line no-new-func
      const r = Function('"use strict";return(' + clean + ')')();
      return isFinite(r) ? r : null;
    } catch { return null; }
  };

  const handleNum = (n) => {
    if (justEq) {
      setDisplay(n); setExpr(n); setJustEq(false); setWaitOp(false); return;
    }
    if (waitOp) {
      setDisplay(n);
      setExpr(prev => prev + " " + n);
      setWaitOp(false); return;
    }
    const nd = display === "0" ? n : display + n;
    setDisplay(nd);
    setExpr(prev => {
      const m = prev.trimEnd().match(/^(.*[+\-×÷−]\s*)[\d.]+$/s);
      return m ? m[1] + nd : nd;
    });
  };

  const handleDot = () => {
    if (display.includes(".")) return;
    if (waitOp || justEq) {
      setDisplay("0."); setExpr(prev => justEq ? "0." : prev + " 0.");
      setWaitOp(false); setJustEq(false); return;
    }
    const nd = display + ".";
    setDisplay(nd);
    setExpr(prev => {
      const m = prev.trimEnd().match(/^(.*[+\-×÷−]\s*)[\d.]+$/s);
      return m ? m[1] + nd : nd;
    });
  };

  const handleOp = (op) => {
    setJustEq(false); setWaitOp(true);
    setExpr(prev => (prev.trim() || display) + " " + op);
  };

  const handleEquals = () => {
    const r = safeEval(expr.trim() || display);
    if (r === null) { setDisplay("خطأ"); setExpr(""); setWaitOp(false); setJustEq(false); return; }

    // عرض النتيجة حسب الوحدة: م² = خانتان، فدان = أربع خانات، بدون تقريب.
    const rs = formatCalcValue(r, getDisplayDecimals());
    setDisplay(rs); setExpr(rs); setWaitOp(false); setJustEq(true);
  };

  const handleClear = () => { setDisplay("0"); setExpr(""); setWaitOp(false); setJustEq(false); };

  const handleBack = () => {
    if (justEq || waitOp) { handleClear(); return; }
    if (display.length <= 1 || display === "خطأ") {
      setDisplay("0");
      setExpr(prev => { const m = prev.trimEnd().match(/^(.*[+\-×÷−]\s*)[\d.]+$/s); return m ? m[1].trimEnd() : ""; });
      return;
    }
    const nd = display.slice(0,-1) || "0";
    setDisplay(nd);
    setExpr(prev => { const m = prev.trimEnd().match(/^(.*[+\-×÷−]\s*)[\d.]+$/s); return m ? m[1] + nd : nd; });
  };

  const counterDisplay = () => "—";

  if (!open) return null;

  // ── أول render: لو posRef فاضي نستخدم transform ──
  const initStyle = posRef.current.x !== null
    ? { left: posRef.current.x + "px", top: posRef.current.y + "px" }
    : { left: "50%", top: "50%", transform: "translate(-50%,-50%)" };

  const btnBase = "flex items-center justify-center rounded-xl text-[18px] font-semibold h-12 select-none transition-all duration-100 active:scale-95 cursor-pointer";
  const numBtn  = "bg-[var(--panel)] hover:bg-[var(--panel-2)] border border-[var(--line)] text-[var(--ink)]";
  const opBtn   = "bg-[var(--accent-soft)] hover:opacity-80 border border-[var(--line)] text-[var(--accent-ink)]";
  const eqBtn   = "bg-[var(--accent)] hover:opacity-90 text-white border border-[var(--accent)]";
  const clrBtn  = "bg-rose-500/10 hover:bg-rose-500/20 border border-rose-500/30 text-rose-500";
  const backBtn = "bg-[var(--panel-2)] hover:bg-[var(--line)] border border-[var(--line)] text-[var(--ink-soft)]";

  return (
    <div ref={wrapRef} style={{ position:"fixed", zIndex:2000, minWidth:"310px", userSelect:"none", ...initStyle }}>
      <div className="bg-[var(--panel)] border border-[var(--line)] rounded-2xl shadow-2xl overflow-hidden">

        {/* ── Header (draggable) ── */}
        <div
          className="flex items-center gap-2 px-3 py-2.5 border-b border-[var(--line)] select-none bg-[var(--panel-2)]"
          style={{ cursor: "grab" }}
          onMouseDown={(e) => { if (e.button !== 0) return; e.preventDefault(); onDragStart(e.clientX, e.clientY); }}
          onTouchStart={(e) => { e.preventDefault(); onDragStart(e.touches[0].clientX, e.touches[0].clientY); }}
        >
          {/* أيقونة السحب */}
          <span className="grid place-items-center w-7 h-7 rounded-lg bg-[var(--accent-soft)] text-[var(--accent-ink)] shrink-0">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round">
              <circle cx="9" cy="5" r="1" fill="currentColor"/><circle cx="15" cy="5" r="1" fill="currentColor"/>
              <circle cx="9" cy="12" r="1" fill="currentColor"/><circle cx="15" cy="12" r="1" fill="currentColor"/>
              <circle cx="9" cy="19" r="1" fill="currentColor"/><circle cx="15" cy="19" r="1" fill="currentColor"/>
            </svg>
          </span>
          <span className="flex-1 text-[13px] font-bold text-[var(--ink)]">آلة الحاسبة</span>

          {/* وحدة القياس */}
          <div className="flex items-center gap-0.5 bg-[var(--panel)] border border-[var(--line)] rounded-lg p-0.5" onMouseDown={e => e.stopPropagation()}>
            <button onClick={() => onUnitChange("meter")}
              className={`px-2.5 py-1 rounded-md text-[11px] font-semibold transition ${unit === "meter" ? "bg-[var(--accent)] text-white" : "text-[var(--ink-soft)] hover:text-[var(--ink)]"}`}>م²</button>
            <button onClick={() => onUnitChange("feddan")}
              className={`px-2.5 py-1 rounded-md text-[11px] font-semibold transition ${unit === "feddan" ? "bg-[var(--accent)] text-white" : "text-[var(--ink-soft)] hover:text-[var(--ink)]"}`}>فدان</button>
          </div>

          {/* زر الإغلاق */}
          <button onMouseDown={e => e.stopPropagation()} onClick={onClose}
            className="w-7 h-7 grid place-items-center rounded-lg hover:bg-[var(--line)] text-[var(--ink-soft)] transition">
            <svg width="12" height="12" viewBox="0 0 12 12" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round">
              <line x1="1" y1="1" x2="11" y2="11"/><line x1="11" y1="1" x2="1" y2="11"/>
            </svg>
          </button>
        </div>

        {/* ── Display ── */}
        <div className="px-3 pt-3 pb-2 space-y-0.5">
          <div className="text-right font-mono text-[11px] text-[var(--ink-soft)] h-4 overflow-hidden truncate leading-4" dir="ltr">
            {expr || "\u00a0"}
          </div>
          <div
            className="text-right font-mono font-bold text-[var(--ink)] leading-tight overflow-hidden cursor-pointer select-all relative group"
            dir="ltr"
            style={{ fontSize: display.length > 12 ? "17px" : display.length > 8 ? "22px" : "28px" }}
            onClick={() => {
              try {
                navigator.clipboard.writeText(display);
              } catch {}
            }}
            onContextMenu={(e) => {
              e.preventDefault();
              try {
                navigator.clipboard.readText().then(txt => {
                  const v = parseFloat(txt.replace(/,/g, ".").trim());
                  if (isFinite(v)) {
                    setDisplay(String(v));
                    setExpr(String(v));
                    setWaitOp(false);
                    setJustEq(true);
                  }
                }).catch(() => {});
              } catch {}
            }}
            title="اضغط للنسخ · كليك يمين للصق"
          >
            {display}
            <span className="absolute left-0 top-1/2 -translate-y-1/2 opacity-0 group-hover:opacity-100 transition text-[9px] text-[var(--ink-soft)] font-normal pr-1">نسخ</span>
          </div>
          <div className="text-right text-[10.5px] text-[var(--ink-soft)] pt-0.5">
            <span className="opacity-50">≈ </span>
            <span className="font-mono">{counterDisplay()}</span>
          </div>
          {/* شريط التلميح */}
          <div className={`flex items-center gap-1.5 rounded-lg px-2 py-1 mt-1 ${unit === "feddan" ? "bg-amber-500/10 border border-amber-500/20" : "bg-blue-500/10 border border-blue-500/20"}`}>
            <svg width="9" height="9" viewBox="0 0 16 16" fill={unit === "feddan" ? "#f59e0b" : "#3b82f6"} className="shrink-0">
              <path d="M8 1a7 7 0 1 0 0 14A7 7 0 0 0 8 1zm0 3a1 1 0 1 1 0 2 1 1 0 0 1 0-2zm1 8H7V7h2v5z"/>
            </svg>
            <span className={`text-[9.5px] font-medium ${unit === "feddan" ? "text-amber-600" : "text-blue-600"}`}>
              اضغط على أي مضلع في الخريطة لسحب مساحته {unit === "feddan" ? "بالفدان" : "بالمتر المربع"} هنا تلقائياً
            </span>
          </div>
        </div>

        {/* ── Buttons ── */}
        <div className="px-3 pb-3 grid grid-cols-4 gap-2">
          <button onClick={handleClear}          className={`${btnBase} ${clrBtn} col-span-2 text-[14px]`}>مسح</button>
          <button onClick={handleBack}           className={`${btnBase} ${backBtn}`}>⌫</button>
          <button onClick={() => handleOp("÷")}  className={`${btnBase} ${opBtn}`}>÷</button>

          <button onClick={() => handleNum("7")} className={`${btnBase} ${numBtn}`}>7</button>
          <button onClick={() => handleNum("8")} className={`${btnBase} ${numBtn}`}>8</button>
          <button onClick={() => handleNum("9")} className={`${btnBase} ${numBtn}`}>9</button>
          <button onClick={() => handleOp("×")}  className={`${btnBase} ${opBtn}`}>×</button>

          <button onClick={() => handleNum("4")} className={`${btnBase} ${numBtn}`}>4</button>
          <button onClick={() => handleNum("5")} className={`${btnBase} ${numBtn}`}>5</button>
          <button onClick={() => handleNum("6")} className={`${btnBase} ${numBtn}`}>6</button>
          <button onClick={() => handleOp("−")}  className={`${btnBase} ${opBtn}`}>−</button>

          <button onClick={() => handleNum("1")} className={`${btnBase} ${numBtn}`}>1</button>
          <button onClick={() => handleNum("2")} className={`${btnBase} ${numBtn}`}>2</button>
          <button onClick={() => handleNum("3")} className={`${btnBase} ${numBtn}`}>3</button>
          <button onClick={() => handleOp("+")}  className={`${btnBase} ${opBtn}`}>+</button>

          <button onClick={() => handleNum("0")} className={`${btnBase} ${numBtn} col-span-2`}>0</button>
          <button onClick={handleDot}            className={`${btnBase} ${numBtn}`}>.</button>
          <button onClick={handleEquals}         className={`${btnBase} ${eqBtn}`}>=</button>
        </div>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);

<script id="earth-time-js">
/* ══════════════════════════════════════════════════════════════════════════
   🕘 تغيير الزمن — Google Earth (الصور التاريخية) تحت الشيب فايل
   ──────────────────────────────────────────────────────────────────────────
   بيحط Google Earth (iframe) ورا خريطة Leaflet بدل المرئية (Esri/Google/Bing)،
   وخريطة Leaflet بتفضل فوقه شفافة بكل أدواتها (الشيب فايل، التحريك، القياس...).
   «شاشتين»: فيه نسختين من Google Earth. الظاهرة كاميرتها عمرها ما بتتغير وهي ظاهرة
   (بتتحرك مع الخريطة بـ CSS transform بس، فالتطابق مع الشيب فايل ثابت)، والمستخبية
   ورا هي اللي بتروح للمكان/الزووم الجديد — ولما توصل وتحمّل صورها بيتبدّلوا في لحظة.
   شريط تحت فيه التواريخ (سلايدر) + أقدم/أحدث + تشغيل + تثبيت الزمن.
   الجزء اللي جوه Google Earth نفسه في earth_frame.js (بيحقنه server.py).
   ══════════════════════════════════════════════════════════════════════════ */
(function () {
  if (window.EarthTime) return;

  const EARTH_ORIGIN = "https://earth.google.com";
  const K = 2 * Math.tan((35 / 2) * Math.PI / 180);      // Google Earth: زاوية رؤية رأسية 35°
  const EARTH_CIRC = 40075016.686;
  const ATTR = "Imagery © Google Earth";
  const store = {
    get: (k, d) => { try { return localStorage.getItem(k) ?? d; } catch (e) { return d; } },
    set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} },
  };

  function histData(date) {
    const enc = new TextEncoder().encode(date || "");
    const hist = [0x08, 0x01, 0x12, enc.length, ...enc, 0x18, 0x01];
    const f1 = [0x2a, hist.length, ...hist, 0x42, 0x02, 0x08, 0x01];
    const tail = [0x42, 0x02, 0x08, 0x00, 0x4a, 0x0d, 0x08, 255, 255, 255, 255, 255, 255, 255, 255, 255, 0x01, 0x10, 0x00];
    const all = [0x0a, f1.length, ...f1, ...tail];
    return btoa(String.fromCharCode(...all)).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, "");
  }

  const ET = {
    active: false,
    ready: false,       // Google Earth جاهز (الصور التاريخية ظاهرة)
    revealed: false,    // الـ iframe ظاهر والمرئية العادية اتشالت
    date: null,         // التاريخ المعروض (YYYY-MM-DD)
    dates: [],          // تواريخ المكان الحالي (من الأقدم للأحدث)
    pinned: store.get("etv_pin", null),
  };

  let map = null, getBase = null, toastFn = null, bar = null, els = {};
  let T = 130;                  // ارتفاع واجهة Google Earth اللي فوق (بتتقص)
  let reqId = 0, pushTimer = null;
  // نسختين من Google Earth: frames[front] ظاهرة، والتانية شغالة ورا
  const newFrame = (i) => ({ i, el: null, ready: false, readyAt: 0, loaded: false, states: 0, state: null, cam: null, pending: null });
  const frames = [newFrame(0), newFrame(1)];
  let front = 0, swapWaiting = null;
  const FR = () => frames[front], BK = () => frames[1 - front];
  // للتوافق مع باقي الكود: iframe = الظاهرة، cam = كاميرتها
  let iframe = null, cam = null, pending = null;
  const syncAliases = () => { iframe = FR().el; cam = FR().cam; pending = FR().pending || BK().pending; };
  let elev = null, elevAt = null, measuring = false, needPush = false;
  let scanning = false, scanAt = null, playTimer = null, lastState = null;
  const diag = { get loaded() { return FR().loaded; }, get states() { return FR().states; }, since: 0, timer: null, lastLog: "" };
  let elevTimer = null, elevToken = 0, anim = null, firstElevTried = false;

  const toast = (m, tone) => { try { toastFn ? toastFn(m, tone || "info", 2600) : console.log(m); } catch (e) {} };
  const emit = () => window.dispatchEvent(new CustomEvent("earthtime:change", { detail: { active: ET.active } }));
  const sendTo = (fr, m) => { try { fr.el && fr.el.contentWindow && fr.el.contentWindow.postMessage(m, EARTH_ORIGIN); } catch (e) {} };
  const send = (m) => sendTo(FR(), m);                 // للظاهرة
  const sendAll = (m) => frames.forEach((fr) => sendTo(fr, m));
  const mpp = (lat, z) => EARTH_CIRC * Math.cos(lat * Math.PI / 180) / (256 * Math.pow(2, z));

  // ───────────────── iframe ─────────────────
  // Google Earth بيترسم أكبر من الخريطة بـ OVERSCAN من كل ناحية، عشان وقت الزووم أوت
  // (قبل ما الكاميرا الحقيقية تتظبط) الصورة تفضل مغطية الشاشة، وأزرار Earth اللي تحت تفضل برّه.
  const OVERSCAN = 0.2;
  let B = 110;                  // ارتفاع أزرار Google Earth اللي تحت (بتتقص)
  function geom(W, H) {
    const mx = Math.round(W * OVERSCAN), my = Math.max(Math.round(H * OVERSCAN), B);
    const ifW = W + 2 * mx, ifH = H + T + 2 * my;
    return { W, H, mx, my, ifW, ifH, left: -mx, top: -(T + my), cx: W / 2, cy: (H - T) / 2, ox: ifW / 2, oy: ifH / 2 };
  }

  function earthUrl() {
    const size = map.getSize();
    const g = geom(size.x, size.y);
    const c = map.containerPointToLatLng([g.cx, g.cy]);
    const d = mpp(c.lat, map.getZoom()) * g.ifH / K;
    return `${EARTH_ORIGIN}/web/@${c.lat.toFixed(7)},${c.lng.toFixed(7)},0a,${d.toFixed(1)}d,35y,0h,0t,0r/data=${histData(ET.pinned || "")}`;
  }

  function ensureIframe() {
    const container = map.getContainer();
    frames.forEach((fr) => {
      if (fr.el && fr.el.parentNode === container) { fr.el.style.display = ""; return; }
      const el = document.createElement("iframe");
      el.className = "etv-earth";
      el.setAttribute("allow", "cross-origin-isolated; fullscreen");
      el.setAttribute("tabindex", "-1");
      el.setAttribute("aria-hidden", "true");
      el.addEventListener("load", () => { fr.loaded = true; });
      el.src = earthUrl();
      fr.el = el;
      container.insertBefore(el, container.firstChild);
    });
    layoutIframe();
    stackFrames();
    syncAliases();
  }

  // الظاهرة فوق، والتانية ورا شبه شفافة (لازم تفضل «ظاهرة» عشان المتصفح يكمّل يرسمها)
  function stackFrames() {
    frames.forEach((fr) => {
      if (!fr.el) return;
      const isFront = fr.i === front;
      fr.el.style.zIndex = isFront ? "1" : "0";
      fr.el.style.opacity = isFront ? "1" : "0.02";
    });
  }

  function layoutIframe() {
    if (!map) return;
    const size = map.getSize();
    const g = geom(size.x, size.y);
    frames.forEach((fr) => {
      if (!fr.el) return;
      fr.el.style.left = g.left + "px";
      fr.el.style.top = g.top + "px";
      fr.el.style.width = g.ifW + "px";
      fr.el.style.height = g.ifH + "px";
      // واجهة Google Earth (فوق وتحت) تفضل مقصوصة حتى وهو بيتحرك مع السحب والزووم
      fr.el.style.clipPath = `inset(${T}px 0 ${B}px 0)`;
    });
  }

  // ───────────────── camera sync ─────────────────
  function applyTransform(center, zoom, animate) {
    syncAliases();
    if (!cam || !iframe) return;
    const size = map.getSize();
    const p = map.project(cam.latlng, zoom).subtract(map.project(center, zoom)).add(size.divideBy(2));
    const s = Math.pow(2, zoom - cam.zoom);
    const g = cam.g;
    const dx = p.x - g.cx, dy = p.y - g.cy;
    iframe.style.transition = animate ? "transform 0.25s cubic-bezier(0,0,0.25,1)" : "none";
    iframe.style.transformOrigin = `${g.ox}px ${g.oy}px`;
    iframe.style.transform = `translate(${dx.toFixed(2)}px, ${dy.toFixed(2)}px) scale(${s.toFixed(6)})`;
  }

  function schedulePush(ms) {
    clearTimeout(pushTimer);
    pushTimer = setTimeout(pushCam, ms == null ? 280 : ms);
  }

  // target = {center, zoom}: الكاميرا اللي الخريطة رايحة لها (وقت الزووم بنبعتها من أوله)
  function pushCam(target) {
    syncAliases();
    if (!ET.active || !ET.ready || !iframe) return;
    clearTimeout(pushTimer);
    const size = map.getSize();
    const g = geom(size.x, size.y);
    if (!cam || cam.g.ifW !== g.ifW || cam.g.ifH !== g.ifH) layoutIframe();
    // أول ظهور، أو النسخة التانية لسه مجهزتش → نحرّك الظاهرة نفسها (الطريقة القديمة)
    const bk = BK();
    const useBack = ET.revealed && bk.ready && !bk.el.style.display;
    const fr = useBack ? bk : FR();
    const zoom = target ? target.zoom : map.getZoom();
    const center = target ? target.center : map.getCenter();
    const latlng = map.unproject(map.project(center, zoom).add([g.cx - size.x / 2, g.cy - size.y / 2]), zoom);
    const d = mpp(latlng.lat, zoom) * g.ifH / K;
    const a = elev == null ? 0 : elev;
    const id = ++reqId;
    fr.pending = { id, latlng, zoom, g, a, center };
    if (useBack) swapWaiting = null;                   // فيه كاميرا أحدث — استنى دي
    sendTo(fr, { etvCmd: "cam", id, cam: { lat: latlng.lat, lng: latlng.lng, a, d },
                 date: ET.pinned || ET.date || null, waitTiles: useBack });
    syncAliases();
    updateHint();
  }

  // النسخة اللي ورا وصلت — بدّل
  function swapTo(fr) {
    if (!ET.active) return;
    if (scanning) { swapWaiting = fr; return; }        // بعد ما قراءة التواريخ تخلص
    swapWaiting = null;
    front = fr.i;
    stackFrames();
    syncAliases();
    if (anim) applyTransform(anim.center, anim.zoom, false);
    else applyTransform(map.getCenter(), map.getZoom(), false);
    afterArrive();
  }

  function onCamAck(fr, id) {
    if (!fr.pending || fr.pending.id !== id) return;
    fr.cam = fr.pending; fr.pending = null;
    if (fr.i !== front) { swapTo(fr); return; }
    syncAliases();
    if (anim) applyTransform(anim.center, anim.zoom, false);
    else applyTransform(map.getCenter(), map.getZoom(), false);
    afterArrive();
  }

  function afterArrive() {
    syncAliases();
    if (!cam) return;
    const needElev = !elevAt || elevAt.distanceTo(cam.latlng) > 250;
    clearTimeout(elevTimer);
    if (!ET.revealed) {
      // أول مرة: نقيس ارتفاع الأرض الأول عشان Google Earth يظهر بالمقاس الصح من البداية
      if (needElev && !firstElevTried) {
        firstElevTried = true;
        const at = cam.latlng;
        elevTimer = setTimeout(() => ET.active && measureElev(at, 0), 200);
        setStatus("جاري ظبط المقاس…");
        return;
      }
      reveal();
    }
    // ارتفاع الأرض: لو المكان اتغير، نقيسه من Google Earth (بس لما الخريطة تبطّل حركة)
    if (needElev) {
      const at = cam.latlng;
      elevTimer = setTimeout(() => ET.active && measureElev(at, 0), 1200);
    }
    if (scanAt && cam.latlng.distanceTo(scanAt) > 2000) els.rescan && els.rescan.classList.add("etv-dot");
  }

  function measureElev(at, tries) {
    measuring = true;
    const id = ++reqId;
    const token = ++elevToken;
    const done = (v) => {
      window.removeEventListener("message", onElev);
      clearTimeout(to);
      measuring = false;
      if (token !== elevToken) return;          // الخريطة اتحركت أثناء القياس — القراءة دي مش صالحة
      if (v != null && isFinite(v)) {
        elevAt = at;
        if (elev == null || Math.abs(v - elev) >= 1) { elev = v; needPush = true; }
      } else if (tries < 1) {
        setTimeout(() => ET.active && measureElev(at, tries + 1), 1500);
        return;
      }
      if (needPush || !ET.revealed) { needPush = false; pushCam(); }
    };
    const onElev = (e) => { if (e.origin === EARTH_ORIGIN && e.data && e.data.etv && e.data.type === "elev" && e.data.id === id) done(e.data.elev); };
    const to = setTimeout(() => done(null), 9000);
    window.addEventListener("message", onElev);
    send({ etvCmd: "elev", id });
  }

  function reveal() {
    ET.revealed = true;
    layoutIframe();
    const b = getBase && getBase();
    if (b && map.hasLayer(b)) map.removeLayer(b);
    map.getContainer().classList.add("etv-earth-on");
    if (map.attributionControl) map.attributionControl.addAttribution(ATTR);
    setStatus("");
    if (!ET.pinned && !ET.dates.length) scan();
  }

  // ───────────────── messages from Google Earth ─────────────────
  function onMessage(e) {
    if (e.origin !== EARTH_ORIGIN) return;
    const fr = frames.find((f) => f.el && e.source === f.el.contentWindow);
    if (!fr) return;
    const m = e.data;
    if (!m || !m.etv) return;
    const isFront = fr.i === front;
    if (m.type === "state") {
      fr.states++; fr.state = m;
      if (m.ready && m.hist) {
        if (!fr.readyAt) fr.readyAt = Date.now();
        if (!fr.ready && (m.flightDone || m.flightDone === undefined || Date.now() - fr.readyAt > 15000)) {
          fr.ready = true;
          if (!isFront && ET.revealed) sendTo(fr, { etvCmd: "date", date: ET.pinned || ET.date });
        }
      }
    }
    if (m.type === "camAck") { onCamAck(fr, m.id); return; }
    if (!isFront) return;                                // باقي الرسايل من الظاهرة بس
    switch (m.type) {
      case "state": {
        lastState = m;
        if (m.ready && m.hist) {
          if (m.uiBottom && Math.abs(m.uiBottom - T) > 6) { T = m.uiBottom; layoutIframe(); if (ET.ready) schedulePush(50); }
          if (m.uiFooter && Math.abs(m.uiFooter - B) > 6) { B = m.uiFooter; layoutIframe(); if (ET.ready) schedulePush(50); }
          // نستنى Google Earth يقفل أنيميشن الطيران الأول (أو 15 ثانية بالكتير)
          if (!ET.ready && fr.ready) { ET.ready = true; schedulePush(0); }
          if (m.date && !scanning) ET.date = m.date;
        }
        render();
        break;
      }
      case "dateAck":
        if (m.date) { ET.date = m.date; sendTo(BK(), { etvCmd: "date", date: m.date }); }
        render(); break;
      case "scan": {
        if (!m.done) watchScan(); else clearTimeout(scanWatch);
        const list = (m.dates || []).slice().sort();
        ET.dates = list;
        setStatus(m.done ? "" : `جاري قراءة تواريخ المكان… (${list.length})`);
        if (m.done) {
          scanning = false;
          scanAt = cam ? cam.latlng : null;
          if (ET.date) sendTo(BK(), { etvCmd: "date", date: ET.pinned || ET.date });
          if (swapWaiting) swapTo(swapWaiting);
          els.rescan && els.rescan.classList.remove("etv-dot");
          if (list.length) toast(`🕘 لقيت ${list.length} تاريخ للمكان ده (من ${list[0]} لـ ${list[list.length - 1]})`, "ok");
          if (needPush) { needPush = false; pushCam(); }
        }
        render();
        break;
      }
      case "error": console.warn("[EarthTime]", m.cmd, m.message); break;
    }
  }

  // ───────────────── time controls ─────────────────
  function scan() {
    if (!ET.ready || scanning) return;
    stopPlay();
    scanning = true;
    setStatus("جاري قراءة تواريخ المكان…");
    send({ etvCmd: "scan" });
    watchScan();
    render();
  }

  // لو قراءة التواريخ وقفت من غير رد، مانسيبش الشريط متعلّق
  let scanWatch = null;
  function watchScan() {
    clearTimeout(scanWatch);
    scanWatch = setTimeout(() => {
      if (!scanning) return;
      scanning = false;
      setStatus(ET.dates.length ? "" : "مقدرتش أقرا التواريخ — دوس 🔄 تاني");
      render();
    }, 25000);
  }

  function goDate(date) {
    if (!date || ET.pinned) return;
    ET.date = date;
    sendAll({ etvCmd: "date", date });
    render();
  }

  function stepDate(dir) {
    if (ET.pinned || scanning) return;
    if (ET.dates.length) {
      const i = idxOf(ET.date);
      const j = dir === "older" ? i - 1 : i + 1;
      if (j >= 0 && j < ET.dates.length) goDate(ET.dates[j]);
    } else {
      send({ etvCmd: dir });
    }
  }

  function idxOf(date) {
    const L = ET.dates;
    if (!L.length) return -1;
    let best = 0;
    for (let i = 0; i < L.length; i++) if (L[i] <= (date || "")) best = i;
    const exact = L.indexOf(date);
    return exact >= 0 ? exact : best;
  }

  function togglePlay() {
    if (playTimer) { stopPlay(); return; }
    if (ET.pinned || !ET.dates.length) return;
    let i = idxOf(ET.date);
    if (i >= ET.dates.length - 1) i = -1;
    const tick = () => {
      i++;
      if (i >= ET.dates.length) { stopPlay(); return; }
      goDate(ET.dates[i]);
    };
    tick();
    playTimer = setInterval(tick, 2200);
    render();
  }
  function stopPlay() { if (playTimer) { clearInterval(playTimer); playTimer = null; render(); } }

  function togglePin() {
    if (ET.pinned) {
      ET.pinned = null; store.set("etv_pin", null);
      toast("🔓 الزمن اتفك — تقدر تغيّر التاريخ تاني", "info");
    } else {
      if (!ET.date) return;
      stopPlay();
      ET.pinned = ET.date; store.set("etv_pin", ET.pinned);
      toast(`📌 اتثبّت الزمن على ${ET.pinned} — هيفضل ثابت وانت بتتحرك وبتشتغل`, "ok");
      pushCam();
    }
    render();
  }

  // ───────────────── bottom bar ─────────────────
  function buildBar() {
    if (bar) { bar.style.display = ""; return; }
    bar = document.createElement("div");
    bar.className = "etv-bar";
    bar.innerHTML = `
      <div class="etv-row">
        <div class="etv-date" title="تاريخ الصورة المعروضة">
          <span class="etv-date-main">—</span>
          <span class="etv-date-sub">Google Earth</span>
        </div>
        <div class="etv-tl" dir="ltr">
          <button type="button" class="etv-btn" data-a="older" title="الصورة الأقدم">◀</button>
          <div class="etv-slider-wrap">
            <input type="range" class="etv-slider" min="0" max="0" value="0" step="1">
            <div class="etv-ticks"></div>
          </div>
          <button type="button" class="etv-btn" data-a="newer" title="الصورة الأحدث">▶</button>
        </div>
        <button type="button" class="etv-btn etv-wide" data-a="play" title="تشغيل تلقائي عبر التواريخ">▶ تشغيل</button>
        <button type="button" class="etv-btn etv-wide" data-a="pin" title="تثبيت الزمن الحالي وانت بتشتغل">📌 تثبيت</button>
        <button type="button" class="etv-btn" data-a="rescan" title="اقرا تواريخ المكان الحالي من جديد">🔄</button>
        <button type="button" class="etv-btn etv-wide" data-a="peek" title="اعرض Google Earth زي ما هو (للتشخيص)" style="display:none">👁 اعرض Google Earth</button>
        <button type="button" class="etv-btn" data-a="close" title="رجوع للمرئية العادية">✕</button>
      </div>
      <div class="etv-status"></div>`;
    map.getContainer().parentNode.appendChild(bar);
    els = {
      dateMain: bar.querySelector(".etv-date-main"), dateSub: bar.querySelector(".etv-date-sub"),
      slider: bar.querySelector(".etv-slider"), ticks: bar.querySelector(".etv-ticks"),
      older: bar.querySelector('[data-a="older"]'), newer: bar.querySelector('[data-a="newer"]'),
      play: bar.querySelector('[data-a="play"]'), pin: bar.querySelector('[data-a="pin"]'),
      rescan: bar.querySelector('[data-a="rescan"]'), status: bar.querySelector(".etv-status"),
      peek: bar.querySelector('[data-a="peek"]'),
    };
    // الشريط مايسيبش أحداث الماوس توصل للخريطة
    ["mousedown", "dblclick", "wheel", "touchstart", "pointerdown", "click", "contextmenu"].forEach((ev) =>
      bar.addEventListener(ev, (e) => e.stopPropagation()));
    bar.addEventListener("click", (e) => {
      const a = e.target.closest("[data-a]"); if (!a || a.disabled) return;
      ({ older: () => stepDate("older"), newer: () => stepDate("newer"), play: togglePlay, pin: togglePin,
         rescan: scan, close: () => ET.exit(), peek })[a.dataset.a]();
    });
    els.slider.addEventListener("input", () => {
      const d = ET.dates[+els.slider.value];
      if (d) els.dateMain.textContent = d;
    });
    els.slider.addEventListener("change", () => { stopPlay(); goDate(ET.dates[+els.slider.value]); });
  }

  let tickKey = "";
  function render() {
    if (!bar) return;
    const loading = !ET.revealed;
    els.dateMain.textContent = ET.pinned || ET.date || (loading ? "…" : "—");
    els.dateSub.textContent = ET.pinned ? "📌 زمن مثبّت" : "Google Earth";
    bar.classList.toggle("etv-pinned", !!ET.pinned);
    const n = ET.dates.length;
    els.slider.max = Math.max(0, n - 1);
    els.slider.value = Math.max(0, idxOf(ET.pinned || ET.date));
    const lock = !!ET.pinned || scanning || loading;
    els.slider.disabled = lock || n < 2;
    els.older.disabled = lock || (n ? idxOf(ET.date) <= 0 : !(lastState && lastState.canOlder));
    els.newer.disabled = lock || (n ? idxOf(ET.date) >= n - 1 : !(lastState && lastState.canNewer));
    els.play.disabled = lock || n < 2;
    els.play.textContent = playTimer ? "⏸ إيقاف" : "▶ تشغيل";
    els.play.classList.toggle("etv-on", !!playTimer);
    els.pin.disabled = loading || scanning || (!ET.pinned && !ET.date);
    els.pin.textContent = ET.pinned ? "🔓 فك التثبيت" : "📌 تثبيت";
    els.pin.classList.toggle("etv-on", !!ET.pinned);
    els.rescan.disabled = loading || scanning || !!ET.pinned;
    // علامات السنين تحت السلايدر
    const tw = els.ticks.clientWidth || 400;
    const key = ET.dates.join(",") + "|" + tw;
    if (key !== tickKey) {
      tickKey = key;
      els.ticks.innerHTML = "";
      let last = "", lastPx = -1e9;
      const marks = [];
      ET.dates.forEach((d, i) => { const y = d.slice(0, 4); if (y !== last) { last = y; marks.push([i, y]); } });
      marks.forEach(([i, y], k) => {
        const f = n > 1 ? i / (n - 1) : 0;
        const px = f * (tw - 14) + 7;
        const isLast = k === marks.length - 1;
        if (px - lastPx < 36) {                       // سنين كتير؟ نعرض بعضها بس (وآخر سنة دايمًا)
          if (!isLast) return;
          if (els.ticks.lastChild) els.ticks.removeChild(els.ticks.lastChild);
        }
        lastPx = px;
        const s = document.createElement("span");
        s.style.left = `${px}px`;
        s.textContent = y;
        els.ticks.appendChild(s);
      });
    }
  }

  function setStatus(t) { if (els.status) { els.status.textContent = t || ""; els.status.style.display = t ? "" : "none"; } }
  function updateHint() {
    if (!ET.revealed || scanning) return;
    setStatus(map.getZoom() < 13 ? "قرّب أكتر عشان المطابقة مع الشيب فايل تبقى دقيقة" : "");
  }

  // ───────────────── enter / exit ─────────────────
  const mapEvents = {
    move: () => applyTransform(map.getCenter(), map.getZoom(), false),
    zoom: () => applyTransform(map.getCenter(), map.getZoom(), false),
    zoomanim: (e) => {
      anim = { center: e.center, zoom: e.zoom };
      applyTransform(e.center, e.zoom, true);
      pushCam(anim);                          // Google Earth يبدأ يروح للزووم الجديد على طول
    },
    zoomend: () => { anim = null; },
    movestart: () => { clearTimeout(elevTimer); if (measuring) elevToken++; },
    moveend: () => {
      syncAliases();
      const last = pending || cam;
      if (last && last.zoom === map.getZoom() && last.center && last.center.equals(map.getCenter(), 1e-9)) return;
      schedulePush(160);
    },
    resize: () => schedulePush(120),
  };

  ET.enter = function (opts) {
    if (ET.active) return;
    opts = opts || {};
    map = opts.map || map;
    getBase = opts.getBaseLayer || getBase;
    toastFn = opts.toast || toastFn;
    if (!map) { toast("الخريطة لسه مجهزتش", "err"); return; }
    if (window.crossOriginIsolated === false) {
      console.warn("[EarthTime] الصفحة مش crossOriginIsolated — Google Earth ممكن مايشتغلش. شغّل الدليل من السيرفر (run.bat).");
    }
    ET.active = true;
    document.body.classList.add("etv-mode");
    buildBar();
    window.addEventListener("message", onMessage);
    map.on(mapEvents);
    const fresh = !FR().el;
    ensureIframe();
    if (fresh) {
      ET.ready = false; ET.revealed = false;
      setStatus("جاري تحميل Google Earth… (أول مرة بتاخد شوية)");
    } else {
      // الـ iframe كان متحمّل من قبل كده
      ET.revealed = false;
      setStatus("جاري تجهيز Google Earth…");
      if (ET.ready) schedulePush(0);
    }
    clearTimeout(ET._slow);
    clearInterval(diag.timer);
    diag.since = Date.now();
    diag.timer = setInterval(diagnose, 3000);
    render();
    emit();
  };

  // لو Google Earth ماجهزش: قول السبب بالظبط + زرار يوريه زي ما هو
  function diagnose() {
    if (!ET.active || ET.revealed) { clearInterval(diag.timer); if (els.peek) els.peek.style.display = "none"; return; }
    const secs = (Date.now() - diag.since) / 1000;
    if (secs < 12) return;
    const s = FR().state || lastState || {};
    let msg;
    if (window.crossOriginIsolated !== true) {
      msg = "⚠️ الدليل مش مفتوح من السيرفر الجديد — اقفل نافذة السيرفر السودا وكل نوافذ الجسر، وشغّل run.bat تاني";
    } else if (!diag.states && !diag.loaded) {
      msg = "⚠️ Google Earth مافتحش جوه الدليل لحد دلوقتي (النت؟) — دوس 👁 وشوف بيظهر إيه";
    } else if (!diag.states) {
      msg = "⚠️ Google Earth اتفتح بس كود الربط مش شغال جواه" + (diag.server ? " — " + diag.server : "");
      askServer();
    } else if (!s.ready) {
      msg = "⏳ Google Earth فاتح بس لسه مش جاهز" + (s.labels && s.labels.length ? " — ظاهر فيه: " + s.labels.slice(0, 6).join(" | ") : (s.flutter ? "" : " (لسه بيحمّل)"));
    } else if (!s.hist) {
      msg = "⏳ Google Earth جاهز وبيحاول يشغّل الصور التاريخية…" + (s.labels ? " — " + s.labels.slice(0, 6).join(" | ") : "");
    } else {
      msg = "⏳ Google Earth جاهز بس الكاميرا مابتردش — دوس 👁";
      schedulePush(0);
    }
    setStatus(msg);
    if (els.peek) els.peek.style.display = "";
    const log = JSON.stringify({ secs: Math.round(secs), coi: window.crossOriginIsolated, loaded: diag.loaded, states: diag.states, state: s });
    if (log !== diag.lastLog) { diag.lastLog = log; console.log("[EarthTime] diag", log); }
  }

  // اسأل السيرفر: Google Earth عارض إيه جوه الدليل؟
  function askServer() {
    if (diag.asking || Date.now() - (diag.askedAt || 0) < 6000) return;
    diag.asking = true; diag.askedAt = Date.now();
    const base = (window.LSBridge && window.LSBridge.base) || "";
    fetch(base + "/earth_debug").then((r) => r.json()).then((j) => {
      console.log("[EarthTime] server debug", JSON.stringify(j));
      const f = (j.frames || [])[0];
      if (!f) diag.server = "السيرفر مش شايف Google Earth جوه الدليل" + (j.all_frames ? " · frames: " + j.all_frames.map((u) => u.slice(0, 40)).join(" , ") : "");
      else if (f.error) diag.server = "خطأ: " + f.error;
      else diag.server = `كود الربط: ${f.etv ? "موجود" : "مش موجود"} · Flutter: ${f.flutter ? "✓" : "✗"} · أزرار: ${f.semantics} · معزول: ${f.coi ? "✓" : "✗"} · حقن: ${j.injected_html}` +
        (f.text ? ` · النص: «${f.text.slice(0, 90)}»` : "");
    }).catch((e) => { diag.server = "السيرفر مابيردش على التشخيص (" + e.message + ")"; })
      .finally(() => { diag.asking = false; });
  }

  // تشخيص: شيل المرئية العادية عشان يبان Google Earth زي ما هو
  function peek() {
    const b = getBase && getBase();
    if (b && map.hasLayer(b)) { map.removeLayer(b); map.getContainer().classList.add("etv-earth-on"); }
    else if (b) { b.addTo(map); map.getContainer().classList.remove("etv-earth-on"); }
    syncAliases();
    if (iframe) { iframe.style.clipPath = "none"; iframe.style.top = "0px"; iframe.style.height = "100%"; iframe.style.transform = "none"; }
  }

  ET.exit = function () {
    if (!ET.active) return;
    ET.active = false;
    clearInterval(diag.timer);
    stopPlay();
    if (scanning) { send({ etvCmd: "scanStop" }); scanning = false; }
    clearTimeout(pushTimer);
    map.off(mapEvents);
    window.removeEventListener("message", onMessage);
    const b = getBase && getBase();
    if (b && !map.hasLayer(b)) b.addTo(map);
    map.getContainer().classList.remove("etv-earth-on");
    if (map.attributionControl) map.attributionControl.removeAttribution(ATTR);
    layoutIframe();
    frames.forEach((fr) => { if (fr.el) fr.el.style.display = "none"; fr.cam = null; fr.pending = null; });
    swapWaiting = null;
    ET.revealed = false; syncAliases();
    if (bar) bar.style.display = "none";
    document.body.classList.remove("etv-mode");
    emit();
  };

  ET.map = () => map;   // للتشخيص من الكونسول
  ET.toggle = function (opts) { ET.active ? ET.exit() : ET.enter(opts); };

  window.EarthTime = ET;
})();
</script>
</body>
</html>
